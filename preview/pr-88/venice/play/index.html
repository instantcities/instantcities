  <script>
    // The loading screen's steps. This runs before the game's own scripts, so it carries its own
    // words; main.js ticks the steps off with bootStep() as it gets through them.
    (() => {
      const WORDS = {
        en: { download: 'Downloading the 3D engine and maps', horses: 'Saddling the horses', city: 'Building the city', paint: 'Drawing the first frame' },
        nl: { download: '3D-motor en kaarten downloaden', horses: 'Paarden zadelen', city: 'De stad bouwen', paint: 'Eerste beeld tekenen' },
      };
      let lang = 'en';
      try { lang = JSON.parse(localStorage.getItem('ghent3d.settings.v1'))?.lang || 'en'; } catch {}
      const words = WORDS[lang] || WORDS.en, list = document.getElementById('loaderSteps');
      // the last two steps are called after two of the city's funny lines, picked at random (a list,
      // or one per language)
      const told = [], jokes = (Array.isArray(told) ? told : told[lang] || told.en || []).map(j => [j, Math.random()]).sort((a, b) => a[1] - b[1]).map(j => j[0]);
      const text = { ...words, city: jokes[0] || words.city, paint: jokes[1] || words.paint };
      const items = Object.keys(WORDS.en).map(key => {
        const li = document.createElement('li');
        li.innerHTML = '<span class="mark"></span><span></span><small></small>';
        li.children[1].textContent = text[key];
        list.append(li);
        return [key, li];
      });
      window.bootStep = key => {
        const at = items.findIndex(([k]) => k === key);
        items.forEach(([, li], i) => { li.classList.toggle('done', i < at); li.classList.toggle('now', i === at); });
      };
      bootStep('download');
      // Which build this is (/build.json, filled in when the site is built): on the loading screen and
      // in the small print under the menu, to see at a glance whether the latest one is live.
      // (served as it is, unbuilt, it is no JSON: a local copy, 'dev')
      fetch('/preview/pr-88/build.json', { cache: 'no-store' }).then(r => r.json()).catch(() => ({})).then(({ commit, time }) => {
        const when = new Date(time), text = /^[0-9a-f]{7}$/.test(commit)
          ? `build: ${commit}` + (isNaN(when) ? '' : ` · ${when.toLocaleString(lang, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}`)
          : 'build: dev';
        const show = () => document.querySelectorAll('.buildtag').forEach(el => { el.textContent = el.closest('.legal') ? ` · ${text}` : text; });
        if (document.readyState === 'loading') addEventListener('DOMContentLoaded', show); else show();
      });
      // How much has come in so far: the 3D engine, the game's code and the city maps are a few MB.
      let bytes = 0;
      const size = items[0][1].lastChild;
      try {
        new PerformanceObserver(list => {
          for (const e of list.getEntries()) bytes += e.encodedBodySize || e.transferSize || 0;
          size.textContent = (bytes / 1e6).toFixed(1).replace('.', lang === 'nl' ? ',' : '.') + ' MB';
        }).observe({ type: 'resource', buffered: true });
      } catch {}
    })();
  </script>

  <script>
    // Keep a copy of the game for playing offline (sw.js). Not on a dev server, where every edit
    // should show up on reload; ?sw turns it on there too, to try it out.
    (() => {
      const local = ['localhost', '127.0.0.1'].includes(location.hostname) && !location.search.includes('sw');
      if ('serviceWorker' in navigator && !local) {
        addEventListener('load', async () => {
          try {
            await navigator.serviceWorker.register('sw.js');
            // the game used to be in the city's folder itself, its worker looking after that folder:
            // now the city's page is there, which needs no offline copy
            const before = new URL('../', location.href).href;
            for (const r of await navigator.serviceWorker.getRegistrations()) if (r.scope === before) r.unregister();
            const sw = (await navigator.serviceWorker.ready).active;
            // what this first visit loaded before the worker was there to see it
            const urls = performance.getEntriesByType('resource').map(e => e.name).filter(u => u.startsWith('http'));
            sw?.postMessage({ type: 'keep', urls: [location.origin + location.pathname, ...urls] });
          } catch { /* no offline copy: the game plays the same */ }
        });
      } else if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
      }
    })();
  </script>
