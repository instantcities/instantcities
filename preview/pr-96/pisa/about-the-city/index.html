<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <title>Instant Cities</title>
  <meta name="robots" content="noindex">
  <link rel="alternate" hreflang="en" href="https://instantcities.net/en/pisa/about-the-city/">
  <link rel="alternate" hreflang="fr" href="https://instantcities.net/fr/pise/a-propos-de-la-ville/">
  <link rel="alternate" hreflang="nl" href="https://instantcities.net/nl/pisa/over-de-stad/">
  <script>
    {
      const urls = { "en": "/preview/pr-96/en/pisa/about-the-city/", "fr": "/preview/pr-96/fr/pise/a-propos-de-la-ville/", "nl": "/preview/pr-96/nl/pisa/over-de-stad/" };
      let lang;
      try { lang = localStorage.getItem('site-lang'); } catch {}
      if (!urls[lang]) lang = (navigator.languages || [navigator.language]).map(l => String(l).slice(0, 2).toLowerCase()).find(l => urls[l]) || 'en';
      location.replace(urls[lang] + location.search + location.hash);
    }
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/preview/pr-96/en/pisa/about-the-city/"></noscript>
</head>

  </p>
</body>
</html>
