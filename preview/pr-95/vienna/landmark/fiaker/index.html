<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <title>Instant Cities</title>
  <meta name="robots" content="noindex">
  <link rel="alternate" hreflang="en" href="https://instantcities.net/en/vienna/landmark/fiaker/">
  <link rel="alternate" hreflang="fr" href="https://instantcities.net/fr/vienne/monument/fiaker/">
  <link rel="alternate" hreflang="nl" href="https://instantcities.net/nl/wenen/bezienswaardigheid/fiaker/">
  <script>
    {
      const urls = { "en": "/preview/pr-95/en/vienna/landmark/fiaker/", "fr": "/preview/pr-95/fr/vienne/monument/fiaker/", "nl": "/preview/pr-95/nl/wenen/bezienswaardigheid/fiaker/" };
      let lang;
      try { lang = localStorage.getItem('site-lang'); } catch {}
      if (!urls[lang]) lang = (navigator.languages || [navigator.language]).map(l => String(l).slice(0, 2).toLowerCase()).find(l => urls[l]) || 'en';
      location.replace(urls[lang] + location.search + location.hash);
    }
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/preview/pr-95/en/vienna/landmark/fiaker/"></noscript>
</head>
<body>

  </p>
</body>
</html>
