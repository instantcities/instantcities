<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Instant Cities</title>
  <meta name="robots" content="noindex">
  <link rel="alternate" hreflang="en" href="https://instantcities.net/en/vienna/landmark/michaelerplatz/">
  <link rel="alternate" hreflang="fr" href="https://instantcities.net/fr/vienne/monument/michaelerplatz/">
  <link rel="alternate" hreflang="nl" href="https://instantcities.net/nl/wenen/bezienswaardigheid/michaelerplatz/">
  <script>
    {
      const urls = { "en": "/en/vienna/landmark/michaelerplatz/", "fr": "/fr/vienne/monument/michaelerplatz/", "nl": "/nl/wenen/bezienswaardigheid/michaelerplatz/" };
      let lang;
      try { lang = localStorage.getItem('site-lang'); } catch {}
      if (!urls[lang]) lang = (navigator.languages || [navigator.language]).map(l => String(l).slice(0, 2).toLowerCase()).find(l => urls[l]) || 'en';
      location.replace(urls[lang] + location.search + location.hash);
    }
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/en/vienna/landmark/michaelerplatz/"></noscript>
</head>
<body>

  </p>
</body>
</html>
