  <script>
    {
      const urls = { "en": "/en/berlin/landmark/brandenburger-tor/", "fr": "/fr/berlin/monument/brandenburger-tor/", "nl": "/nl/berlijn/bezienswaardigheid/brandenburger-tor/" };
      let lang;
      try { lang = localStorage.getItem('site-lang'); } catch {}
      if (!urls[lang]) lang = (navigator.languages || [navigator.language]).map(l => String(l).slice(0, 2).toLowerCase()).find(l => urls[l]) || 'en';
      location.replace(urls[lang] + location.search + location.hash);
    }
  </script>

</head>
