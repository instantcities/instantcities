<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Instant Cities</title>
  <meta name="robots" content="noindex">
  <link rel="alternate" hreflang="en" href="https://instantcities.net/en/madrid/landmark/puerta-del-sol/">
  <link rel="alternate" hreflang="fr" href="https://instantcities.net/fr/madrid/monument/puerta-del-sol/">
  <link rel="alternate" hreflang="nl" href="https://instantcities.net/nl/madrid/bezienswaardigheid/puerta-del-sol/">
  <script>
    {
      const urls = { "en": "/en/madrid/landmark/puerta-del-sol/", "fr": "/fr/madrid/monument/puerta-del-sol/", "nl": "/nl/madrid/bezienswaardigheid/puerta-del-sol/" };
      let lang;
      try { lang = localStorage.getItem('site-lang'); } catch {}
      if (!urls[lang]) lang = (navigator.languages || [navigator.language]).map(l => String(l).slice(0, 2).toLowerCase()).find(l => urls[l]) || 'en';
      location.replace(urls[lang] + location.search + location.hash);
    }
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/en/madrid/landmark/puerta-del-sol/"></noscript>
</head>

  </p>
</body>
</html>
