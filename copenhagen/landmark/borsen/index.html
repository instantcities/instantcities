<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Instant Cities</title>
  <meta name="robots" content="noindex">
  <link rel="alternate" hreflang="en" href="https://instantcities.net/en/copenhagen/landmark/borsen/">
  <link rel="alternate" hreflang="fr" href="https://instantcities.net/fr/copenhague/monument/borsen/">
  <link rel="alternate" hreflang="nl" href="https://instantcities.net/nl/kopenhagen/bezienswaardigheid/borsen/">
  <script>
    {
      const urls = { "en": "/en/copenhagen/landmark/borsen/", "fr": "/fr/copenhague/monument/borsen/", "nl": "/nl/kopenhagen/bezienswaardigheid/borsen/" };
      let lang;
      try { lang = localStorage.getItem('site-lang'); } catch {}
      if (!urls[lang]) lang = (navigator.languages || [navigator.language]).map(l => String(l).slice(0, 2).toLowerCase()).find(l => urls[l]) || 'en';
      location.replace(urls[lang] + location.search + location.hash);
    }
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/en/copenhagen/landmark/borsen/"></noscript>
</head>
<body>
  <p>
    <a href="/en/copenhagen/landmark/borsen/" hreflang="en" lang="en">English</a>
    <a href="/fr/copenhague/monument/borsen/" hreflang="fr" lang="fr">Français</a>
    <a href="/nl/kopenhagen/bezienswaardigheid/borsen/" hreflang="nl" lang="nl">Nederlands</a>
  </p>
</body>
</html>
