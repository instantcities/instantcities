{%- comment -%}Silent compiled previews; no game or WebGL loaded on the home page.{%- endcomment -%}
<div class="live website-preview" aria-hidden="true">
  <img class="poster" src="{{ H.live_poster }}" alt="" fetchpriority="high">
  <script type="application/json" class="preview-playlist">[
    {%- for id in H.preview_cities -%}
      {%- assign city = site.data.cities | where: 'id', id | first -%}
      {"id":{{ id | jsonify }},"name":{{ city.name | jsonify }},"src":"/assets/previews/{{ id }}.mp4"}{% unless forloop.last %},{% endunless %}
    {%- endfor -%}
  ]</script>
</div>
