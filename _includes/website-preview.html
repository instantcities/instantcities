{%- comment -%}Silent compiled previews; no game or WebGL loaded on the home page. data-caption: the line under it, %c the city's name in the page's language (T, _includes/lang.html).{%- endcomment -%}
<div class="live website-preview" aria-hidden="true" data-caption="{{ T.preview | escape }}">
  <img class="poster" src="{{ H.live_poster }}" alt="" fetchpriority="high">
  <script type="application/json" class="preview-playlist">[
    {%- for id in H.preview_cities -%}
      {%- assign city = site.data.cities | where: 'id', id | first -%}
      {"id":{{ id | jsonify }},"name":{{ T.cities[id].name | default: city.name | jsonify }},"src":"/assets/previews/{{ id }}.mp4","page":"{% include city-url.html city=id %}","watch":"/{{ id }}/play/?watch=cards{{ QA }}"}{% unless forloop.last %},{% endunless %}
    {%- endfor -%}
  ]</script>
</div>
