# Netlify: a preview of the whole site for every pull request (its link comes as a comment on the
# PR), built the way GitHub Pages builds it. The site itself stays on GitHub Pages.
[build]
  command = "bundle exec jekyll build"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.3.6" # the github-pages gem's old Liquid does not run on Ruby 4
  LANG = "C.UTF-8" # or Sass chokes on the theme's non-ASCII characters
  LC_ALL = "C.UTF-8"

# Search engines leave the Netlify copies alone (every preview): the site to find is the one GitHub
# Pages serves, without this header.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
