<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Instant Cities</title>
  <meta name="robots" content="noindex">
  <link rel="alternate" hreflang="en" href="https://instantcities.net/en/delft/landmark/stadhuis/">
  <link rel="alternate" hreflang="fr" href="https://instantcities.net/fr/delft/monument/stadhuis/">
  <link rel="alternate" hreflang="nl" href="https://instantcities.net/nl/delft/bezienswaardigheid/stadhuis/">
  <script>
    {
      const urls = { "en": "/en/delft/landmark/stadhuis/", "fr": "/fr/delft/monument/stadhuis/", "nl": "/nl/delft/bezienswaardigheid/stadhuis/" };
      let lang;
      try { lang = localStorage.getItem('site-lang'); } catch {}
      if (!urls[lang]) lang = (navigator.languages || [navigator.language]).map(l => String(l).slice(0, 2).toLowerCase()).find(l => urls[l]) || 'en';
      location.replace(urls[lang] + location.search + location.hash);
    }
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/en/delft/landmark/stadhuis/"></noscript>
</head>
<body>
  <p>
    <a href="/en/delft/landmark/stadhuis/" hreflang="en" lang="en">English</a>
    <a href="/fr/delft/monument/stadhuis/" hreflang="fr" lang="fr">Français</a>
    <a href="/nl/delft/bezienswaardigheid/stadhuis/" hreflang="nl" lang="nl">Nederlands</a>
  </p>
</body>
</html>
