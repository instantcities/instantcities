<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Instant Cities</title>
  <meta name="robots" content="noindex">
  <link rel="alternate" hreflang="en" href="https://instantcities.net/en/rotterdam/landmark/laurenskerk/">
  <link rel="alternate" hreflang="fr" href="https://instantcities.net/fr/rotterdam/monument/laurenskerk/">
  <link rel="alternate" hreflang="nl" href="https://instantcities.net/nl/rotterdam/bezienswaardigheid/laurenskerk/">
  <script>
    {
      const urls = { "en": "/en/rotterdam/landmark/laurenskerk/", "fr": "/fr/rotterdam/monument/laurenskerk/", "nl": "/nl/rotterdam/bezienswaardigheid/laurenskerk/" };
      let lang;
      try { lang = localStorage.getItem('site-lang'); } catch {}
      if (!urls[lang]) lang = (navigator.languages || [navigator.language]).map(l => String(l).slice(0, 2).toLowerCase()).find(l => urls[l]) || 'en';
      location.replace(urls[lang] + location.search + location.hash);
    }
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/en/rotterdam/landmark/laurenskerk/"></noscript>
</head>
<body>
  <p>
    <a href="/en/rotterdam/landmark/laurenskerk/" hreflang="en" lang="en">English</a>
    <a href="/fr/rotterdam/monument/laurenskerk/" hreflang="fr" lang="fr">Français</a>
    <a href="/nl/rotterdam/bezienswaardigheid/laurenskerk/" hreflang="nl" lang="nl">Nederlands</a>
  </p>
</body>
</html>
