places:
  piazza-san-marco:
    name: La place Saint-Marc
    blurb: La grande place de Venise, fermée par la basilique Saint-Marc à une extrémité et bordée sur trois côtés par les arcades des anciens bureaux du gouvernement.
  piazzetta-san-marco:
    name: La Piazzetta San Marco
    blurb: La plus petite place entre le palais des Doges et la bibliothèque Marciana, qui s’ouvre sur la lagune entre les colonnes de saint Marc et de saint Théodore.
  mercerie:
    name: Les Mercerie
    blurb: La chaîne de ruelles commerçantes de la tour de l’Horloge sur la place Saint-Marc au Rialto, la rue principale de la ville depuis le Moyen Âge.
  campo-san-bartolomeo:
    blurb: La petite place animée au pied du pont du Rialto, où les Vénitiens se retrouvent sous la statue de bronze du dramaturge Carlo Goldoni.
  ponte-di-rialto:
    name: Le pont du Rialto
    blurb: Le pont de pierre de 1591 sur le Grand Canal, avec deux rangées de boutiques sur son arche. Jusqu’en 1854, c’était le seul pont sur le canal.
  canal-grande:
    name: Le Grand Canal
    blurb: La rue principale de Venise, une voie d’eau en S de presque quatre kilomètres bordée de palais, que seuls quatre ponts franchissent.
  campo-san-polo:
    blurb: L’une des plus grandes places de Venise, de l’autre côté du Grand Canal par rapport à Saint-Marc, où la ville tenait autrefois des corridas et des foires.
  campo-santo-stefano:
    blurb: Une longue place entre le pont de l’Accademia et Saint-Marc, avec la statue de l’écrivain Niccolò Tommaseo au milieu.
  ponte-dell-accademia:
    name: Le pont de l’Accademia
    blurb: Le pont de bois sur le Grand Canal vers les galeries de l’Accademia. Il fut érigé en 1933 comme pont provisoire et plus tard reconstruit sous la même forme.
  campo-della-salute:
    blurb: Les marches de Santa Maria della Salute, l’église à coupole que Baldassare Longhena bâtit à l’embouchure du Grand Canal après la peste de 1630.
  ponte-dei-sospiri:
    name: Le pont des Soupirs
    blurb: Le pont fermé de pierre blanche qui menait les prisonniers du palais des Doges aux prisons de l’autre côté du canal.
  riva-degli-schiavoni:
    blurb: Le large quai de pierre le long de la lagune à l’est du palais des Doges, nommé d’après les marchands de Dalmatie qui y amarraient leurs navires.
  campo-santa-maria-formosa:
    blurb: Une large place irrégulière à Castello autour de l’église Santa Maria Formosa, que Mauro Codussi reconstruisit à partir de 1492.
  campo-santi-giovanni-e-paolo:
    blurb: La place devant la grande église dominicaine où reposent 25 doges, avec la statue équestre du condottiere Bartolomeo Colleoni par Verrocchio.
  strada-nova:
    blurb: La plus large rue de Cannaregio, que la ville perça au XIXe siècle à travers des maisons et des canaux comblés pour ouvrir un itinéraire piéton vers la gare.
