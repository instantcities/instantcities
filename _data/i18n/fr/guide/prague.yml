places:
  staromestske-namesti:
    name: Place de la Vieille-Ville
    blurb: Le cœur de la Vieille-Ville depuis le Moyen Âge, entre l’église de Týn et l’hôtel de ville avec son horloge astronomique. Le monument à Jan Hus se dresse au milieu.
  celetna:
    blurb: Le premier tronçon de la Voie royale, l’itinéraire du couronnement des rois de Bohême, de la tour Poudrière à la place de la Vieille-Ville.
  ovocny-trh:
    name: Ovocný trh (le marché aux fruits)
    blurb: L’ancien marché aux fruits devant le Théâtre des États, où Don Giovanni de Mozart fut créé en 1787. Le Carolinum, le plus ancien bâtiment de l’université Charles, se dresse à côté.
  na-prikope:
    blurb: Une rue commerçante sur le tracé du fossé qui séparait autrefois la Vieille-Ville de la Nouvelle-Ville. Son nom signifie « sur le fossé ».
  vaclavske-namesti:
    name: Place Venceslas
    blurb: Le long marché aux chevaux de la Nouvelle-Ville de Charles IV, qui monte vers la statue de saint Venceslas et le Musée national. Les Praguois s’y sont rassemblés en 1918, 1968 et 1989.
  narodni:
    blurb: L’avenue qui va du Théâtre national, sur la Vltava, au bord de la Vieille-Ville. Le 17 novembre 1989, la police anti-émeute y frappa une marche d’étudiants, et la Révolution de velours commença.
  karlova:
    blurb: Une ruelle tortueuse de la Voie royale qui serpente de la Vieille-Ville au pont Charles, le long des murs du Klementinum.
  krizovnicke-namesti:
    name: Place des Chevaliers de la Croix
    blurb: La petite place à l’extrémité du pont Charles côté Vieille-Ville, entre la tour du pont de la Vieille-Ville, le Klementinum et l’église des Chevaliers de la Croix.
  karluv-most:
    name: Pont Charles
    blurb: Le pont de pierre sur la Vltava que Charles IV commença en 1357, bordé de trente statues de saints. Jusqu’en 1841, ce fut le seul pont de Prague sur le fleuve.
  vltava:
    name: La Vltava
    blurb: Le plus long fleuve de la République tchèque, entre la Vieille-Ville et la Petite-Côté. Smetana l’a mis en musique dans son poème symphonique La Moldau.
  kampa:
    blurb: L’île du côté de la Petite-Côté, coupée de la rive par un étroit bief, la Čertovka ou ruisseau du Diable, avec un parc et de vieilles roues de moulin.
  namesti-jana-palacha:
    name: Place Jan Palach
    blurb: La place au bord du fleuve devant la salle de concert du Rudolfinum, nommée d’après l’étudiant qui s’immola par le feu en 1969 pour protester contre l’occupation soviétique.
  parizska:
    blurb: La large avenue que la ville perça à travers la ville juive vers 1900, de la place de la Vieille-Ville à la Vltava, bordée de maisons Art nouveau et de boutiques de luxe.
  josefov:
    blurb: L’ancienne ville juive, nommée d’après l’empereur Joseph II. La ville en démolit la plus grande partie vers 1900, mais épargna ses synagogues, son hôtel de ville et son vieux cimetière.
  prazsky-hrad:
    name: Château de Prague
    blurb: Le château sur la crête de l’autre côté du fleuve, siège des rois de Bohême et aujourd’hui du président tchèque, avec la cathédrale Saint-Guy dans ses murs.
