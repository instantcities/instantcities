places:
  piazza-del-duomo:
    blurb: La place autour de la cathédrale, du campanile de Giotto et du baptistère octogonal à ses portes de bronze doré.
  via-dei-calzaiuoli:
    blurb: La principale rue piétonne de Florence, de la cathédrale à la Piazza della Signoria en passant par l’église de corporation d’Orsanmichele, nommée d’après les bonnetiers qui y avaient leurs boutiques.
  piazza-della-repubblica:
    blurb: La place que la ville dégagea à partir des années 1880 sur le site du forum romain, de l’ancien marché et du ghetto juif, avec son arc de triomphe et ses vieux cafés.
  piazza-della-signoria:
    blurb: Le cœur politique de Florence depuis sept siècles, devant le Palazzo Vecchio, avec une copie du David de Michel-Ange à sa porte.
  piazzale-degli-uffizi:
    blurb: La longue cour étroite entre les deux ailes des Offices, que Vasari construisit à partir de 1560 comme bureaux du gouvernement des Médicis. Des statues de Toscans célèbres se dressent dans ses niches.
  ponte-vecchio:
    blurb: Le pont de 1345 bordé de boutiques, où en 1593 le grand-duc Ferdinand Ier remplaça les bouchers par des orfèvres.
  arno:
    name: L’Arno
    blurb: Le fleuve de Florence, entre les quais de pierre des lungarni, traversé par le Ponte Vecchio et une série d’autres ponts.
  ponte-santa-trinita:
    blurb: Le gracieux pont d’Ammannati de 1569, détruit en 1944 et reconstruit en 1958 avec des pierres repêchées dans le fleuve.
  via-tornabuoni:
    blurb: La plus belle rue commerçante de Florence, bordée de maisons de mode et de palais Renaissance comme le Palazzo Strozzi.
  piazza-santa-maria-novella:
    blurb: La large place devant l’église dominicaine à la façade de marbre noir et blanc que Leon Battista Alberti acheva.
  piazza-santissima-annunziata:
    blurb: Une place calme d’arcades, avec la loge de Brunelleschi de l’Hôpital des Innocents, l’ancien hospice des enfants trouvés, sur un côté.
  piazza-santa-croce:
    blurb: La place devant l’église franciscaine où reposent Michel-Ange, Galilée et Machiavel. En juin, elle devient le terrain du calcio storico.
  piazza-pitti:
    blurb: La place en pente sous le Palazzo Pitti, le palais où s’installèrent les Médicis au XVIe siècle, avec le jardin de Boboli derrière.
  piazza-santo-spirito:
    blurb: La place de village de l’Oltrarno, devant l’église de Brunelleschi à la façade nue et inachevée, avec un marché le matin et des bars le soir.
