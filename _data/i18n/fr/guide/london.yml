places:
  thames:
    name: La Tamise
    blurb: Le fleuve à marées de Londres, qui monte et descend de plusieurs mètres deux fois par jour. Les murs de son Embankment cachent les égouts victoriens.
  westminster-bridge:
    blurb: Le pont de fer peint en vert de 1862 à côté des Chambres du Parlement, vert comme les bancs de la Chambre des communes.
  parliament-square:
    name: Parliament Square
    blurb: Une pelouse entre le Parlement, l’abbaye de Westminster et la Cour suprême, ceinte de statues d’hommes d’État comme Winston Churchill et Nelson Mandela.
  broad-sanctuary:
    blurb: La rue devant la façade ouest de l’abbaye de Westminster, nommée d’après le sanctuaire où les fugitifs pouvaient autrefois se réfugier de la loi.
  whitehall:
    blurb: La large rue des ministères de Trafalgar Square au Parlement, avec le Cénotaphe, le monument national aux morts de la guerre, au milieu.
  downing-street:
    blurb: La courte rue derrière des grilles de fer où vit le Premier ministre au numéro 10.
  horse-guards-parade:
    blurb: Le grand terrain de parade en gravier derrière Horse Guards, où se tient chaque juin le Trooping the Colour.
  trafalgar-square:
    blurb: La grande place de Londres, avec Nelson sur sa colonne, quatre lions de bronze et la National Gallery sur son côté nord.
  the-mall:
    blurb: L’avenue à revêtement rouge de l’Admiralty Arch à Buckingham Palace, itinéraire des cortèges royaux.
  st-jamess-park:
    blurb: Le plus ancien des parcs royaux, avec un lac, des pélicans et, depuis son pont, une vue sur Buckingham Palace.
  strand:
    blurb: L’ancienne route de Westminster à la Cité, autrefois le long de la berge, aujourd’hui bordée de théâtres, d’hôtels et du Savoy.
  victoria-embankment:
    name: Victoria Embankment
    blurb: La route riveraine que Joseph Bazalgette construisit sur des terres gagnées sur l’eau dans les années 1860, au-dessus d’un égout et de la District line.
  golden-jubilee-bridges:
    blurb: Deux passerelles de part et d’autre du chemin de fer du Hungerford Bridge, de Charing Cross à la South Bank.
  queens-walk:
    name: Le Queen’s Walk
    blurb: La promenade riveraine de la South Bank, devant le London Eye et les centres d’art, avec des vues sur le Parlement de l’autre côté.
