places:
  platz-der-republik:
    blurb: La grande pelouse devant le Reichstag, siège du Bundestag, sous la coupole de verre de Norman Foster.
  pariser-platz:
    blurb: La place à l’intérieur de la porte de Brandebourg, avec les ambassades de France et des États-Unis et l’hôtel Adlon. Elle doit son nom à la prise de Paris par les Alliés en 1814.
  ebertstrasse:
    blurb: La rue le long du Tiergarten du Reichstag à la Potsdamer Platz, en passant devant la porte de Brandebourg. Le Mur y passait, et le mémorial de l’Holocauste se trouve à côté.
  unter-den-linden:
    blurb: Le boulevard de la porte de Brandebourg à l’île aux Musées, où le Grand Électeur fit planter des tilleuls en 1647, bordé de l’Opéra d’État, de l’université Humboldt et de l’ancien Arsenal.
  friedrichstrasse:
    blurb: La longue rue commerçante de la Friedrichstadt baroque, qui croise Unter den Linden. Plus au sud, elle traversait le Mur au Checkpoint Charlie.
  wilhelmstrasse:
    blurb: Pendant un siècle, la rue du gouvernement prussien puis allemand, où Bismarck et plus tard Hitler eurent leurs chancelleries. L’ambassade de Grande-Bretagne s’y trouve aujourd’hui.
  gendarmenmarkt:
    blurb: Souvent appelée la plus belle place de Berlin, avec le Konzerthaus entre les églises jumelles française et allemande. Elle doit son nom à un régiment de cavalerie, les Gens d’armes, qui y avait ses écuries.
  bebelplatz:
    blurb: La place de Frédéric le Grand entre l’Opéra d’État, la cathédrale Sainte-Edwige et l’ancienne bibliothèque royale. Une plaque de verre dans le pavage donne sur des rayonnages vides, en mémoire de l’autodafé nazi de 1933.
  lustgarten:
    blurb: La pelouse entre l’Altes Museum, la cathédrale et le château, autrefois le jardin d’agrément des princes-électeurs.
  museumsinsel:
    name: L’île aux Musées
    blurb: L’extrémité nord de l’île dans la Spree, où la Prusse construisit cinq musées entre 1830 et 1930, de l’Altes Museum au Pergamon.
  schlossplatz:
    blurb: La place devant le château des Hohenzollern, que le gouvernement est-allemand fit sauter en 1950. L’Allemagne en a reconstruit les façades pour le Humboldt Forum, ouvert en 2021.
  spree:
    name: La Spree
    blurb: La rivière de Berlin, qui se divise autour de l’île qui porte l’île aux Musées et l’ancienne Cölln. Des bateaux de promenade la remontent devant la cathédrale et le Reichstag.
  nikolaiviertel:
    blurb: Le quartier autour de la Nikolaikirche, la plus ancienne église de Berlin, là où la ville est née. L’Allemagne de l’Est l’a reconstruit pour les 750 ans de la ville en 1987, en partie avec des copies de maisons disparues.
  karl-liebknecht-strasse:
    blurb: La large avenue est-allemande de la cathédrale vers l’Alexanderplatz, devant la Marienkirche médiévale et la tour de télévision.
  alexanderplatz:
    blurb: La grande place de Berlin-Est, nommée d’après la visite du tsar Alexandre Ier en 1805, avec l’Horloge universelle et la tour de télévision à côté.
