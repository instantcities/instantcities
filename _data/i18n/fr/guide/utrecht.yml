places:
  domtoren:
    name: La tour du Dom
    blurb: Le plus haut clocher d’église du pays, 112 mètres, avec 465 marches jusqu’au sommet.
  domplein:
    name: Domplein
    blurb: La place où se dressait la nef de la cathédrale jusqu’en 1674, au-dessus du fort romain.
  domkerk:
    name: La Domkerk
    blurb: Le chœur et le transept de la cathédrale gothique.
  pandhof:
    blurb: Le jardin du cloître d’herbes médiévales à côté de la Domkerk.
  oudegracht:
    name: Oudegracht
    blurb: Le canal médiéval avec ses caves de quai et ses terrasses au bord de l’eau.
  vismarkt:
    blurb: L’ancien marché aux poissons le long de l’Oudegracht, sous la tour du Dom.
  kromme-nieuwegracht:
    blurb: Le canal calme et courbe devant la Pieterskerk et le Paushuize.
  janskerkhof:
    blurb: La place autour de la Janskerk, avec son marché aux fleurs du samedi.
  pieterskerk:
    blurb: L’église romane de 1048.
  paushuize:
    blurb: La maison construite pour le seul pape néerlandais.
  academiegebouw:
    blurb: Le bâtiment principal de l’université, où fut signée l’Union d’Utrecht.
  speelklok:
    blurb: Le musée de la musique mécanique dans la Buurkerk.
  stadhuis:
    name: L’hôtel de ville
    blurb: L’hôtel de ville sur l’Oudegracht, une rangée de maisons médiévales derrière une seule façade.
  catharijneconvent:
    blurb: Le musée national de l’art chrétien dans un couvent médiéval.
  centraal-museum:
    blurb: Le plus ancien musée municipal du pays, avec Rietveld et les caravagesques d’Utrecht.
