places:
  graslei:
    blurb: Le quai de la rive est de l’ancien port, bordé des maisons de corporations des marchands et bateliers médiévaux.
  korenlei:
    blurb: Le quai en face de la Graslei, avec des maisons de marchands des XVIe au XVIIIe siècles.
  leie:
    name: La Lys
    blurb: La rivière qui traverse la vieille ville pour rejoindre l’Escaut. Son tronçon entre les ponts fut le port médiéval de Gand ; aujourd’hui, des bateaux de promenade partent de ses quais.
  sint-michielsbrug:
    blurb: Le pont de pierre sur la Lys d’où l’on voit la Graslei, la Korenlei et les trois tours de la vieille ville en rang.
  korenmarkt:
    name: Korenmarkt
    blurb: L’ancien marché au grain, une longue place au pied de l’église Saint-Nicolas, où passent les tramways et où commence la Veldstraat.
  emile-braunplein:
    name: Emile Braunplein
    blurb: La place ouverte entre l’église Saint-Nicolas et le beffroi, avec le pavillon de bois et de verre de la ville, la Stadshal.
  sint-baafsplein:
    blurb: La place devant la cathédrale Saint-Bavon, face au Théâtre néerlandais (NTGent).
  botermarkt:
    blurb: L’ancien marché au beurre, face à la façade Renaissance de l’hôtel de ville ; son côté gothique donne sur la Hoogpoort.
  werregarenstraat:
    blurb: Une ruelle étroite où les graffitis sont permis, repeints sans cesse.
  vrijdagmarkt:
    blurb: La grande place du marché du vendredi, pendant des siècles lieu de réunions et de révoltes, avec une statue de Jacob van Artevelde.
  kraanlei:
    blurb: Un quai le long de la Lys avec de vieilles maisons à pignon, nommé d’après la grue qui y déchargeait jadis les bateaux.
  patershol:
    blurb: Un dédale de ruelles médiévales derrière le Kraanlei, autrefois un quartier pauvre d’artisans, aujourd’hui plein de restaurants.
  groentenmarkt:
    blurb: L’ancien marché aux légumes à côté du long toit de la Grande Boucherie, la halle à la viande médiévale.
  sint-veerleplein:
    blurb: La place devant le Gravensteen, autrefois le lieu des exécutions publiques de la ville.
  veldstraat:
    blurb: La principale rue commerçante de Gand, qui descend vers le sud depuis la Korenmarkt, sans voitures.
