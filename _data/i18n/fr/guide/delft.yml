places:
  markt:
    blurb: La longue place du marché entre l’hôtel de ville et la Nieuwe Kerk.
  nieuwe-kerk:
    blurb: L’église gothique du Markt, avec les tombeaux de la maison d’Orange.
  stadhuis:
    blurb: L’hôtel de ville de Hendrick de Keyser autour d’une tour médiévale.
  waag:
    blurb: Le poids public derrière l’hôtel de ville.
  vermeer-centrum:
    blurb: Le centre consacré à Vermeer sur le Voldersgracht, là où se trouvait la guilde des peintres.
  voldersgracht:
    blurb: Le canal étroit derrière le côté nord du Markt.
  oude-kerk:
    blurb: La plus ancienne église, avec sa tour penchée et la tombe de Vermeer.
  oude-delft:
    blurb: Le plus vieux canal, qui a donné son nom à la ville.
  prinsenhof:
    blurb: Le couvent où vécut Guillaume d’Orange et où il fut abattu.
  gemeenlandshuis:
    blurb: La maison gothique de 1505 sur l’Oude Delft, avec ses armoiries peintes.
  wijnhaven:
    blurb: Le canal derrière le Waag, par où arrivait le vin.
  koornmarkt:
    blurb: Le canal du marché aux grains, bordé de terrasses.
  beestenmarkt:
    blurb: La place de l’ancien marché aux bestiaux, aujourd’hui pleine de cafés sous les arbres.
  oostpoort:
    blurb: La dernière porte de la ville, avec ses deux fines tours.
  paardenmarkt:
    blurb: La place dégagée où se trouvait la poudrière jusqu’en 1654.
