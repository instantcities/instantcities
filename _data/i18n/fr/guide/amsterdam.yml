overview:
- Amsterdam se trouve sur l’IJ, ancien bras de mer, dans un pays de polders gagnés sur l’eau, en bonne partie sous le niveau de la mer. Ses maisons reposent sur des pieux de bois enfoncés à travers la tourbe molle jusque dans le sable en dessous, et son vieux centre est un fer à cheval de canaux autour du Dam, la place où la ville est née.
- Instant Amsterdam vous fait parcourir ce centre. De la gare centrale, le Damrak mène vers le sud jusqu’au Dam, avec le Palais royal et la Nieuwe Kerk sur son côté ouest. Le Rokin et le Kalverstraat continuent vers le sud jusqu’au Spui et à la tour Munt, tandis qu’à l’ouest le Singel, le Herengracht, le Keizersgracht et le Prinsengracht décrivent des courbes autour de la vieille ville, devant la Westerkerk et la maison d’Anne Frank. À l’est du Dam se trouvent l’Oude Kerk, le quartier rouge et le Nieuwmarkt.
setting:
- Amsterdam se trouve dans la province de Hollande-Septentrionale, dans l’ouest des Pays-Bas, à environ 25 kilomètres de la mer du Nord, à laquelle le canal de la mer du Nord relie son port. L’IJ sépare la vieille ville d’Amsterdam-Noord, et les ferries qui le traversent depuis l’arrière de la gare centrale sont gratuits.
- 'La ville compte environ 165 canaux et bien plus d’un millier de ponts, plus que Venise. Son climat est doux et maritime : étés frais, hivers humides, vent et pluie fréquents en toute saison.'
today:
- Amsterdam est la capitale des Pays-Bas, même si le roi, le gouvernement et le parlement siègent à La Haye. Son économie repose sur la finance et les services aux entreprises, dont beaucoup dans le quartier de la Zuidas, sur la technologie et les entreprises créatives, sur le port et sur Schiphol, l’un des aéroports les plus fréquentés d’Europe. Le Rijksmuseum, le musée Van Gogh et la maison d’Anne Frank attirent des visiteurs du monde entier, et la municipalité cherche à limiter la foule dans le vieux centre.
- Les Amstellodamois font beaucoup de leurs trajets à vélo, sur un réseau de pistes cyclables rouges. Le jour du Roi, le 27 avril, les canaux se remplissent de bateaux et toute la ville devient orange. Le club de football de l’Ajax joue à la Johan Cruijff ArenA, au sud-est de la ville.
history:
- title: Un barrage dans l’Amstel
  text:
  - Au XIIIe siècle, les habitants de l’embouchure de l’Amstel construisirent un barrage en travers de la rivière pour retenir l’eau de l’IJ. Un village de pêcheurs et de commerçants grandit autour de lui, et en 1275 le comte Florent V de Hollande les exempta de péages dans son comté, la plus ancienne mention écrite d’Amsterdam. La ville reçut ses droits de cité vers 1300.
  - En 1345, raconte-t-on, un mourant ne put garder l’hostie de la communion, qui fut jetée au feu et retrouvée intacte. Le Miracle d’Amsterdam fit de la ville un lieu de pèlerinage. Ses marchands s’enrichirent avec la bière, le hareng et le commerce du grain avec la Baltique, et l’Oude Kerk, le plus ancien bâtiment de la ville, grandit avec eux.
- title: Le Siècle d’or
  text:
  - Pendant la révolte des Pays-Bas contre l’Espagne, Amsterdam passa du côté protestant en 1578. Quand les troupes espagnoles prirent Anvers en 1585, des milliers de marchands, d’artisans et de familles juives d’Espagne et du Portugal montèrent vers le nord, et Amsterdam prit la place d’Anvers comme capitale commerciale de l’Europe. En 1602, des marchands fondèrent la Compagnie néerlandaise des Indes orientales, et les actions qu’on s’y échangeait à Amsterdam firent de la ville le siège de l’une des premières Bourses du monde.
  - À partir de 1613, le conseil municipal fit creuser la ceinture de canaux, avec le Herengracht, le Keizersgracht et le Prinsengracht, et vendit les parcelles le long d’eux à de riches marchands. Sur le Dam, Jacob van Campen construisit un nouvel hôtel de ville, commencé en 1648, le plus grand d’Europe à l’époque. Rembrandt peignit La Ronde de nuit dans la ville en 1642.
- title: Capitale des Pays-Bas
  text:
  - Les guerres contre l’Angleterre et la France mirent fin au Siècle d’or, et les troupes françaises occupèrent le pays en 1795. En 1808, Louis Bonaparte, roi de Hollande, fit de l’hôtel de ville son palais royal, et après le départ des Français le nouveau royaume fit d’Amsterdam sa capitale, bien que le gouvernement restât à La Haye. Au XIXe siècle, le canal de la mer du Nord ouvrit une nouvelle route vers la mer, et le Rijksmuseum et la gare centrale s’élevèrent aux bords de la vieille ville.
  - Les troupes allemandes occupèrent Amsterdam de 1940 à 1945. En février 1941, ses ouvriers firent grève contre la persécution de leurs voisins juifs, mais les occupants déportèrent et assassinèrent la plupart des Juifs de la ville, dont Anne Frank, qui s’était cachée avec sa famille dans une maison du Prinsengracht de 1942 à 1944. Après la guerre, la ville accueillit hippies, squatteurs et manifestations, et en 2010 l’UNESCO inscrivit la ceinture de canaux au patrimoine mondial.
