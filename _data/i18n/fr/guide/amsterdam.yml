places:
  dam:
    name: Place du Dam
    blurb: La place sur le site du premier barrage de l’Amstel, avec le Palais royal, la Nieuwe Kerk et le Monument national blanc aux morts de la guerre.
  damrak:
    blurb: La rue animée de la gare centrale au Dam, sur l’ancien cours de l’Amstel, avec l’ancienne Bourse de Berlage d’un côté et une rangée de maisons de travers au bord de l’eau de l’autre.
  rokin:
    blurb: La large rue au sud du Dam, où coulait l’Amstel avant d’être comblé, en partie dans les années 1930 ; son dernier tronçon d’eau porte encore quelques bateaux.
  kalverstraat:
    blurb: La rue commerçante la plus fréquentée d’Amsterdam, une étroite ruelle piétonne du Dam au Munt, nommée d’après le marché aux veaux qui s’y tenait au Moyen Âge.
  spui:
    blurb: Une place de librairies et de cafés, avec un marché aux livres le vendredi et la porte cachée du Begijnhof.
  muntplein:
    blurb: La place autour de la Munttoren, une tour de l’enceinte médiévale où la ville frappa monnaie en 1672 et 1673.
  singel:
    blurb: Le canal le plus intérieur de la ceinture, les douves de la ville jusqu’au XVIe siècle, avec le marché aux fleurs flottant à son extrémité sud.
  herengracht:
    blurb: Le premier des trois grands canaux, nommé d’après les messieurs qui gouvernaient la ville, avec les plus belles maisons sur son Coude d’or.
  keizersgracht:
    blurb: Le plus large des canaux, nommé d’après l’empereur du Saint-Empire Maximilien Ier.
  prinsengracht:
    blurb: Le canal extérieur des trois, bordé de péniches habitées, où Anne Frank se cacha au numéro 263.
  westermarkt:
    blurb: La place au pied de la Westerkerk, la plus haute tour d’église de la ville, avec l’Homomonument au bord de l’eau.
  oudezijds-voorburgwal:
    blurb: L’un des plus anciens canaux, devant l’Oude Kerk, à travers le cœur du quartier rouge, De Wallen.
  nieuwmarkt:
    blurb: Une place animée autour du Waag, porte de ville du XVe siècle devenue plus tard poids public, au bord du quartier chinois.
  amstel:
    name: L’Amstel
    blurb: La rivière qui a donné son nom à Amsterdam, venant du sud devant le Stopera et le Skinny Bridge.
