places:
  duomo:
    name: Duomo di San Matteo
    blurb: La cathédrale normande de 1084 au-dessus du tombeau de saint Matthieu, avec sa cour à arcades et son campanile.
  via-dei-mercanti:
    blurb: La rue des marchands, la ruelle principale de la ville médiévale, pleine de boutiques.
  portanova:
    blurb: La place à l’extrémité est de la vieille ville, où la Via dei Mercanti rejoint le Corso.
  corso:
    blurb: La longue rue commerçante, fermée aux voitures, de la vieille ville à la gare.
  via-roma:
    blurb: La rue au pied de la vieille ville, avec le Palazzo di Città et ses cafés.
  lungomare:
    blurb: La promenade du front de mer sous les palmiers, face au golfe.
  gulf:
    name: Le golfe de Salerne
    blurb: La baie entre la côte amalfitaine et le Cilento, devant toute la ville.
  villa-comunale:
    blurb: Le jardin de la ville du XIXe siècle, le cœur des Luci d’Artista en hiver.
  teatro-verdi:
    blurb: L’opéra de 1872, rouge et or à l’intérieur.
  piazza-della-liberta:
    blurb: La grande place neuve au bord de la mer, à l’extrémité ouest du Lungomare, devant l’immeuble courbe du Crescent.
  molo-manfredi:
    blurb: La jetée avec le terminal de ferries de Zaha Hadid, d’où partent les bateaux vers la côte amalfitaine et Capri.
  giardino-della-minerva:
    blurb: Le jardin médiéval de plantes médicinales, en terrasses au-dessus de la vieille ville.
  acquedotto:
    name: L’aqueduc médiéval
    blurb: Les hautes arcades en ogive que, selon la légende, le diable bâtit en une nuit.
