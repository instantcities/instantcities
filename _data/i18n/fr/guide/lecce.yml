facts:
- Italie
- Pouilles (Puglia)
- Environ 95 000 habitants (ville), 770 000 (province de Lecce)
- Par les Messapiens, avant les Romains ; les Romains l’appelaient Lupiae
- L’Adriatique, à environ 11 kilomètres à l’est
