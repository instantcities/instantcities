  torre:
    name: La tour penchée
    blurb: Le campanile de la cathédrale, qui penche d’environ quatre degrés depuis le Moyen Âge.
  battistero:
    name: Le Baptistère
    blurb: Le plus grand baptistère d’Italie, célèbre pour son écho.
  camposanto:
    blurb: Le cloître de marbre du cimetière, dont les fresques ont brûlé en 1944.
  via-santa-maria:
    blurb: La rue de l’université, du Duomo jusqu’à l’Arno.
  orto-botanico:
    blurb: Le jardin botanique de l’université, fondé en 1544, l’un des plus anciens d’Europe.
  piazza-dei-cavalieri:
    blurb: La place des chevaliers de Saint-Étienne et de la Scuola Normale.
  borgo-stretto:
    blurb: La vieille rue commerçante sous les arcades.
  arno:
    blurb: Le fleuve qui fait un méandre au milieu de la ville, en route de Florence vers la mer.
  lungarno-gambacorti:
    blurb: La rive sud de l’Arno, avec Santa Maria della Spina et le Palazzo Blu.
  ponte-di-mezzo:
    blurb: Le pont du milieu, champ de bataille du Gioco del Ponte.
  santa-maria-della-spina:
    blurb: La minuscule église gothique au bord du fleuve.
  logge-di-banchi:
    blurb: La loggia ouverte du marché de la soie et de la laine, au sud du Ponte di Mezzo.
  corso-italia:
    blurb: La rue commerçante de la rive sud, fermée aux voitures, du fleuve à la gare.
  tuttomondo:
    blurb: La fresque de Keith Haring de 1989 sur le mur du couvent de Sant’Antonio.
