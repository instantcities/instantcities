places:
  seine:
    name: La Seine
    blurb: Le fleuve de Paris, entre des quais de pierre où les bouquinistes gardent leurs boîtes vertes. Ses berges à travers le centre sont classées au patrimoine mondial.
  ile-de-la-cite:
    blurb: L’île de la Seine où Paris est née, avec Notre-Dame, la Sainte-Chapelle et le palais de justice.
  pont-neuf:
    blurb: Malgré son nom, le « pont neuf » est le plus vieux pont de Paris, achevé en 1607 à la pointe ouest de l’île.
  place-dauphine:
    blurb: Un paisible triangle de maisons et de marronniers derrière le Pont Neuf, dessiné par Henri IV en 1607.
  parvis-notre-dame:
    name: Parvis Notre-Dame
    blurb: La place ouverte devant la cathédrale, où une étoile de bronze dans le pavé marque le point à partir duquel les routes de France mesurent leur distance à Paris.
  boulevard-du-palais:
    blurb: La rue qui traverse l’île devant le Palais de Justice, dont la cour cache la Sainte-Chapelle.
  place-du-chatelet:
    blurb: Une place au bout du Pont au Change, avec une fontaine et deux théâtres face à face, et la Tour Saint-Jacques gothique à quelques pas.
  place-de-l-hotel-de-ville:
    blurb: La place devant la mairie, appelée place de Grève jusqu’en 1803 et qui, pendant des siècles, servit de lieu d’exécution de la ville.
  rue-de-rivoli:
    blurb: La longue rue rectiligne de la rive droite, commencée sous Napoléon, avec des arcades le long du Louvre et du jardin des Tuileries.
  pont-des-arts:
    blurb: La passerelle métallique du Louvre à l’Institut de France, avec une vue le long du fleuve jusqu’à la pointe de l’île.
  boulevard-de-sebastopol:
    blurb: L’un des premiers boulevards d’Haussmann, percé tout droit vers le nord à partir du Châtelet dans les années 1850.
  place-georges-pompidou:
    blurb: La place en pente devant le Centre Pompidou, avec ses tuyaux et ses escalators à l’extérieur.
  place-saint-michel:
    blurb: La place au pied du boulevard Saint-Michel, avec une fontaine de l’archange terrassant le diable, où commence le Quartier latin.
  rue-de-la-huchette:
    blurb: Une étroite ruelle médiévale du Quartier latin, pleine de restaurants grecs, avec un petit théâtre où l’on joue La Cantatrice chauve de Ionesco depuis 1957.
