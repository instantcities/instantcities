places:
  stephansplatz:
    name: Stephansplatz
    blurb: La place autour de la cathédrale Saint-Étienne, où se rejoignent le Graben, la Kärntner Straße et la Rotenturmstraße. En dessous se trouve la Virgilkapelle, une chapelle médiévale que des ouvriers découvrirent en 1973 en creusant le métro.
  graben:
    name: Graben
    blurb: Une large rue piétonne sur le tracé du fossé du fort romain, qui lui a donné son nom. La colonne de la Peste baroque se dresse au milieu.
  kaerntner-strasse:
    name: Kärntner Straße
    blurb: La rue commerçante animée de Saint-Étienne à l’Opéra d’État, nommée d’après la Carinthie, Kärnten, la province où menait l’ancienne route.
  neuer-markt:
    blurb: Une place près de la Kärntner Straße avec la fontaine Donner et l’église des Capucins, dont la crypte abrite les tombeaux des Habsbourg.
  albertinaplatz:
    blurb: La place sous l’Albertina, derrière l’Opéra d’État, avec le mémorial contre la guerre et le fascisme d’Alfred Hrdlicka.
  kohlmarkt:
    blurb: La courte et élégante rue du Graben à la Hofburg, nommée d’après le charbon de bois qu’on y vendait, avec des bijoutiers, des maisons de mode et le confiseur Demel.
  michaelerplatz:
    blurb: La place ronde devant la porte Saint-Michel à dôme de la Hofburg, avec des vestiges romains en son milieu et la sobre Looshaus, qui scandalisa les Viennois en 1911.
  josefsplatz:
    blurb: Une place en forme de cour de la Hofburg avec une statue équestre de Joseph II, devant la salle d’apparat baroque de la Bibliothèque nationale.
  heldenplatz:
    name: La Heldenplatz
    blurb: La grande place ouverte de la Hofburg, avec des statues équestres du prince Eugène et de l’archiduc Charles. Du balcon de la Nouvelle Hofburg, Hitler proclama ici l’annexion de l’Autriche en 1938.
  ringstrasse:
    name: Le Ring
    blurb: Le boulevard autour de la vieille ville qui a pris la place des remparts à partir de 1857, bordé de l’Opéra, du Parlement, de l’hôtel de ville et des grands musées.
  herrengasse:
    blurb: La rue des palais urbains de la noblesse, de la Michaelerplatz à la Freyung, avec l’ancien parlement de Basse-Autriche et le Café Central.
  am-hof:
    blurb: La plus grande place de la vieille ville, où les ducs de Babenberg tenaient leur cour. Du balcon de son église, un héraut proclama la fin du Saint-Empire romain en 1806.
  judenplatz:
    blurb: Le centre du quartier juif médiéval, détruit en 1421, avec le mémorial de la Shoah de Rachel Whiteread, une bibliothèque coulée dans le béton aux livres retournés.
  hoher-markt:
    blurb: L’une des plus anciennes places de Vienne, au-dessus des vestiges du fort romain, avec l’Ankeruhr, une horloge Art nouveau où défilent à midi des figures historiques.
  donaukanal:
    name: Le canal du Danube
    blurb: Le bras du Danube le long du bord nord-est de la vieille ville ; le fleuve principal coule plus loin. L’été, bars et transats remplissent ses berges.
