places:
  placa-de-catalunya:
    blurb: La grande place entre la vieille ville et l’Eixample, où se rejoignent la Rambla, le Passeig de Gràcia et les lignes de métro.
  la-rambla:
    blurb: La promenade bordée d’arbres de la Plaça de Catalunya au port, le long du lit d’un ruisseau qui coulait autrefois hors des murs médiévaux.
  portal-de-l-angel:
    blurb: La rue commerçante piétonne animée de la Plaça de Catalunya vers la cathédrale, nommée d’après une porte des murs médiévaux.
  avinguda-de-la-catedral:
    blurb: Le grand espace dégagé devant la cathédrale, où l’on danse la sardane, la danse en rond catalane, le week-end.
  placa-del-rei:
    blurb: La place médiévale du palais royal des comtes et des rois, aujourd’hui partie du musée d’histoire de la ville, avec la Barcino romaine fouillée en dessous.
  barri-gotic:
    name: Quartier gothique
    blurb: La plus ancienne partie de la ville, sur le site de la Barcino romaine, un dédale de ruelles étroites entre la Rambla et la Via Laietana.
  carrer-del-bisbe:
    blurb: La ruelle de la Plaça de Sant Jaume à la cathédrale, traversée par un pont néogothique qui ne fut construit qu’en 1928.
  placa-de-sant-jaume:
    blurb: La place où le Palau de la Generalitat, siège du gouvernement catalan, fait face à l’hôtel de ville de l’autre côté de l’ancien forum romain.
  placa-reial:
    blurb: Une place à arcades des années 1840 près de la Rambla, avec des palmiers et des lampadaires dessinés par le jeune Gaudí.
  el-raval:
    blurb: La vieille ville à l’ouest de la Rambla, dont le nom signifie faubourg. Des couvents et des hôpitaux l’ont d’abord remplie, puis des filatures, et c’est aujourd’hui le quartier le plus mélangé de la ville.
  via-laietana:
    blurb: La grande avenue droite que la ville a percée à travers la vieille ville à partir de 1908, du port à l’Eixample.
  passeig-del-born:
    blurb: La longue et étroite place entre Santa Maria del Mar et l’ancien marché du Born, où la ville tenait tournois et foires au Moyen Âge.
  placa-del-portal-de-la-pau:
    blurb: La place au bas de la Rambla, près du port, où le monument à Colomb montre la mer.
  port-vell:
    name: Le Vieux Port
    blurb: Le vieux port de Barcelone au pied de la Rambla, où une passerelle de bois, la Rambla de Mar, mène au Maremàgnum et à l’aquarium.
  sagrada-familia:
    blurb: La grande basilique de Gaudí dans l’Eixample, commencée en 1882 et toujours en construction, à environ deux kilomètres au nord de la vieille ville.
