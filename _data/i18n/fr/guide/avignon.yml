places:
  rhone:
    name: Le Rhône
    blurb: Le fleuve large et rapide le long du nord et de l’ouest des remparts, en route des Alpes vers la Méditerranée.
  pont-saint-benezet:
    blurb: Le pont de la chanson, Sur le pont d’Avignon. Les crues ont emporté la plupart de ses arches, et il n’en reste que quatre.
  rocher-des-doms:
    blurb: Un jardin au sommet du rocher au-dessus du fleuve, avec un étang et une vue sur le Rhône jusqu’à Villeneuve-lès-Avignon et au mont Ventoux.
  place-du-palais:
    blurb: La large place en pente devant le palais des Papes, avec la cathédrale à son sommet.
  place-de-l-horloge:
    blurb: La place principale d’Avignon, bordée de terrasses de café, de l’hôtel de ville, du théâtre et d’un vieux manège.
  rue-de-la-republique:
    blurb: La grande rue commerçante toute droite, percée à travers la vieille ville au XIXe siècle de la porte de la gare à la place de l’Horloge.
  porte-de-l-oulle:
    blurb: Une porte des remparts ouest, face au Rhône et au pont vers l’île de la Barthelasse.
  rue-joseph-vernet:
    blurb: Une rue sinueuse d’hôtels particuliers des XVIIe et XVIIIe siècles, aujourd’hui occupée par des boutiques de mode et le musée Calvet.
  place-saint-pierre:
    blurb: Une petite place devant l’église gothique Saint-Pierre, dont les portes de noyer sculpté datent du XVIe siècle.
  place-pie:
    blurb: La place des Halles, le marché couvert, dont la façade est recouverte d’un jardin vertical de plantes vivantes.
  rue-des-marchands:
    blurb: Une étroite rue commerçante piétonne entre la place de l’Horloge et la place Carnot.
  rue-du-roi-rene:
    blurb: Une rue tranquille d’hôtels particuliers, où le poète Pétrarque aurait vu pour la première fois sa Laure, dans l’église Sainte-Claire, en 1327.
  rue-des-teinturiers:
    blurb: Une rue pavée sous les platanes le long d’un canal de la Sorgue, où travaillaient des teinturiers jusqu’au XIXe siècle et où quelques vieilles roues à aubes tournent encore.
  place-des-corps-saints:
    blurb: Une place ombragée de platanes et de terrasses de café au sud de la vieille ville.
