places:
  radhuspladsen:
    name: Place de l’Hôtel-de-Ville
    blurb: La grande place devant l’hôtel de ville de brique rouge de 1905, où commence Strøget. Tivoli se trouve de l’autre côté du boulevard.
  tivoli:
    name: Jardins de Tivoli
    blurb: Le jardin d’agrément ouvert en 1843 à côté de l’ancien fossé de la ville, aujourd’hui un lac à l’intérieur, avec des manèges, des concerts et des milliers de lumières le soir.
  stroget:
    blurb: La chaîne de rues piétonnes de la place de l’Hôtel-de-Ville à Kongens Nytorv. La ville l’a fermée aux voitures en 1962, ce qui en fit l’une des premières longues rues piétonnes d’Europe.
  gammeltorv:
    blurb: La plus ancienne place de Copenhague, sur Strøget, avec la fontaine Caritas de 1608. L’ancien tribunal se trouve sur Nytorv à côté.
  grabrodretorv:
    blurb: Une petite place pavée sur le site d’un couvent franciscain, les Frères gris, bordée de vieilles maisons colorées et de terrasses de restaurant.
  kobmagergade:
    blurb: Une rue piétonne qui monte vers le nord depuis Strøget devant la Tour ronde, l’observatoire que Christian IV fit construire avec une rampe en spirale à la place d’escaliers.
  amagertorv:
    blurb: Le tronçon le plus large de Strøget, avec la fontaine de la Cigogne, nommée d’après les fermiers d’Amager qui y vendaient leurs produits.
  hojbro-plads:
    blurb: La place au bout de Strøget face à Slotsholmen, avec une statue équestre de l’évêque Absalon, le fondateur de la ville.
  gammel-strand:
    blurb: L’ancien rivage de l’autre côté du canal depuis Christiansborg, où les poissonnières vendaient autrefois la pêche et d’où partent aujourd’hui les bateaux de canal.
  slotsholmen:
    blurb: L’île où Absalon construisit son château, aujourd’hui occupée par le palais de Christiansborg et l’ancienne Bourse, Børsen.
  kongens-nytorv:
    blurb: La plus grande place de la ville, aménagée sous Christian V dans les années 1670, avec sa statue équestre au milieu et le Théâtre royal danois à côté.
  nyhavn:
    blurb: Le canal creusé de Kongens Nytorv au port dans les années 1670, bordé de maisons peintes de couleurs vives et de vieux bateaux de bois. Hans Christian Andersen a vécu dans trois de ses maisons.
  bredgade:
    blurb: La large rue principale de Frederiksstaden, qui monte vers le nord depuis Kongens Nytorv devant l’église de Marbre jusqu’au Musée du design.
  amalienborg:
    name: Place du palais d’Amalienborg
    blurb: La place octogonale de quatre palais identiques, demeure de la famille royale depuis 1794, avec Frédéric V à cheval au milieu. La garde y est relevée chaque jour à midi.
  christianshavns-kanal:
    name: Canal de Christianshavn
    blurb: Le canal à travers Christianshavn, le quartier de l’autre côté du port que Christian IV aménagea sur des terres gagnées sur l’eau à partir de 1619, sur le modèle d’Amsterdam.
