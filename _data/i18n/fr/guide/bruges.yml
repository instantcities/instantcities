places:
  markt:
    blurb: La place du marché au cœur de Bruges, sous le beffroi, avec la statue de Jan Breydel et Pieter de Coninck, les chefs de 1302.
  burg:
    blurb: La place sur le site de la forteresse des comtes, avec l’hôtel de ville gothique et la basilique du Saint-Sang.
  steenstraat:
    blurb: La rue commerçante animée du Markt vers l’ouest, en direction de la cathédrale Saint-Sauveur et du ’t Zand.
  wollestraat:
    blurb: L’ancienne rue de la laine, du Markt à côté du beffroi vers le sud jusqu’au canal.
  blinde-ezelstraat:
    blurb: La « rue de l’Âne aveugle », une ruelle qui passe sous une arche du Burg jusqu’au canal et au Vismarkt.
  rozenhoedkaai:
    blurb: 'Le quai sur un coude du canal avec la vue la plus connue de Bruges : de vieilles maisons sur l’eau et le beffroi derrière.'
  dijver:
    blurb: Une rue le long du canal sous les tilleuls, avec le musée Groeninge et le palais Gruuthuse.
  huidenvettersplein:
    blurb: Une petite place au bord du canal autour de l’ancienne maison de la corporation des tanneurs, aujourd’hui pleine de terrasses de restaurant.
  vismarkt:
    blurb: Le marché aux poissons, avec des étals de pierre sous des colonnades de 1821, où les poissonniers vendent encore le matin.
  groenerei:
    blurb: Un quai tranquille le long du canal, avec l’hospice De Pelikaan.
  reien:
    name: Les canaux
    blurb: Les canaux de Bruges, qui portaient autrefois les marchandises aux marchés ; des bateaux ouverts y emmènent aujourd’hui les visiteurs.
  jan-van-eyckplein:
    blurb: L’ancien port intérieur, avec la douane médiévale, la loge des marchands et une statue de Jan van Eyck.
  mariastraat:
    blurb: La rue qui passe devant l’église Notre-Dame, avec sa tour de brique de 115 mètres, et l’hôpital Saint-Jean, où se trouvent les tableaux de Memling.
  begijnhof:
    name: Béguinage
    blurb: 'Le béguinage, fondé en 1245 : des maisons blanches autour d’une pelouse sous de grands arbres, où vivaient autrefois des béguines, des femmes pieuses célibataires.'
  minnewater:
    blurb: Le « lac d’amour », autrefois le bassin où s’amarraient les péniches de Gand, aujourd’hui un lac tranquille dans un parc.
