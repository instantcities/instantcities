  piazza-della-signoria:
    name: Piazza della Signoria
    blurb: "En plein air, devant le Palazzo Vecchio : la copie du David de Michel-Ange à sa porte."
  sistina:
    name: La chapelle Sixtine
    blurb: Le plafond de Michel-Ange et son Jugement dernier, au Vatican.
  rijksmuseum:
