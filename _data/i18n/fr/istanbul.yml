title: 'Instant Istanbul : visite virtuelle en 3D et jeu gratuits d’Istanbul'
description: 'Faites gratuitement la visite virtuelle en 3D de la vieille péninsule d’Istanbul dans votre navigateur, puis parcourez-la vous-même à vélo, à pied ou au galop : explorez ou faites la course, seul ou à deux sur un même clavier.'
tagline: Explorez ou faites la course à vélo, à pied ou à cheval entre les mosquées et les bazars d’Istanbul !
lead: Parcourez la vieille péninsule d’Istanbul en 3D, entre la Corne d’Or et la mer de Marmara, devant Sainte-Sophie, la Mosquée bleue, le Grand Bazar et les quais d’Eminönü, avec chaque bâtiment d’OpenStreetMap.
features:
- title: Le vrai Istanbul
  text: Promenez-vous parmi quelque 4 100 bâtiments reconstruits en 3D à partir d’OpenStreetMap sur la vieille péninsule, de Sultanahmet à la Corne d’Or, avec la mer tout autour de sa pointe. Le reste de la ville suivra.
- title: Coupoles, bazars et Corne d’Or
  text: Visitez Sainte-Sophie, la Mosquée bleue et l’Hippodrome, trouvez la citerne Basilique et la porte du palais de Topkapı, flânez dans le Grand Bazar et descendez devant la gare de Sirkeci jusqu’à la Mosquée neuve et au bazar aux épices d’Eminönü.
- title: 'Une course : Sultanahmet'
  text: Foncez de Sainte-Sophie par la Divan Yolu jusqu’à la colonne de Constantin et au Grand Bazar, descendez l’Ankara Caddesi jusqu’à Sirkeci, et retour devant le parc de Gülhane et la porte du palais de Topkapı.
intro: 'Istanbul s’étend sur les deux rives du Bosphore, le détroit entre la mer Noire et la mer de Marmara, moitié en Europe, moitié en Asie. Pendant seize siècles, elle a été une capitale : celle des empereurs romains et byzantins sous le nom de Constantinople, puis celle des sultans ottomans. Sa vieille péninsule, entre la Corne d’Or et la mer, abrite Sainte-Sophie, la Mosquée bleue, le palais de Topkapı et le Grand Bazar. C’est aujourd’hui la plus grande ville de Turquie, avec plus de quinze millions d’habitants.'
famous:
