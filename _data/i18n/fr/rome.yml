# Rome's page in French (_layouts/city.html, at /fr/<slug>/): the words of its block in
# _data/cities.yml, the intro of its guide (_data/about/rome.json) and its landmarks' names and blurbs
# (_data/landmarks/rome.json, by id; a name it leaves out stays as it is). What this leaves out stays English.
title: 'Instant Rome : visite virtuelle en 3D et jeu gratuits de Rome'
description: 'Faites gratuitement la visite virtuelle en 3D du centre de Rome dans votre navigateur, puis parcourez-le vous-même à vélo, à pied ou au galop : explorez ou faites la course, seul ou à deux sur un même clavier.'
tagline: Explorez ou faites la course à vélo, à pied ou à cheval dans la Rome antique !
lead: Parcourez le cœur de Rome en 3D, par la Via del Corso, devant le Panthéon, la Piazza Navona et la fontaine de Trevi, avec chaque bâtiment d’OpenStreetMap.
features:
- title: La vraie Rome
  text: 'Promenez-vous parmi quelque 6 000 bâtiments reconstruits en 3D à partir d’OpenStreetMap : un premier morceau du centre, et le reste de la ville suivra.'
- title: Rome antique et baroque
  text: Remontez la Via del Corso de la Piazza Venezia jusqu’à la colonne de la Piazza Colonna, visitez le Panthéon et la Piazza Navona, et poussez jusqu’à la fontaine de Trevi, au Forum et au Colisée.
- title: 'Une course : centre de Rome'
  text: Foncez de la Piazza Venezia par la Via del Corso jusqu’à la colonne de la Piazza Colonna, devant le Panthéon, et retour par le Largo di Torre Argentina.
intro: Rome est la capitale de l’Italie et l’une des plus vieilles villes d’Europe habitées sans interruption. Pendant mille ans, elle a gouverné un empire autour de la Méditerranée, puis elle est devenue la ville des papes ; aujourd’hui, ses ruines romaines, ses palais de la Renaissance et ses fontaines baroques se côtoient dans une capitale moderne et animée.
famous:
- Le Colisée, le Forum et le Panthéon, les monuments les mieux conservés de la Rome antique
- Le Vatican, le plus petit pays du monde, avec Saint-Pierre et la chapelle Sixtine
- Les places et fontaines baroques du Bernin et de Borromini, comme la Piazza Navona et la fontaine de Trevi
- Les pâtes carbonara, le cacio e pepe et les petites fontaines vertes, les nasoni
landmarks:
  colosseo:
    name: Colisée
    blurb: Le grand amphithéâtre de la Rome antique, inauguré en 80 apr. J.-C. pour des combats de gladiateurs devant quelque 50 000 personnes.
  pantheon:
    name: Panthéon
    blurb: Un temple de tous les dieux rebâti sous Hadrien, avec la plus grande coupole en béton non armé au monde.
  fontana-di-trevi:
    name: Fontaine de Trevi
    blurb: 'La plus grandiose fontaine de Rome : une pièce lancée par-dessus l’épaule promet que vous reviendrez.'
  piazza-navona:
    blurb: Une longue place baroque sur le tracé du stade de Domitien, avec la fontaine des Quatre-Fleuves du Bernin.
  foro-romano:
    name: Forum romain
    blurb: 'Le cœur de la Rome antique : temples, basiliques et Curie du Sénat, dans un vallon entre les collines.'
  vittoriano:
    blurb: L’immense monument de marbre blanc à Victor-Emmanuel II sur la Piazza Venezia, surnommé la machine à écrire.
  campo-de-fiori:
    blurb: Une place animée avec un marché le matin et, au milieu, la statue encapuchonnée de Giordano Bruno.
  colonna-di-marco-aurelio:
    name: Colonne de Marc Aurèle
    blurb: Une colonne de marbre sculptée des guerres de l’empereur sur le Danube, debout sur la Piazza Colonna depuis le IIe siècle.
  largo-di-torre-argentina:
    blurb: Quatre temples de la République en contrebas de la rue, à côté de l’endroit où Jules César fut assassiné.
credits: Données cartographiques © les contributeurs d’OpenStreetMap (ODbL).
