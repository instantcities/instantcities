# london's landmarks in French (_data/landmarks/london.json, by id): name (where it differs), blurb (the card), text (the story),
# history, visit (going to see it) and dates, each as in the English; what is left out stays English.
big-ben:
  blurb: La grosse cloche de la tour de l’horloge du Parlement, une tour qui s’appelle aujourd’hui Elizabeth Tower.
  text:
  - Big Ben est à proprement parler le nom de la cloche de 13,7 tonnes à l’intérieur de la tour, coulée en 1858 ; la tour elle-même fut rebaptisée Elizabeth Tower en 2012 pour le jubilé de diamant de la reine. Son horloge, avec quatre cadrans de sept mètres de large, marque l’heure depuis 1859.
  - Les sonneries de la cloche sont diffusées sur la BBC, et au Nouvel An toute la Grande-Bretagne les écoute.
houses-of-parliament:
  name: Parlement de Westminster
  blurb: Le palais de Westminster sur la Tamise, rebâti en style gothique après l’incendie de 1834.
  text:
  - Des rois vécurent dans le palais de Westminster à partir du XIe siècle ; à partir du XVIe, c’était la demeure du Parlement. Presque tout brûla en 1834, sauf Westminster Hall de 1097.
  - Charles Barry et Augustus Pugin le reconstruisirent en style néogothique, avec plus d’un millier de pièces, la Chambre des communes et la Chambre des lords, et la Victoria Tower à l’extrémité sud.
westminster-abbey:
  name: Abbaye de Westminster
  blurb: L’église où les souverains anglais puis britanniques sont couronnés depuis 1066.
  text:
  - Chaque couronnement depuis celui de Guillaume le Conquérant le jour de Noël 1066 a eu lieu dans l’abbaye de Westminster, le plus récemment celui de Charles III en 2023. L’église gothique que l’on voit fut commencée sous Henri III en 1245.
  - Rois et reines y sont enterrés, et au Poets’ Corner des écrivains de Chaucer à Dickens ; Isaac Newton et Charles Darwin reposent dans la nef.
trafalgar-square:
  blurb: Nelson sur sa colonne, quatre lions de bronze et la National Gallery sur le côté nord.
  text:
  - Trafalgar Square fut aménagée dans les années 1840 pour commémorer la victoire de l’amiral Nelson à Trafalgar en 1805. Nelson se tient sur une colonne d’environ 52 mètres de haut, gardée par quatre lions de bronze d’Edwin Landseer.
  - Sur son côté nord se dresse la National Gallery. Son quatrième socle, vide pendant plus de 150 ans, montre aujourd’hui une œuvre d’art contemporain qui change.
national-gallery:
  blurb: La collection britannique de peinture européenne, gratuite, sur le côté nord de Trafalgar Square.
  text:
  - La National Gallery ouvrit en 1824 avec 38 tableaux et s’installa à Trafalgar Square en 1838. Elle abrite aujourd’hui quelque 2 300 œuvres, du Portrait des Arnolfini de Van Eyck aux Tournesols de Van Gogh.
  - Comme les autres musées nationaux britanniques, elle se visite gratuitement.
downing-street:
  blurb: Le numéro 10, résidence des Premiers ministres britanniques depuis 1735, derrière des grilles noires donnant sur Whitehall.
  text:
  - George II offrit le numéro 10 à Robert Walpole, premier Premier ministre de Grande-Bretagne, qui s’y installa en 1735. Derrière sa célèbre porte noire au heurtoir de laiton se cache une maison bien plus grande qu’elle n’en a l’air.
  - Depuis 1989, la rue est fermée par des grilles. Un chat, le Chief Mouser du Cabinet Office, y vit aussi.
horse-guards:
  blurb: Les cavaliers de la Household Cavalry montent la garde sur Whitehall tous les jours.
  text:
  - Horse Guards fut construit dans les années 1750 comme entrée des palais royaux. Deux cavaliers de la Household Cavalry montent la garde à sa porte sur Whitehall de dix heures à quatre heures, en casques à plumet et cuirasses brillantes.
  - Derrière, sur Horse Guards Parade, le Trooping the Colour marque chaque juin l’anniversaire officiel du roi.
london-eye:
  blurb: La grande roue d’observation de l’autre côté de la Tamise, construite pour l’an 2000.
  text:
  - Le London Eye ouvrit au tournant du millénaire, haut de 135 mètres, alors la plus haute grande roue du monde. Ses 32 capsules de verre mettent une demi-heure à faire le tour, assez lentement pour monter et descendre pendant qu’elle bouge.
  - Du sommet, on voit tout Westminster en dessous, et par temps clair jusqu’à une quarantaine de kilomètres.
westminster-bridge:
  name: Pont de Westminster
  blurb: Le pont vert sur la Tamise à côté de Big Ben, peint de la couleur des bancs de la Chambre des communes.
  text:
  - Le pont actuel fut ouvert en 1862, en fonte sur sept arches. Il est peint en vert, la couleur des sièges de cuir de la Chambre des communes, le côté du Parlement le plus proche.
  - Lambeth Bridge, à l’autre bout du palais, est rouge, comme les bancs de la Chambre des lords.
british-museum:
  name: Le British Museum
  blurb: Le premier musée public national du monde, à Bloomsbury, avec la pierre de Rosette et les marbres du Parthénon.
  text:
  - Le Parlement acheta la collection du médecin sir Hans Sloane en 1753 et fonda le British Museum autour d’elle ; il ouvrit en 1759. Le bâtiment néo-grec de sir Robert Smirke, avec sa façade de colonnes ioniques, fut achevé en 1852, et en 2000 Norman Foster couvrit sa Great Court de verre.
  - Il abrite quelque huit millions d’objets, parmi lesquels la pierre de Rosette, les sculptures du Parthénon et Ramsès II, le Jeune Memnon. Comme les autres musées nationaux britanniques, il se visite gratuitement. Il se trouve au nord de la partie de Londres que cartographie le jeu, mais on peut tout de même entrer dans trois de ses salles.
black-cab:
  name: Le black cab
  blurb: Les taxis de Londres, assez hauts pour un homme en haut-de-forme, conduits par des chauffeurs qui connaissent chaque rue par cœur.
  text:
  - 'Le black cab est construit selon les règles propres de Londres : assez haut, dit-on, pour qu’un gentleman garde son chapeau melon, et avec un rayon de braquage de seulement 25 pieds, pour pouvoir faire demi-tour dans l’étroit Savoy Court.'
  - 'Pour obtenir leur licence, les chauffeurs passent des années à apprendre The Knowledge : quelque 25 000 rues et chaque monument dans un rayon de six miles autour de Charing Cross, sans carte.'
double-decker:
  name: Le double-decker rouge
  blurb: Les bus rouges à deux étages qui transportent Londres depuis le temps des omnibus à chevaux.
  text:
  - Londres fait circuler des bus à impériale depuis que les omnibus à chevaux ont mis des sièges sur leur toit au XIXe siècle. Le Routemaster de 1956, avec sa plate-forme ouverte à l’arrière, devint l’emblème de la ville.
  - Les bus d’aujourd’hui sont toujours rouges et toujours à deux étages. Des sièges avant de l’étage, on a la meilleure vue de la ville pour le prix d’un ticket de bus.
red-phone-box:
  name: La cabine téléphonique rouge
  blurb: Les cabines téléphoniques rouges en fonte de Giles Gilbert Scott, des années 1920 et 1930.
  text:
  - La cabine téléphonique rouge fut dessinée par Giles Gilbert Scott, la K2 en 1924 et la plus petite K6 en 1935 pour le jubilé du roi George V. Des dizaines de milliers furent installées dans tout le pays.
  - Peu sont encore utilisées pour téléphoner ; beaucoup sont devenues de minuscules bibliothèques, des boîtes à défibrillateur ou des stands de café, et quelques-unes se dressent encore sur Whitehall.
changing-the-guard:
  name: La relève de la garde
  blurb: La cérémonie où la garde du roi passe le relais à la nouvelle garde, en tuniques rouges et bonnets à poil.
  text:
  - Devant Buckingham Palace, les Foot Guards, en tuniques rouges et hauts bonnets à poil, passent la garde à la compagnie suivante au son d’une fanfare. À Horse Guards, la garde à cheval est relevée chaque matin.
  - Les gardes sont des soldats en service ; il leur est interdit de parler aux visiteurs qui viennent les regarder.
