# barcelona's landmarks in French (_data/landmarks/barcelona.json, by id): name (where it differs), blurb (the card), text (the story),
# history, visit (going to see it) and dates, each as in the English; what is left out stays English.
la-rambla:
  blurb: La promenade bordée d’arbres de la Plaça de Catalunya jusqu’à la mer, la rue la plus animée de Barcelone.
  text:
  - La Rambla suit le lit d’un ruisseau saisonnier qui coulait autrefois le long des murs médiévaux ; son nom vient de l’arabe pour lit de rivière sablonneux. Au XVIIIe siècle, les murs tombèrent et elle devint une promenade, avec des platanes et une large allée au milieu entre deux routes étroites.
  - Sur 1,2 kilomètre, elle va de la Plaça de Catalunya au port, devant des étals de fleurs, le marché de la Boqueria, le Liceu et la mosaïque de Joan Miró dans le trottoir.
placa-de-catalunya:
  blurb: La grande place où la vieille ville rejoint l’Eixample du XIXe siècle.
  text:
  - La Plaça de Catalunya fut aménagée au début du XXe siècle sur un terrain dégagé entre la vieille ville et le nouveau quadrillage de l’Eixample. Fontaines, statues et pigeons remplissent son milieu.
  - 'C’est le carrefour de la ville : la Rambla, le Passeig de Gràcia et le Portal de l’Àngel commencent tous ici, et des lignes de métro et de train se rejoignent en dessous.'
la-boqueria:
  blurb: Le marché le plus célèbre de Barcelone, sous un toit de fer juste à côté de la Rambla.
  text:
  - Il y a un marché ici depuis le Moyen Âge ; le toit de fer du Mercat de Sant Josep, comme on l’appelle officiellement, fut posé en 1914. Derrière son enseigne en vitrail, des centaines d’étals vendent fruits, jambon, poisson, fromage et sucreries.
  - De petits bars de comptoir à l’intérieur cuisinent ce que vend le marché, et à l’heure du déjeuner il n’y a presque pas un tabouret de libre.
liceu:
  blurb: L’opéra de la Rambla, ouvert en 1847 et rebâti après un incendie en 1994.
  text:
  - Le Liceu ouvrit en 1847 et devint l’un des grands opéras d’Europe, payé non par un roi mais par les citoyens de la ville eux-mêmes. Il brûla en 1861 et de nouveau en 1994.
  - Chaque fois, il fut reconstruit, et il rouvrit en 1999 avec sa salle dorée en fer à cheval comme avant.
placa-reial:
  blurb: Une place à arcades avec des palmiers et des lampadaires dessinés par un jeune Antoni Gaudí.
  text:
  - La Plaça Reial fut construite dans les années 1850 sur le site d’un couvent, une place de maisons jaunes à arcades autour d’une fontaine des Trois Grâces et d’une rangée de hauts palmiers.
  - Ses deux lampadaires à six branches furent la première commande publique d’Antoni Gaudí, en 1879, alors qu’il venait de terminer ses études.
catedral:
  name: Cathédrale
  blurb: La cathédrale gothique de Sainte-Eulalie, avec treize oies blanches dans son cloître.
  text:
  - La cathédrale de la Sainte-Croix et Sainte-Eulalie fut bâtie de la fin du XIIIe au XVe siècle ; sa façade néogothique ne suivit qu’à la fin du XIXe siècle. Sainte Eulalie, une jeune fille martyrisée à l’époque romaine, repose dans sa crypte.
  - Dans le cloître, parmi les palmiers et une fontaine, vivent treize oies blanches, une pour chaque année de sa vie.
placa-de-sant-jaume:
  blurb: La place où le gouvernement de la Catalogne et la mairie se font face, sur l’ancien forum romain.
  text:
  - La Plaça de Sant Jaume se trouve là où s’élevait le forum de la Barcino romaine. D’un côté se trouve le Palau de la Generalitat, siège du gouvernement de Catalogne depuis le XVe siècle ; de l’autre l’Ajuntament, l’hôtel de ville de Barcelone.
  - C’est la scène des fêtes de la ville, des tours humaines des castellers aux géants et coureurs de feu de la Mercè.
monument-a-colom:
  name: Monument à Colomb
  blurb: Colomb sur une colonne de 60 mètres au bas de la Rambla, le doigt tendu vers la mer.
  text:
  - Le monument fut érigé pour l’Exposition universelle de 1888, là où Colomb fit son rapport aux Rois catholiques à Barcelone après son premier voyage. Un ascenseur à l’intérieur de la colonne de fer monte à un belvédère sous ses pieds.
  - Il montre la mer, au-dessus du port, depuis le bas de la Rambla.
barri-gotic:
  name: Quartier gothique
  blurb: Le dédale de ruelles médiévales au cœur de la vieille ville, sur la Barcino romaine.
  text:
  - 'Le Barri Gòtic est la plus ancienne partie de Barcelone : ruelles étroites, petites places et palais de pierre, avec des morceaux du mur romain encore visibles entre les maisons.'
  - Une partie de son aspect « gothique » date du début du XXe siècle, quand la ville le restaura et même l’augmenta, comme le pont dentelé au-dessus du Carrer del Bisbe de 1928.
palau-de-la-musica:
  blurb: Une salle de concert du modernisme catalan, toute en mosaïque, vitrail et sculpture.
  text:
  - Lluís Domènech i Montaner construisit le Palau pour le chœur de l’Orfeó Català entre 1905 et 1908. Sa façade est couverte de mosaïque et de sculpture, et sa salle est éclairée par une grande verrière en dôme inversé.
  - C’est un site du patrimoine mondial et toujours une salle de concert en activité, à quelques coups de pédale du Portal de l’Àngel.
sagrada-familia:
  blurb: La basilique de Gaudí, en construction depuis 1882 ; elle se trouve hors de cette petite carte, dans l’Eixample.
  text:
  - Antoni Gaudí reprit l’église en 1883 et y consacra le reste de sa vie ; à sa mort en 1926, moins d’un quart était construit. Les travaux se poursuivent depuis, payés par les visiteurs.
  - Sa plus haute tour, celle de Jésus-Christ, doit atteindre 172,5 mètres. Elle se trouve dans l’Eixample, hors de la partie de Barcelone que le jeu couvre jusqu’ici.
castellers:
  name: Les castellers
  blurb: Des tours humaines de jusqu’à dix étages, bâties par des équipes debout sur les épaules les unes des autres.
  text:
  - 'Les castells sont des tours de gens : une large base de dizaines de membres de l’équipe, puis des étages de deux à cinq personnes debout sur des épaules, et au sommet un enfant qui lève la main pour couronner l’ensemble.'
  - La tradition vient de la région de Tarragone et figure sur la liste du patrimoine immatériel de l’UNESCO. À Barcelone, les équipes les construisent sur la Plaça de Sant Jaume à la Mercè, en septembre.
tapas:
  name: Les tapas
  blurb: 'De petits plats à partager au comptoir : patatas bravas, pan con tomate, croquettes et anchois.'
  text:
  - 'À Barcelone, on mange en petites portions : pa amb tomàquet, du pain frotté de tomate, d’huile et de sel ; des patatas bravas à la sauce épicée ; des croquettes ; des anchois de L’Escala.'
  - Les bars du Barri Gòtic et des alentours de la Boqueria les servent au comptoir, souvent avec un verre de vermouth avant le déjeuner.
