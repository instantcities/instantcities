# istanbul's landmarks in French (_data/landmarks/istanbul.json, by id): name (where it differs), blurb (the card), text (the story),
# history, visit (going to see it) and dates, each as in the English; what is left out stays English.
ayasofya:
  name: Sainte-Sophie
  blurb: 'La grande église de Justinien, de 537, avec sa coupole à 55 mètres de haut : église, puis mosquée, musée et de nouveau mosquée.'
  text:
  - L’empereur Justinien fit bâtir Sainte-Sophie, l’église de la Sainte Sagesse, en moins de six ans, et elle fut achevée en 537. Sa coupole, large de 31 mètres et haute de 55 mètres au-dessus du sol, semble flotter sur un anneau de quarante fenêtres. Pendant près de mille ans, ce fut la plus grande église du monde et le cœur de l’Empire byzantin.
  - Quand Mehmed II prit la ville en 1453, il en fit une mosquée, et les quatre minarets furent ajoutés autour. En 1934, la république d’Atatürk en fit un musée, et en 2020 elle redevint une mosquée. Les visiteurs peuvent encore y entrer en dehors des heures de prière, pour voir les mosaïques du Christ et des empereurs à côté des grands disques ronds portant les noms de Dieu et du Prophète.
sultanahmet-camii:
  name: Mosquée bleue
  blurb: La mosquée du sultan Ahmed Ier, avec six minarets et quelque vingt mille carreaux bleus d’İznik à l’intérieur.
  text:
  - Le sultan Ahmed Ier fit construire la mosquée de 1609 à 1616 par l’architecte Sedefkâr Mehmed Ağa, juste en face de Sainte-Sophie de l’autre côté de la place. Ses coupoles et demi-coupoles montent en cascade jusqu’à la grande coupole centrale, et six minarets se dressent autour, autant que la Grande Mosquée de La Mecque en avait alors.
  - À l’intérieur, plus de vingt mille carreaux peints à la main d’İznik, ornés de tulipes, d’œillets et de cyprès, lui donnent sa lumière bleue et son nom français. C’est toujours une mosquée en activité, fermée aux visiteurs aux heures de prière, et l’Hippodrome longe son côté ouest.
hipodrom:
  name: Hippodrome
  blurb: La longue place où Byzance organisait ses courses de chars, avec un obélisque égyptien et une colonne de bronze aux serpents toujours debout.
  text:
  - L’Hippodrome de Constantinople pouvait contenir jusqu’à cent mille personnes pour ses courses de chars, et ses équipes, les Bleus et les Verts, étaient aussi des partis politiques. En 532, leurs émeutes, la révolte Nika, brûlèrent la moitié de la ville, et Sainte-Sophie fut reconstruite après elle.
  - 'Aujourd’hui, la longue place dégagée suit le tracé de l’ancienne piste. Trois monuments se dressent au milieu : l’obélisque du pharaon Thoutmosis III, apporté d’Égypte par Théodose en 390 ; la colonne aux Serpents, coulée après la victoire des Grecs sur les Perses à Platées en 479 av. J.-C. ; et l’Obélisque maçonné en pierre brute. Les Turcs l’appellent At Meydanı, la place du cheval.'
yerebatan:
  name: Citerne Basilique
  blurb: Le réservoir souterrain de Justinien, une forêt de 336 colonnes plantées dans l’eau.
  text:
  - Sous les rues près de Sainte-Sophie se trouve la plus grande des anciennes citernes de la ville, construite sous Justinien au VIe siècle pour garder l’eau du palais. 336 colonnes de marbre, hautes de 9 mètres chacune, portent ses voûtes de brique, et beaucoup d’entre elles furent prises à des bâtiments plus anciens.
  - Les Turcs l’appellent Yerebatan, le palais englouti. Les visiteurs marchent sur des passerelles surélevées au-dessus de l’eau entre les colonnes éclairées, jusqu’aux deux têtes de Méduse, l’une couchée et l’autre à l’envers, qui servent de bases à deux d’entre elles.
topkapi:
  name: Palais de Topkapı
  blurb: Le palais des sultans ottomans pendant près de quatre cents ans, à la pointe de la péninsule au-dessus du Bosphore.
  text:
  - 'Mehmed II commença le palais peu après avoir pris Constantinople en 1453, à la pointe où la Corne d’Or rencontre le Bosphore. Ce n’est pas un seul bâtiment mais une suite de cours l’une derrière l’autre, chacune plus privée que la précédente : la Porte impériale près de Sainte-Sophie, la porte de la Salutation avec ses deux tours, la salle du conseil, le trésor et le harem, où le sultan vivait avec sa famille.'
  - Les sultans y vécurent jusqu’aux années 1850, quand ils s’installèrent au palais de Dolmabahçe sur le Bosphore. Depuis 1924, c’est un musée, avec le poignard de Topkapı, le diamant du Cuillérier et les reliques du Prophète. Le parc de Gülhane, autrefois son jardin extérieur, descend la pente en dessous.
kapalicarsi:
  name: Grand Bazar
  blurb: L’un des plus anciens et des plus grands marchés couverts du monde, une soixantaine de rues et quatre mille boutiques sous un même toit.
  text:
  - Le Grand Bazar s’est développé autour de deux halles à coupole que Mehmed II fit construire dans les années 1450 et 1460 pour le commerce des étoffes et des joyaux. Au fil des siècles, les rues entre elles furent couvertes, jusqu’à devenir une ville en soi, avec mosquées, fontaines, cafés et ses propres portes.
  - Aujourd’hui, quelque quatre mille boutiques vendent or, tapis, lampes, cuir et cuivre le long d’une soixantaine de rues couvertes. Ses portes ferment le soir et le dimanche. La mosquée Nuruosmaniye se dresse à sa porte orientale, et la Divan Yolu passe devant au sud.
misir-carsisi:
  name: Bazar aux épices
  blurb: Le marché couvert en forme de L près de la Mosquée neuve, plein d’épices, de fruits secs, de thé et de loukoums.
  text:
  - Le Bazar aux épices fut construit dans les années 1660 dans le cadre de la Mosquée neuve, et ses loyers payaient l’entretien de la mosquée. Son nom turc, le Bazar égyptien, vient des navires du Caire dont les épices étaient vendues ici.
  - Sous ses longues voûtes, les étals sont chargés de piment rouge, de sumac, de safran, d’abricots secs, de figues, de noix, de thés et de lokum, le loukoum. Les rues autour, jusqu’à la Corne d’Or, sont le quartier de marché le plus animé de la vieille ville.
yeni-cami:
  name: Mosquée neuve
  blurb: La grande mosquée au bord de l’eau à Eminönü, commencée en 1597 et achevée 68 ans plus tard.
  text:
  - La sultane mère Safiye, mère de Mehmed III, fit commencer la mosquée en 1597 au bord de la Corne d’Or. Les travaux s’arrêtèrent quand elle perdit son pouvoir, et c’est une autre mère de sultan, Turhan Hatice, qui la fit achever en 1665. C’est pourquoi une mosquée de plus de trois cents ans s’appelle toujours neuve.
  - Ses coupoles et ses deux minarets s’élèvent au-dessus des quais de ferries d’Eminönü, et les pigeons sur ses marches et les étals dans sa cour en font l’un des coins les plus animés de la ville.
galata-koprusu:
  name: Pont de Galata
  blurb: Le pont sur la Corne d’Or d’Eminönü à Karaköy, bordé de pêcheurs en haut et de restaurants de poisson en bas.
  text:
  - Un pont traverse la Corne d’Or ici depuis 1845, reliant la vieille ville à Galata et à Karaköy de l’autre côté. Le pont flottant de 1912 brûla en 1992, et le pont d’aujourd’hui, avec ses tramways au milieu, ouvrit en 1994.
  - Toute la journée, des pêcheurs à la ligne se tiennent le long de ses garde-corps, leurs cannes au-dessus de l’eau, et sur le niveau inférieur, sous la route, des restaurants servent du poisson à des gens qui regardent l’eau. De l’autre côté de l’eau, la tour de Galata se dresse au-dessus des toits.
sirkeci:
  name: La gare de Sirkeci
  blurb: Le terminus de l’Orient-Express venant de Paris, une gare de 1890 au bord de la mer.
  text:
  - L’architecte allemand August Jasmund construisit la gare de Sirkeci en 1890, dans un mélange de styles européen et ottoman, pour les trains venant d’Europe. C’était le dernier arrêt de l’Orient-Express venant de Paris, et le restaurant Orient Express à l’intérieur s’en souvient encore.
  - Aujourd’hui, la ligne Marmaray passe sous le Bosphore vers l’Asie depuis une station profonde en dessous, le tramway T1 sonne devant la façade, et les anciennes salles accueillent des expositions et, certains soirs, la cérémonie des derviches tourneurs.
cemberlitas:
  name: La colonne de Constantin
  blurb: La colonne que Constantin le Grand dressa en 330 pour la fondation de sa nouvelle capitale, tenue par des cerclages de fer.
  text:
  - Quand Constantin le Grand fit de Byzance sa capitale en 330, il dressa cette colonne de porphyre rouge d’Égypte au milieu de son nouveau forum, avec une statue de lui-même au sommet. La statue tomba lors d’une tempête en 1106, et incendies et tremblements de terre fissurèrent la pierre.
  - Les cerclages de fer qui tiennent les tambours ensemble lui donnent son nom turc, Çemberlitaş, la pierre cerclée. Elle se dresse sur la Divan Yolu, l’ancienne rue principale de la ville, où le tramway s’arrête devant elle en route vers le Grand Bazar.
simit:
  name: Le simit
  blurb: L’anneau de pain au sésame vendu dans des chariots rouges à chaque coin de rue, mangé au petit-déjeuner avec un verre de thé.
  text:
  - Un simit est un anneau de pain trempé dans du moût de raisin et couvert de graines de sésame, puis cuit croustillant dehors et moelleux dedans. Les vendeurs les portent sur des plateaux sur la tête ou les vendent dans des chariots vitrés rouges aux coins de rue et sur les quais de ferries, pour quelques livres chacun.
  - Les gens d’Istanbul le mangent au petit-déjeuner ou en chemin, avec un verre de thé noir, du fromage blanc ou rien du tout, et sur les ferries ils jettent les derniers morceaux aux mouettes qui suivent le bateau.
vapur:
  name: Les ferries
  blurb: Les ferries blancs qui font traverser le Bosphore à Istanbul entre l’Europe et l’Asie, depuis les quais d’Eminönü.
  text:
  - Pour une ville sur deux continents, le ferry est le moyen d’aller travailler. Des ferries à vapeur traversent le Bosphore depuis les années 1850, et aujourd’hui les bateaux blancs de Şehir Hatları, les lignes de la ville, partent d’Eminönü, de Karaköy et de Beşiktaş sur la rive européenne vers Kadıköy et Üsküdar sur la rive asiatique, en une vingtaine de minutes.
  - À bord, un serveur fait le tour avec des verres de thé sur un plateau, et les gens se tiennent à la rambarde pour regarder les mosquées sur les collines et les palais le long de l’eau. Des trajets plus longs remontent le Bosphore jusqu’à la mer Noire, et vont aux îles des Princes.
