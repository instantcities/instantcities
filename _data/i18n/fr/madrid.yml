title: 'Instant Madrid : visite virtuelle en 3D et jeu gratuits de Madrid'
description: 'Faites gratuitement la visite virtuelle en 3D du centre historique de Madrid dans votre navigateur, puis parcourez-le vous-même à vélo, à pied ou au galop : explorez ou faites la course, seul ou à deux sur un même clavier.'
tagline: Explorez ou faites la course à vélo, à pied ou à cheval dans le vieux Madrid !
lead: Parcourez le vieux Madrid en 3D, par la Puerta del Sol, la Plaza Mayor, le Palais royal et la Plaza de Oriente, avec chaque bâtiment d’OpenStreetMap.
features:
- title: Le vrai Madrid
  text: 'Promenez-vous parmi quelque 3 800 bâtiments reconstruits en 3D à partir d’OpenStreetMap : un premier morceau du centre historique, et le reste de la ville suivra.'
- title: Le Madrid des Habsbourg
  text: Partez de la Puerta del Sol, suivez la Calle Mayor devant la Plaza Mayor jusqu’au Palais royal et à l’Almudena, et traversez la Plaza de Oriente jusqu’au Teatro Real.
- title: 'Une course : Sol et Oriente'
  text: Foncez de la Puerta del Sol par la Calle Mayor jusqu’au Palais royal, à travers la Plaza de Oriente, devant Santo Domingo jusqu’à Callao, et retour par la Calle del Carmen.
intro: Madrid est la capitale de l’Espagne et sa plus grande ville, haut sur le plateau au centre du pays. Philippe II en a fait le siège de sa cour en 1561, et les rois suivants lui ont laissé un palais royal, la Plaza Mayor à arcades et le Prado, l’un des grands musées d’art du monde. Aujourd’hui, Madrid est aussi connue pour ses nuits tardives, ses bars à tapas et son football.
famous:
- Le Prado, le Reina Sofía avec le Guernica de Picasso, et le musée Thyssen
- Le Palais royal, la Plaza Mayor et la Puerta del Sol
- Le Real Madrid et l’Atlético de Madrid
- Les dîners tardifs, les tapas, les churros au chocolat et le marché aux puces du Rastro le dimanche
credits: Données cartographiques © les contributeurs d’OpenStreetMap (ODbL).
