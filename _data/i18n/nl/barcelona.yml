title: 'Instant Barcelona: gratis virtuele 3D-rondleiding en game van Barcelona'
description: 'Maak gratis een virtuele 3D-rondleiding door het centrum van Barcelona in je browser, en fiets, wandel of galoppeer er daarna zelf door: verken of race, alleen of met twee op één toetsenbord.'
tagline: Verken of race met de fiets, te voet of te paard over de Rambla!
lead: Rijd door de oude stad van Barcelona in 3D, over de Rambla, door de Gotische Wijk, langs de kathedraal en de Plaça de Sant Jaume, met elk gebouw uit OpenStreetMap.
features:
- title: Het echte Barcelona
  text: 'Dwaal tussen zo’n 4.300 gebouwen, in 3D nagebouwd uit OpenStreetMap: een eerste stuk van het centrum, de rest van de stad volgt nog.'
- title: De oude stad
  text: Rijd de Rambla af van de Plaça de Catalunya naar het Columbusmonument, langs La Boqueria en de Plaça Reial, en verdwaal in de Gotische Wijk rond de kathedraal.
- title: 'Een race: Rambla en Gotische Wijk'
  text: Race van de Plaça de Catalunya de Rambla af naar het Columbusmonument, door de Gotische Wijk langs de Plaça de Sant Jaume en de kathedraal, en terug via de Portal de l’Àngel.
intro: Barcelona is de hoofdstad van Catalonië en de tweede stad van Spanje, een haven aan de Middellandse Zee tussen de bergen en de zee. De middeleeuwse Gotische Wijk, de gebouwen van Antoni Gaudí en de andere modernistische architecten en La Rambla die naar de haven loopt, maakten er een van de meest bezochte steden van Europa van.
famous:
- Gaudí’s Sagrada Família, Park Güell, Casa Batlló en La Pedrera
- La Rambla, de markt van La Boqueria en de straatjes van de Gotische Wijk
- FC Barcelona en de Olympische Spelen van 1992
- Tapas, pa amb tomàquet en de menselijke torens van de castellers
credits: Kaartgegevens © OpenStreetMap-bijdragers (ODbL).
