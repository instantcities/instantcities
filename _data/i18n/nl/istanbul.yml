title: 'Instant Istanbul: gratis virtuele 3D-rondleiding en game van Istanbul'
description: 'Maak gratis een virtuele 3D-rondleiding door het oude schiereiland van Istanbul in je browser, en fiets, wandel of galoppeer er daarna zelf door: verken of race, alleen of met twee op één toetsenbord.'
tagline: Verken of race met de fiets, te voet of te paard tussen de moskeeën en bazaars van Istanbul!
lead: Rijd door het oude schiereiland van Istanbul in 3D, tussen de Gouden Hoorn en de Zee van Marmara, langs de Hagia Sophia, de Blauwe Moskee, de Grote Bazaar en de kades van Eminönü, met elk gebouw uit OpenStreetMap.
features:
- title: Het echte Istanbul
  text: Dwaal tussen zo’n 4.100 gebouwen, in 3D nagebouwd uit OpenStreetMap op het oude schiereiland, van Sultanahmet tot aan de Gouden Hoorn, met de zee rond de punt. De rest van de stad volgt nog.
- title: Koepels, bazaars en de Gouden Hoorn
  text: Bezoek de Hagia Sophia, de Blauwe Moskee en de Hippodroom, zoek de Basilicacisterne en de poort van het Topkapıpaleis, slenter door de Grote Bazaar en rijd langs het station Sirkeci naar de Nieuwe Moskee en de Kruidenbazaar in Eminönü.
- title: 'Een race: Sultanahmet'
  text: Race van de Hagia Sophia over de Divan Yolu naar de Zuil van Constantijn en de Grote Bazaar, de Ankara Caddesi af naar Sirkeci, en terug langs het Gülhanepark en de poort van het Topkapıpaleis.
intro: 'Istanbul ligt op beide oevers van de Bosporus, de zeestraat tussen de Zwarte Zee en de Zee van Marmara, half in Europa en half in Azië. Zestien eeuwen lang was het een hoofdstad: van de Romeinse en Byzantijnse keizers als Constantinopel, en daarna van de Ottomaanse sultans. Op het oude schiereiland, tussen de Gouden Hoorn en de zee, staan de Hagia Sophia, de Blauwe Moskee, het Topkapıpaleis en de Grote Bazaar. Vandaag is het de grootste stad van Turkije, met meer dan vijftien miljoen inwoners.'
famous:
- De Hagia Sophia, negenhonderd jaar een kerk en daarna een moskee
- De Blauwe Moskee en de skyline van koepels en minaretten
- Het Topkapıpaleis, het huis van de Ottomaanse sultans
- De Grote Bazaar en de Kruidenbazaar
- De veerboten over de Bosporus, tussen Europa en Azië
- Simit, Turkse thee en Turks fruit
