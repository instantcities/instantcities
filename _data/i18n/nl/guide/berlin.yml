places:
  platz-der-republik:
    blurb: Het grote grasveld voor de Rijksdag, de zetel van de Bondsdag, onder Norman Fosters glazen koepel.
  pariser-platz:
    blurb: Het plein binnen de Brandenburger Tor, met de Franse en Amerikaanse ambassades en het Hotel Adlon. Het dankt zijn naam aan de inname van Parijs door de geallieerden in 1814.
  ebertstrasse:
    blurb: De straat langs de rand van de Tiergarten van de Rijksdag langs de Brandenburger Tor naar de Potsdamer Platz. De Muur liep erlangs, en het Holocaustmonument ligt ernaast.
  unter-den-linden:
    blurb: De boulevard van de Brandenburger Tor naar het Museumeiland, waar de Grote Keurvorst in 1647 lindebomen liet planten, omzoomd met de Staatsopera, de Humboldt-universiteit en het oude Zeughaus.
  friedrichstrasse:
    blurb: De lange winkelstraat van de barokke Friedrichstadt, die Unter den Linden kruist. Verder naar het zuiden liep ze bij Checkpoint Charlie door de Muur.
  wilhelmstrasse:
    blurb: Een eeuw lang de straat van de Pruisische en Duitse regering, waar Bismarck en later Hitler hun kanselarij hadden. Nu staat er de Britse ambassade.
  gendarmenmarkt:
    blurb: Vaak het mooiste plein van Berlijn genoemd, met het Konzerthaus tussen de tweelingkerken, de Franse en de Duitse. Het dankt zijn naam aan een cavalerieregiment, de Gens d’armes, dat hier zijn stallen had.
  bebelplatz:
    blurb: Frederik de Grotes plein tussen de Staatsopera, de Sint-Hedwigskathedraal en de oude koninklijke bibliotheek. Een glasplaat in de bestrating kijkt neer op lege boekenplanken, ter herinnering aan de nazi-boekverbranding van 1933.
  lustgarten:
    blurb: Het gazon tussen het Altes Museum, de dom en het paleis, ooit de lusthof van de keurvorsten.
  museumsinsel:
    name: Museumeiland
    blurb: Het noordelijke eind van het eiland in de Spree, waar Pruisen tussen 1830 en 1930 vijf musea bouwde, van het Altes Museum tot het Pergamon.
  schlossplatz:
    blurb: Het plein voor het paleis van de Hohenzollerns, dat de Oost-Duitse regering in 1950 opblies. Duitsland herbouwde de gevels voor het Humboldt Forum, geopend in 2021.
  spree:
    name: De Spree
    blurb: Berlijns rivier, die zich splitst rond het eiland met het Museumeiland en het oude Cölln. Rondvaartboten varen erlangs, langs de dom en de Rijksdag.
  nikolaiviertel:
    blurb: De wijk rond de Nikolaikirche, de oudste kerk van Berlijn, waar de stad begon. Oost-Duitsland herbouwde haar voor het 750-jarig bestaan van de stad in 1987, deels met kopieën van verloren huizen.
  karl-liebknecht-strasse:
    blurb: De brede Oost-Duitse laan van de dom naar de Alexanderplatz, langs de middeleeuwse Marienkirche en de televisietoren.
  alexanderplatz:
    blurb: Het grote plein van Oost-Berlijn, genoemd naar het bezoek van tsaar Alexander I in 1805, met de Wereldtijdklok en de televisietoren ernaast.
