places:
  dam:
    name: De Dam
    blurb: Het plein op de plek van de eerste dam in de Amstel, met het Koninklijk Paleis, de Nieuwe Kerk en het witte Nationaal Monument voor de oorlogsslachtoffers.
  damrak:
    blurb: De drukke straat van Centraal Station naar de Dam, op de oude loop van de Amstel, met Berlages voormalige beurs aan de ene kant en een rij scheve huizen aan het water aan de andere.
  rokin:
    blurb: De brede straat ten zuiden van de Dam, waar de Amstel stroomde tot ze werd gedempt, deels in de jaren dertig; het laatste stuk water herbergt nog een paar boten.
  kalverstraat:
    blurb: De drukste winkelstraat van Amsterdam, een smal voetgangersstraatje van de Dam naar de Munt, genoemd naar de kalvermarkt die hier in de middeleeuwen werd gehouden.
  spui:
    blurb: Een plein met boekwinkels en cafés, met op vrijdag een boekenmarkt en de verborgen poort naar het Begijnhof.
  muntplein:
    blurb: Het plein rond de Munttoren, een toren van de middeleeuwse stadsmuur waar de stad in 1672 en 1673 munten sloeg.
  singel:
    blurb: De binnenste gracht van de gordel, tot de 16e eeuw de stadsgracht, met aan haar zuidkant de drijvende bloemenmarkt.
  herengracht:
    blurb: De eerste van de drie hoofdgrachten, genoemd naar de heren die de stad bestuurden, met de statigste huizen aan haar Gouden Bocht.
  keizersgracht:
    blurb: De breedste van de grachten, genoemd naar keizer Maximiliaan I van het Heilige Roomse Rijk.
  prinsengracht:
    blurb: De buitenste van de drie grachten, omzoomd met woonboten, waar Anne Frank zich op nummer 263 verborg.
  westermarkt:
    blurb: Het plein onder de Westerkerk, de hoogste kerktoren van de stad, met aan het water het Homomonument.
  oudezijds-voorburgwal:
    blurb: Een van de oudste grachten, langs de Oude Kerk dwars door het hart van de Wallen.
  nieuwmarkt:
    blurb: Een levendig plein rond de Waag, een 15e-eeuwse stadspoort die later waaggebouw werd, aan de rand van Chinatown.
  amstel:
    name: De Amstel
    blurb: De rivier die Amsterdam haar naam gaf, die van het zuiden binnenstroomt langs de Stopera en de Magere Brug.
