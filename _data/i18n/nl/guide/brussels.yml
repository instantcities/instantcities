places:
  grand-place:
    name: Grote Markt
    blurb: Het marktplein van Brussel, omsloten door het gotische Stadhuis, het Broodhuis en de vergulde huizen van de gilden.
  galeries-saint-hubert:
    blurb: Een winkelgalerij met glazen dak uit 1847, een van de eerste van Europa, met cafés, chocoladewinkels en een theater.
  rue-des-bouchers:
    blurb: De Beenhouwersstraat, nu een steegje met restaurants met tafels buiten, dat de Galerijen kruist.
  place-de-la-bourse:
    blurb: Het plein voor de Beurs, de voormalige beurs uit 1873, nu een museum van het Belgische bier.
  boulevard-anspach:
    blurb: De laan die in de jaren 1870 over de overwelfde Zenne werd gelegd, sinds 2015 een voetgangerszone.
  rue-de-l-etuve:
    blurb: De straat van de Grote Markt naar de hoek waar het Manneken Pis op zijn fontein staat.
  place-saint-gery:
    blurb: Het plein op het oude eiland in de Zenne waar Brussel begon, rond een ijzeren markthal uit 1881, nu omringd door bars.
  place-sainte-catherine:
    blurb: Een plein op de gedempte dokken van de oude haven, bekend om zijn visrestaurants.
  place-de-la-monnaie:
    blurb: Het plein van de Munt, het operahuis waar de Belgische Revolutie in 1830 begon.
  rue-neuve:
    blurb: De drukste winkelstraat van de stad, afgesloten voor auto’s, die vanaf het Muntplein naar het noorden loopt.
  place-sainte-gudule:
    blurb: Het plein onder de gotische Sint-Michiels- en Sint-Goedelekathedraal, waar de koninklijke huwelijken en begrafenissen van België plaatsvinden.
  mont-des-arts:
    blurb: Een terrassentuin naast de Koninklijke Bibliotheek, aangelegd voor de Wereldtentoonstelling van 1958, met uitzicht over de benedenstad.
  place-royale:
    blurb: Het 18e-eeuwse plein op de Coudenberg, op de plek van het oude paleis, met de Sint-Jacob-op-Coudenbergkerk en een standbeeld van Godfried van Bouillon.
  grand-sablon:
    name: Grote Zavel
    blurb: Een hellend plein met antiquairs en chocolatiers onder de gotische kerk Onze-Lieve-Vrouw ter Zavel, met in het weekend een antiekmarkt.
