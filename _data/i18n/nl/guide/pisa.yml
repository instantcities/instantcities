overview:
- De oude stad van Pisa ligt aan beide oevers van de Arno, die er een brede bocht door het midden maakt. Ten noorden van de rivier strekt de middeleeuwse stad zich uit van de Lungarni tot aan de muren, met de Borgo Stretto en zijn arcades, de marktpleinen en de Piazza dei Cavalieri. In de noordwesthoek, tegen de muren, staan de Duomo, het Baptisterium, de klokkentoren en het Camposanto op hun grasveld. Ten zuiden van de rivier, in de oude wijk Kinzica, loopt de Corso Italia van de Logge di Banchi naar het station.
- 'Instant Pisa brengt je door het hart ervan: van de Scheve Toren door de Via Santa Maria, de straat van de universiteit, naar de rivier, langs de Lungarni aan beide oevers, over de Ponte di Mezzo en de Ponte Solferino, langs Santa Maria della Spina en zuidwaarts over de Corso Italia naar het station. Het spel tekent de toren naar de omtrek en hoogte van OpenStreetMap, dus in het spel staat hij rechtop.'
setting:
- Pisa ligt in de vlakke vlakte van de benedenloop van de Arno, ongeveer 10 kilometer van de Tyrreense Zee, tussen Florence, 80 kilometer stroomopwaarts, en de haven van Livorno in het zuiden. In de Romeinse tijd en de middeleeuwen lag de zee veel dichterbij en had de stad haar haven aan de kust. De rivier heeft sindsdien zoveel slib aangevoerd dat de kust nu ver naar het westen ligt, voorbij de dennenbossen van San Rossore.
- 'De grond onder de stad is zachte klei en zand, waardoor niet alleen de klokkentoren scheef staat: het Baptisterium en veel andere torens en kerken hellen ook. Het klimaat is mediterraan, met hete zomers en milde, regenachtige winters, en de Apuaanse Alpen en de Monti Pisani beschermen de vlakte tegen het noorden.'
today:
- 'Pisa is in de eerste plaats een universiteitsstad: met de Universiteit, de Scuola Normale en de school Sant’Anna telt het zo’n 50.000 studenten in een stad van minder dan 90.000 inwoners. Miljoenen bezoekers komen voor de Piazza dei Miracoli, velen voor een dag, per trein uit Florence of via de luchthaven Galileo Galilei, de drukste van Toscane, net ten zuiden van het centrum.'
- 'De Pisanen vieren hun feesten in juni, de Giugno Pisano: de Luminara op de avond van 16 juni, als duizenden kaarsen de Lungarni verlichten, de bootrace van San Ranieri op de 17e, en het Gioco del Ponte op de laatste zaterdag van de maand, als het noorden en het zuiden van de stad om de Ponte di Mezzo vechten.'
history:
- title: Een zeerepubliek
  text:
  - Pisa was een Etruskische en daarna een Romeinse stad, met haar haven aan wat toen de kust was. In de 11e eeuw groeide het uit tot een van de vier grote zeerepublieken van Italië, samen met Genua, Venetië en Amalfi. De vloot streed tegen de Saracenen, plunderde Palermo in 1063, voer mee met de kruistochten en won handelsposten overal in de Middellandse Zee, van Sardinië en Corsica tot de Levant.
  - 'Met de buit begon de stad in 1064 aan haar kathedraal, daarna aan het Baptisterium en de klokkentoren, en later het Camposanto. Pisaanse kooplieden brachten ook nieuwe kennis mee naar huis: Leonardo Fibonacci, de zoon van een Pisaanse ambtenaar in Noord-Afrika, introduceerde de Indisch-Arabische cijfers in Europa in zijn Liber Abaci van 1202.'
- title: Nederlaag, en Florence
  text:
  - In 1284 vernietigde Genua de Pisaanse vloot in de slag bij Meloria, en Pisa herwon nooit meer zijn macht op zee. Graaf Ugolino della Gherardesca, na de nederlaag van verraad beschuldigd, werd in een toren aan de Piazza dei Cavalieri uitgehongerd, zoals Dante vertelt in de Inferno. De haven slibde dicht, en in 1406 nam Florence de stad in na een lang beleg.
  - 'Pisa kwam in 1494 in opstand tegen Florence en hield het vijftien jaar vol voor het in 1509 opnieuw viel. Onder de Medici werd het een stad van geleerdheid: Cosimo I stichtte de universiteit opnieuw, richtte de Ridders van Sint-Stefanus op aan de Piazza dei Cavalieri en liet de botanische tuin aanleggen. Galileo Galilei werd in 1564 in Pisa geboren, studeerde aan de universiteit en gaf er wiskunde.'
- title: Oorlog en de toren
  text:
  - 'Pisa werd in 1860 deel van het nieuwe Koninkrijk Italië. In de Tweede Wereldoorlog troffen geallieerde bommen de stad in 1943, en in de zomer van 1944 liep het front wekenlang langs de Arno: de terugtrekkende Duitsers bliezen de bruggen op, en een granaat stak het dak van het Camposanto in brand.'
  - Na de oorlog herbouwde de stad haar bruggen en haar Lungarni. In 1990 stond de klokkentoren zo scheef dat hij voor bezoekers werd gesloten, en ingenieurs haalden elf jaar lang grond onder de hoge kant weg tot hij weer veilig stond; in 2001 ging hij weer open.
