facts:
- Frankrijk
- Île-de-France
- Ongeveer 2,1 miljoen inwoners (stad), meer dan 12 miljoen (stedelijk gebied)
- Als de Romeinse stad Lutetia, in de 1e eeuw v.Chr.
- De Seine
- Frans
- De Lichtstad (la Ville Lumière)
- De oevers van de Seine, sinds 1991
overview:
- 'Parijs ligt aan de Seine in het noorden van Frankrijk, in een breed, laag bekken dat de Fransen het Bassin parisien noemen. Binnen de ringweg, de Boulevard Périphérique, is de stad klein, ongeveer 105 vierkante kilometer, en dicht bebouwd: bijna elke straat wordt omzoomd door appartementsgebouwen van zes of zeven verdiepingen, met winkels en cafés op de begane grond.'
- Instant Paris brengt je door het oudste deel van de stad. Het Île de la Cité, het eiland waar Parijs begon, draagt Notre-Dame aan de oostkant, de Sainte-Chapelle en het Palais de Justice in het midden en de Pont Neuf aan de westpunt. Op de rechteroever loopt de Rue de Rivoli langs het Louvre en het Hôtel de Ville, en het Centre Pompidou verrijst een paar straten verder naar het noorden; op de linkeroever beginnen de steegjes van het Quartier Latin achter de Place Saint-Michel.
setting:
- Parijs is de hoofdstad van de regio Île-de-France, waar bijna een vijfde van de Fransen woont. De Seine komt uit het zuidoosten, splitst zich in het centrum rond twee eilanden, het Île de la Cité en het Île Saint-Louis, en verlaat de stad naar het zuidwesten op weg naar het Kanaal bij Le Havre. Parijzenaars spreken van de rechteroever ten noorden van de rivier en de linkeroever ten zuiden ervan.
- De stad is verdeeld in twintig districten, de arrondissementen, genummerd in een spiraal die bij het Louvre begint en met de wijzers van de klok mee naar buiten draait. Montmartre in het noorden is de hoogste heuvel. Parijs heeft een zacht zeeklimaat, met koele winters, warme zomers en regen verspreid over het hele jaar.
today:
- 'Parijs is de zetel van de Franse president, de regering en het parlement, en van internationale organen zoals UNESCO en de OESO. De regio brengt bijna een derde van de Franse welvaart voort, van de bankwereld in de torens van La Défense, net buiten de stad, tot mode, luxegoederen en toerisme. Het is een van de meest bezochte steden ter wereld, en toch blijft het centrum bewoond: Parijzenaars doen boodschappen op de straatmarkten, staan in de rij bij de bakker en vullen in elk seizoen de caféterrassen.'
- 'De stad maakt steeds meer ruimte voor voetgangers en fietsers: de wegen langs de rivier door het centrum zijn afgesloten voor auto’s, en de Rue de Rivoli is vooral van de fietsers. Sinds de zomer van 2025 kunnen Parijzenaars op een paar plaatsen weer in de Seine zwemmen. Paris Saint-Germain, de voetbalclub van de stad, speelt in het Parc des Princes.'
history:
- title: Lutetia en de eerste koningen
  text:
  - Een Keltische stam, de Parisii, woonde op de eilanden en oevers van de Seine toen de legioenen van Julius Caesar de streek in 52 v.Chr. veroverden. De Romeinen bouwden de stad Lutetia op de linkeroever, met een forum, baden en een arena die nog steeds bestaat, de Arènes de Lutèce. In de 4e eeuw had de stad de naam van haar stam aangenomen, Parijs, en rond 508 maakte Clovis, koning van de Franken, haar tot zijn hoofdstad.
  - In 987 werd Hugo Capet koning, en zijn nakomelingen maakten Parijs voorgoed de hoofdstad van Frankrijk. Filips II August liet de stad rond 1200 ommuren en bouwde een vesting op de rechteroever, het eerste Louvre. Bisschop Maurice de Sully begon in 1163 aan Notre-Dame, en Lodewijk IX liet de Sainte-Chapelle bouwen om de Doornenkroon te bewaren. Op de linkeroever vormden leraren en studenten een van de eerste universiteiten van Europa.
- title: Koningen en revoluties
  text:
  - Hendrik IV voltooide in 1607 de Pont Neuf, de eerste brug van Parijs zonder huizen erop, en legde erachter de Place Dauphine aan. Lodewijk XIV breidde het Louvre uit maar verhuisde zijn hof in 1682 naar Versailles, en de koningen woonden de eerstvolgende honderd jaar buiten Parijs.
  - Op 14 juli 1789 bestormde een menigte de Bastille, een koninklijke gevangenis, en begon de Franse Revolutie. De revolutionairen lieten Lodewijk XVI in 1793 executeren op wat nu de Place de la Concorde is. Napoleon kroonde zichzelf in 1804 tot keizer in Notre-Dame en begon aan de arcades van de Rue de Rivoli. In de decennia daarna kwamen de Parijzenaars in 1830 en 1848 opnieuw in opstand tegen hun heersers.
- title: De moderne hoofdstad
  text:
  - Vanaf 1853 braken Napoleon III en zijn prefect, baron Haussmann, een groot deel van de overvolle middeleeuwse stad af. Hun arbeiders legden lange, rechte boulevards aan, zoals de Boulevard de Sébastopol, bouwden riolen, parken en stations en omzoomden de nieuwe straten met de stenen gebouwen die Parijs nog steeds zijn aanzien geven. Op het Île de la Cité ruimden ze de meeste oude huizen rond Notre-Dame op. Tijdens de Commune van Parijs in 1871 verwoestten branden het Hôtel de Ville en het Tuilerieënpaleis.
  - Gustave Eiffel bouwde zijn toren voor de Wereldtentoonstelling van 1889, en in 1900 ging de eerste metrolijn open. Duitse troepen bezetten Parijs van 1940 tot de bevrijding in augustus 1944. In 2019 verwoestte een brand het dak en de spits van Notre-Dame; ambachtslieden bouwden ze weer op, en de kathedraal ging in december 2024 weer open, het jaar waarin Parijs voor de derde keer de Olympische Spelen organiseerde.
