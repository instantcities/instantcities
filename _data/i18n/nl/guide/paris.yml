places:
  seine:
    name: De Seine
    blurb: De rivier van Parijs, tussen stenen kades waar de boekverkopers, de bouquinistes, hun groene kisten hebben. De oevers door het centrum zijn werelderfgoed.
  ile-de-la-cite:
    blurb: Het eiland in de Seine waar Parijs begon, met Notre-Dame, de Sainte-Chapelle en het gerechtsgebouw.
  pont-neuf:
    blurb: Ondanks de naam is de ‘nieuwe brug’ de oudste brug van Parijs, voltooid in 1607 over de westpunt van het eiland.
  place-dauphine:
    blurb: Een rustige driehoek van huizen en kastanjebomen achter de Pont Neuf, aangelegd door Hendrik IV in 1607.
  parvis-notre-dame:
    blurb: Het open plein voor de kathedraal, waar een bronzen ster in de bestrating het punt markeert van waaruit Franse wegen hun afstand tot Parijs meten.
  boulevard-du-palais:
    blurb: De straat over het eiland langs het Palais de Justice, op wiens binnenplaats de Sainte-Chapelle verscholen ligt.
  place-du-chatelet:
    blurb: Een plein aan het eind van de Pont au Change, met een fontein en twee theaters tegenover elkaar, en de gotische Tour Saint-Jacques een paar stappen verderop.
  place-de-l-hotel-de-ville:
    blurb: Het plein voor het stadhuis, tot 1803 de Place de Grève genoemd en eeuwenlang de executieplaats van de stad.
  rue-de-rivoli:
    blurb: De lange, rechte straat van de rechteroever, begonnen onder Napoleon, met arcades langs het Louvre en de Tuilerieëntuin.
  pont-des-arts:
    blurb: De metalen voetgangersbrug van het Louvre naar het Institut de France, met uitzicht langs de rivier tot de punt van het eiland.
  boulevard-de-sebastopol:
    blurb: Een van Haussmanns eerste boulevards, in de jaren 1850 kaarsrecht naar het noorden aangelegd vanaf het Châtelet.
  place-georges-pompidou:
    blurb: Het hellende plein voor het Centre Pompidou, met zijn buizen en roltrappen aan de buitenkant.
  place-saint-michel:
    blurb: Het plein aan de voet van de Boulevard Saint-Michel, met een fontein van de aartsengel die de duivel bevecht, waar het Quartier Latin begint.
  rue-de-la-huchette:
    blurb: Een smal middeleeuws steegje in het Quartier Latin, vol Griekse restaurants, met een klein theater dat sinds 1957 Ionesco’s De kale zangeres speelt.
