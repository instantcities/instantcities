places:
  placa-de-catalunya:
    blurb: Het grote plein tussen de oude stad en de Eixample, waar La Rambla, het Passeig de Gràcia en de metrolijnen samenkomen.
  la-rambla:
    blurb: De met bomen omzoomde wandelstraat van de Plaça de Catalunya naar de haven, langs de bedding van een beek die ooit buiten de middeleeuwse muren liep.
  portal-de-l-angel:
    blurb: De drukke voetgangersstraat met winkels van de Plaça de Catalunya naar de kathedraal, genoemd naar een poort in de middeleeuwse muren.
  avinguda-de-la-catedral:
    blurb: De brede open ruimte voor de kathedraal, waar in het weekend de sardana wordt gedanst, de Catalaanse rondedans.
  placa-del-rei:
    blurb: Het middeleeuwse plein van het koninklijk paleis van de graven en koningen, nu deel van het stadsmuseum, met het Romeinse Barcino eronder opgegraven.
  barri-gotic:
    name: Gotische Wijk
    blurb: Het oudste deel van de stad, op de plek van het Romeinse Barcino, een doolhof van smalle straatjes tussen La Rambla en de Via Laietana.
  carrer-del-bisbe:
    blurb: Het straatje van de Plaça de Sant Jaume naar de kathedraal, overspannen door een neogotische brug die pas in 1928 werd gebouwd.
  placa-de-sant-jaume:
    blurb: Het plein waar het Palau de la Generalitat, de zetel van de Catalaanse regering, het stadhuis aankijkt over het oude Romeinse forum.
  placa-reial:
    blurb: Een plein met arcaden uit de jaren 1840 bij La Rambla, met palmbomen en lantaarnpalen ontworpen door de jonge Gaudí.
  el-raval:
    blurb: De oude stad ten westen van La Rambla, waarvan de naam voorstad betekent. Eerst vulden kloosters en ziekenhuizen haar, daarna textielfabrieken, en nu is het de meest gemengde wijk van de stad.
  via-laietana:
    blurb: De rechte laan die de stad vanaf 1908 dwars door de oude stad trok, van de haven naar de Eixample.
  passeig-del-born:
    blurb: Het lange, smalle plein tussen Santa Maria del Mar en de oude Bornmarkt, waar de stad in de middeleeuwen toernooien en kermissen hield.
  placa-del-portal-de-la-pau:
    blurb: Het plein onderaan La Rambla, bij de haven, waar het Columbusmonument naar de zee wijst.
  port-vell:
    name: De Oude Haven
    blurb: De oude haven van Barcelona aan de voet van La Rambla, waar een houten promenade, de Rambla de Mar, naar het Maremàgnum en het aquarium voert.
  sagrada-familia:
    blurb: Gaudí’s grote basiliek in de Eixample, begonnen in 1882 en nog steeds in aanbouw, zo’n twee kilometer ten noorden van de oude stad.
