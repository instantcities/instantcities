  - Praag wordt de hoofdstad van Tsjechië
places:
  staromestske-namesti:
    name: Oudestadsplein
    blurb: Het hart van de Oude Stad sinds de middeleeuwen, tussen de Týnkerk en het stadhuis met zijn astronomische uurwerk. Het gedenkteken voor Jan Hus staat in het midden.
  celetna:
    blurb: Het eerste stuk van de Koninklijke Weg, de kroningsroute van de Boheemse koningen, van de Kruittoren naar het Oudestadsplein.
  ovocny-trh:
    name: Ovocný trh (de fruitmarkt)
    blurb: De oude fruitmarkt voor het Standentheater, waar Mozarts Don Giovanni in 1787 in première ging. Het Carolinum, het oudste gebouw van de Karelsuniversiteit, staat ernaast.
  na-prikope:
    blurb: Een winkelstraat op de lijn van de gracht die de Oude Stad ooit van de Nieuwe Stad scheidde. De naam betekent ‘op de gracht’.
  vaclavske-namesti:
    name: Wenceslasplein
    blurb: De lange paardenmarkt van Karel IV’s Nieuwe Stad, die klimt naar het standbeeld van Sint-Wenceslaus en het Nationaal Museum. Pragenaars verzamelden zich hier in 1918, 1968 en 1989.
  narodni:
    blurb: De laan van het Nationaal Theater aan de Moldau tot de rand van de Oude Stad. Op 17 november 1989 sloeg de oproerpolitie hier een studentenmars uiteen, en begon de Fluwelen Revolutie.
  karlova:
    blurb: Een kromme steeg van de Koninklijke Weg die van de Oude Stad naar de Karelsbrug kronkelt, langs de muren van het Klementinum.
  krizovnicke-namesti:
    name: Plein van de Kruisheren
    blurb: Het kleine plein aan het Oudestadseinde van de Karelsbrug, tussen de brugtoren van de Oude Stad, het Klementinum en de kerk van de Kruisheren.
  karluv-most:
    name: Karelsbrug
    blurb: De stenen brug over de Moldau die Karel IV in 1357 begon, omzoomd met dertig heiligenbeelden. Tot 1841 was het Praags enige brug over de rivier.
  vltava:
    name: De Moldau
    blurb: De langste rivier van Tsjechië, tussen de Oude Stad en de Kleine Zijde. Smetana zette haar op muziek in zijn symfonische gedicht De Moldau.
  kampa:
    blurb: Het eiland aan de kant van de Kleine Zijde, afgesneden door een smalle molenbeek, de Čertovka of Duivelsbeek, met een park en oude molenraderen.
  namesti-jana-palacha:
    name: Jan Palachplein
    blurb: Het plein aan de rivier voor de concertzaal Rudolfinum, genoemd naar de student die zich in 1969 uit protest tegen de Sovjetbezetting in brand stak.
  parizska:
    blurb: De brede laan die de stad rond 1900 door de Joodse stad aanlegde, van het Oudestadsplein naar de Moldau, omzoomd met art-nouveauhuizen en dure winkels.
  josefov:
    blurb: De oude Joodse stad, genoemd naar keizer Jozef II. De stad sloopte rond 1900 het grootste deel, maar spaarde de synagogen, het stadhuis en de oude begraafplaats.
  prazsky-hrad:
    name: Praagse Burcht
    blurb: De burcht op de rug aan de overkant van de rivier, zetel van de Boheemse koningen en nu van de Tsjechische president, met de Sint-Vituskathedraal binnen de muren.
