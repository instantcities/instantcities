places:
  markt:
    blurb: Het marktplein in het hart van Brugge, onder het Belfort, met het standbeeld van Jan Breydel en Pieter de Coninck, de leiders van 1302.
  burg:
    blurb: Het plein op de plek van de burcht van de graven, met het gotische Stadhuis en de Heilig-Bloedbasiliek.
  steenstraat:
    blurb: De drukke winkelstraat van de Markt naar het westen, richting de Sint-Salvatorskathedraal en ’t Zand.
  wollestraat:
    blurb: De oude wolstraat, van de Markt naast het Belfort naar het zuiden tot aan de gracht.
  blinde-ezelstraat:
    blurb: De Blinde-Ezelstraat, een steegje dat door een poort van de Burg naar de gracht en de Vismarkt loopt.
  rozenhoedkaai:
    blurb: 'De kaai op een bocht van de gracht met het bekendste uitzicht op Brugge: oude huizen aan het water en het Belfort erachter.'
  dijver:
    blurb: Een straat langs de gracht onder lindebomen, met het Groeningemuseum en het Gruuthusepaleis.
  huidenvettersplein:
    blurb: Een pleintje aan de gracht rond het oude gildehuis van de huidenvetters, nu vol restaurantterrassen.
  vismarkt:
    blurb: De vismarkt, met stenen kramen onder zuilengangen uit 1821, waar vishandelaars nog ’s ochtends verkopen.
  groenerei:
    blurb: Een rustige kaai langs de gracht, met het godshuis De Pelikaan.
  reien:
    name: De reien
    blurb: De reien van Brugge, die ooit goederen naar de markten brachten; open boten brengen er nu bezoekers langs.
  jan-van-eyckplein:
    blurb: De oude binnenhaven, met het middeleeuwse tolhuis, de koopmansloge en een standbeeld van Jan van Eyck.
  mariastraat:
    blurb: De straat langs de Onze-Lieve-Vrouwekerk, met haar bakstenen toren van 115 meter, en het Sint-Janshospitaal, thuis van de schilderijen van Memling.
  begijnhof:
    blurb: 'Het begijnhof, gesticht in 1245: witte huizen rond een grasveld onder hoge bomen, waar begijnen, vrome alleenstaande vrouwen, ooit woonden.'
  minnewater:
    blurb: Het Minnewater, ooit het bassin waar de schuiten uit Gent aanlegden, nu een rustig meer in een park.
