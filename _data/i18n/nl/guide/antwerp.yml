places:
  grote-markt:
    blurb: Het hoofdplein van de oude stad, met het renaissancestadhuis, de gildehuizen en de Brabofontein.
  handschoenmarkt:
    blurb: De kleine handschoenmarkt voor de kathedraal, met een oude put waarvan de legende de ijzeren overkapping aan de schilder Quinten Matsijs toeschrijft.
  groenplaats:
    blurb: Vroeger het kerkhof van de kathedraal, nu een groot plein met caféterrassen rond een standbeeld van Rubens.
  meir:
    blurb: De brede hoofdwinkelstraat van Antwerpen, met het 18e-eeuwse koninklijk paleis, het Paleis op de Meir.
  wapper:
    blurb: Het pleintje bij de Meir waar Rubens woonde en zijn atelier had, in het huis dat hij in 1610 kocht.
  steenplein:
    blurb: Het plein aan de rivier rond Het Steen, het oudste gebouw van de stad, met het beeld van de reus Lange Wapper.
  schelde:
    name: De Schelde
    blurb: De brede getijdenrivier die Antwerpens fortuin maakte. Verhoogde wandelkaden lopen langs haar kaaien.
  suikerrui:
    blurb: De straat van de Grote Markt naar de rivier, aangelegd over een van de oude stadsgrachten, de ruien, die nog altijd overwelfd onder de straten lopen.
  hoogstraat:
    blurb: Een oude straat met winkels en cafés die van de Grote Markt naar het zuiden loopt richting Sint-Jansvliet.
  oude-koornmarkt:
    blurb: De oude graanmarkt, een straat met cafés net ten zuiden van de kathedraal.
  vlaaikensgang:
    blurb: Een verborgen steegje met 16e-eeuwse huizen achter de Oude Koornmarkt, waar vroeger schoenmakers woonden.
  vrijdagmarkt:
    blurb: Het plein van de drukkerij Plantin-Moretus, waar op vrijdagochtend nog altijd tweedehandsspullen worden geveild.
  sint-jansvliet:
    blurb: Een plein op een gedempte havengracht, waar houten roltrappen naar de Sint-Annatunnel voor voetgangers onder de Schelde leiden, geopend in 1933.
  hendrik-conscienceplein:
    blurb: Een rustig plein voor de barokke jezuïetenkerk Sint-Carolus Borromeus, met een standbeeld van schrijver Hendrik Conscience.
