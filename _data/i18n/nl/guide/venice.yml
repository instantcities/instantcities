places:
  piazza-san-marco:
    name: San Marcoplein
    blurb: Het grote plein van Venetië, aan één kant afgesloten door de Basiliek van San Marco en aan drie kanten omzoomd door de arcaden van de oude regeringsgebouwen.
  piazzetta-san-marco:
    name: Piazzetta San Marco
    blurb: Het kleinere plein tussen het Dogenpaleis en de Biblioteca Marciana, dat zich tussen de zuilen van Sint-Marcus en Sint-Theodorus op de lagune opent.
  mercerie:
    name: De Mercerie
    blurb: De reeks winkelsteegjes van de klokkentoren op het San Marcoplein naar het Rialto, sinds de middeleeuwen de hoofdstraat van de stad.
  campo-san-bartolomeo:
    blurb: Het drukke pleintje aan de voet van de Rialtobrug, waar Venetianen elkaar ontmoeten onder het bronzen standbeeld van toneelschrijver Carlo Goldoni.
  ponte-di-rialto:
    name: Rialtobrug
    blurb: De stenen brug uit 1591 over het Canal Grande, met twee rijen winkels op de boog. Tot 1854 was het de enige brug over het kanaal.
  canal-grande:
    name: Het Canal Grande
    blurb: Venetië’s hoofdstraat, een S-vormige waterweg van bijna vier kilometer omzoomd met paleizen, die maar vier bruggen kruisen.
  campo-san-polo:
    blurb: Een van de grootste pleinen van Venetië, aan de overkant van het Canal Grande vanaf San Marco, waar de stad ooit stierengevechten en kermissen hield.
  campo-santo-stefano:
    blurb: Een lang plein tussen de Accademiabrug en San Marco, met het standbeeld van schrijver Niccolò Tommaseo in het midden.
  ponte-dell-accademia:
    name: Accademiabrug
    blurb: De houten brug over het Canal Grande naar de Gallerie dell’Accademia. Hij werd in 1933 als tijdelijke brug opgericht en later in dezelfde vorm herbouwd.
  campo-della-salute:
    blurb: De trappen van Santa Maria della Salute, de kerk met koepel die Baldassare Longhena na de pest van 1630 bouwde aan de monding van het Canal Grande.
  ponte-dei-sospiri:
    name: Brug der Zuchten
    blurb: De gesloten witte stenen brug die gevangenen van het Dogenpaleis naar de gevangenissen aan de overkant van het kanaal bracht.
  riva-degli-schiavoni:
    blurb: De brede stenen kade langs de lagune ten oosten van het Dogenpaleis, genoemd naar de kooplieden uit Dalmatië die hier hun schepen afmeerden.
  campo-santa-maria-formosa:
    blurb: Een breed, onregelmatig plein in Castello rond de kerk Santa Maria Formosa, die Mauro Codussi vanaf 1492 herbouwde.
  campo-santi-giovanni-e-paolo:
    blurb: Het plein voor de grote dominicanenkerk waar 25 dogen begraven liggen, met Verrocchio’s ruiterstandbeeld van de huurlingenleider Bartolomeo Colleoni.
  strada-nova:
    blurb: De breedste straat van Cannaregio, die de stad in de 19e eeuw door huizen en gedempte kanalen sloeg om een wandelroute naar het station te openen.
