places:
  stephansplatz:
    name: Stephansplatz
    blurb: Het plein rond de Stephansdom, waar de Graben, de Kärntner Straße en de Rotenturmstraße samenkomen. Eronder ligt de Virgilkapelle, een middeleeuwse kapel die bouwvakkers in 1973 vonden bij het graven van de metro.
  graben:
    name: Graben
    blurb: Een brede voetgangersstraat op de lijn van de gracht van het Romeinse fort, die haar de naam gaf. De barokke Pestzuil staat in het midden.
  kaerntner-strasse:
    name: Kärntner Straße
    blurb: De drukke winkelstraat van de Stephansdom naar de Staatsopera, genoemd naar Karinthië, Kärnten, de provincie waar de oude weg heen leidde.
  neuer-markt:
    blurb: Een plein aan de Kärntner Straße met de Donnerfontein en de Kapucijnenkerk, waarvan de crypte de graven van de Habsburgers bevat.
  albertinaplatz:
    blurb: Het plein onder de Albertina, achter de Staatsopera, met Alfred Hrdlicka’s gedenkteken tegen oorlog en fascisme.
  kohlmarkt:
    blurb: De korte, elegante straat van de Graben naar de Hofburg, genoemd naar de houtskool die er ooit werd verkocht, met juweliers, modehuizen en banketbakker Demel.
  michaelerplatz:
    blurb: Het ronde plein voor de koepelpoort van de Hofburg, met Romeinse resten in het midden en het kale Looshaus, dat de Wenenaars in 1911 schokte.
  josefsplatz:
    blurb: Een binnenplaatsachtig plein van de Hofburg met een ruiterstandbeeld van Jozef II, voor de barokke Prunksaal van de Nationale Bibliotheek.
  heldenplatz:
    name: Heldenplatz
    blurb: Het grote open plein van de Hofburg, met ruiterstandbeelden van prins Eugenius en aartshertog Karel. Vanaf het balkon van de Neue Burg proclameerde Hitler hier in 1938 de annexatie van Oostenrijk.
  ringstrasse:
    name: De Ringstraße
    blurb: De boulevard rond de oude stad die vanaf 1857 de plaats van de stadsmuren innam, omzoomd door de Opera, het Parlement, het stadhuis en de grote musea.
  herrengasse:
    blurb: De straat van de stadspaleizen van de adel, van het Michaelerplatz naar de Freyung, met het oude parlement van Neder-Oostenrijk en het Café Central.
  am-hof:
    blurb: Het grootste plein van de oude stad, waar de Babenbergse hertogen hun hof hielden. Vanaf het balkon van de kerk riep een heraut in 1806 het einde van het Heilige Roomse Rijk uit.
  judenplatz:
    blurb: Het centrum van de middeleeuwse Joodse wijk, in 1421 verwoest, met Rachel Whitereads Holocaustmonument, een in beton gegoten bibliotheek met binnenstebuiten gekeerde boeken.
  hoher-markt:
    blurb: Een van de oudste pleinen van Wenen, boven de resten van het Romeinse fort, met de Ankeruhr, een art-nouveauklok waarlangs om twaalf uur historische figuren defileren.
  donaukanal:
    name: Het Donaukanaal
    blurb: De arm van de Donau langs de noordoostrand van de oude stad; de hoofdrivier stroomt verder weg. In de zomer vullen bars en ligstoelen de oevers.
