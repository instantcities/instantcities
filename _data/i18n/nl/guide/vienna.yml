facts:
- Oostenrijk
- Wenen is een eigen deelstaat
- Ongeveer 2 miljoen inwoners (stad), 2,9 miljoen (grootstedelijk gebied)
- Als het Romeinse fort Vindobona, rond 100 n.Chr.
- De Donau, met het Donaukanaal langs de oude stad
- Duits
- De Stad van de Muziek
- Het historische centrum, sinds 2001, en Paleis Schönbrunn, sinds 1996
overview:
- 'Wenen ligt aan de Donau, aan de voet van de laatste heuvels van de Alpen, het Wienerwald. De oude stad, de Innere Stadt, is klein: een ring van straten rond de Stephansdom, die de stadsmuren tot de jaren 1850 omsloten. Toen keizer Frans Jozef de muren liet slopen, bouwde de stad op hun plaats de Ringstraße, een brede boulevard met de Opera, het Parlement, het stadhuis en de grote musea.'
- Het centrum waar je in Instant Wenen doorheen rijdt, is deze oude stad. Vanaf het Stephansplatz leiden de Graben en de Kohlmarkt naar het westen naar de Hofburg, het paleis van de keizers, met het Heldenplatz en de Ring erachter. De Kärntner Straße loopt naar het zuiden naar de Staatsopera, en in het noorden liggen stille pleinen als Am Hof, het Judenplatz en de Hoher Markt op de grond van het Romeinse fort, boven het Donaukanaal.
setting:
- Wenen ligt in het oosten van Oostenrijk, dicht bij de grenzen met Slowakije, Tsjechië en Hongarije; Bratislava is maar zo’n 55 kilometer weg. De Donau stroomt ten noordoosten van de stad langs, en het smallere Donaukanaal loopt langs de rand van de oude stad.
- In het westen en noorden rijzen de groene heuvels van het Wienerwald op, en binnen de stadsgrenzen groeien wijngaarden, waardoor Wenen een van de weinige hoofdsteden is die hun eigen wijn produceren. Het klimaat is continentaal, met hete zomers en koude winters.
today:
- Wenen is de hoofdstad en grootste stad van Oostenrijk, een van de negen deelstaten, en de zetel van regering en parlement. Het herbergt een van de vier hoofdkantoren van de Verenigde Naties, het Internationaal Atoomenergieagentschap, OPEC en de OVSE. De economie draait op diensten, onderzoek, toerisme en congressen, en de stad staat regelmatig bovenaan internationale ranglijsten van de leefbaarste steden.
- De stad bezit of financiert een groot deel van haar woningen, dus veel Wenenaars huren gemeentewoningen. Het leven beweegt zich tussen het koffiehuis, de wijntavernes, de Heurigen, aan de rand van de stad, en de concertzalen. In de winter vult het bal-seizoen de paleizen, en op 1 januari speelt de Wiener Philharmoniker zijn Nieuwjaarsconcert voor een wereldwijd televisiepubliek.
history:
- title: Van Romeins fort tot Habsburgse residentie
  text:
  - De Romeinen bouwden rond 100 n.Chr. het legioenfort Vindobona aan de Donau, op de grens van hun rijk; de Graben volgt de lijn van de gracht. Nadat de Romeinen vertrokken waren, overleefde een kleine stad binnen de oude muren. In de 12e eeuw maakten de Babenbergse hertogen Wenen hun residentie en hielden hof op het plein Am Hof, en de eerste Stephanskerk rees net buiten de oude muren op.
  - In 1278 versloeg Rudolf van Habsburg koning Ottokar van Bohemen, en zijn familie regeerde vanuit Wenen tot 1918. Hertog Rudolf IV stichtte in 1365 de universiteit en breidde de Stephanskerk in gotische stijl uit; de zuidtoren, voltooid in 1433, rijst nog steeds boven de oude stad uit.
- title: De keizerlijke hoofdstad
  text:
  - Terwijl de Habsburgers kronen verzamelden in heel Midden-Europa, werd Wenen de hoofdstad van een groot rijk en het bolwerk tegen de Ottomanen, die de stad in 1529 en 1683 belegerden. Nadat het tweede beleg mislukte, bouwden edelen en keizers barokke paleizen zoals het Belvedere en Schönbrunn, en de Karlskirche. Maria Theresia hervormde de staat vanuit de Hofburg, en Haydn, Mozart en Beethoven werkten in de stad. In 1814 en 1815 tekende het Congres van Wenen de kaart van Europa opnieuw na Napoleon.
  - 'Frans Jozef regeerde 68 jaar, van 1848 tot 1916. Hij liet vanaf 1857 de muren slopen en gaf Wenen de Ringstraße. Rond 1900 passeerde de stad twee miljoen inwoners en beleefde ze haar creatiefste jaren: Sigmund Freud stichtte de psychoanalyse, Gustav Klimt en de Secession braken met de academische kunst, en Gustav Mahler leidde de Hofopera.'
- title: Hoofdstad van de republiek
  text:
  - Het rijk viel uiteen aan het eind van de Eerste Wereldoorlog, en in 1918 werd Wenen de te grote hoofdstad van een kleine Oostenrijkse republiek. De sociaaldemocratische gemeenteraad bouwde grote blokken gemeentewoningen voor arbeiders, het tijdperk van het Rode Wenen. In maart 1938 annexeerde nazi-Duitsland Oostenrijk, en de nazi’s verdreven en vermoordden het grootste deel van de grote Joodse gemeenschap van de stad. Geallieerde bommen en de slag om Wenen in 1945 beschadigden de Stephansdom en de Opera.
  - De vier geallieerde mogendheden bezetten de stad tien jaar lang gezamenlijk, het Wenen van de film The Third Man. Het Staatsverdrag van 1955 maakte Oostenrijk onafhankelijk en neutraal, en Wenen werd een ontmoetingsplaats tussen Oost en West, met kantoren van de Verenigde Naties, de OVSE en OPEC. Oostenrijk trad in 1995 toe tot de Europese Unie.
