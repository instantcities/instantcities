places:
  piazza-del-duomo:
    blurb: Het plein rond de kathedraal, Giotto’s klokkentoren en het achthoekige Baptisterium met zijn vergulde bronzen deuren.
  via-dei-calzaiuoli:
    blurb: De belangrijkste voetgangersstraat van Florence, van de kathedraal naar de Piazza della Signoria langs de gildekerk Orsanmichele, genoemd naar de kousenmakers die hier ooit hun winkels hadden.
  piazza-della-repubblica:
    blurb: Het plein dat de stad vanaf de jaren 1880 vrijmaakte op de plek van het Romeinse forum, de oude markt en het joodse getto, met zijn triomfboog en oude cafés.
  piazza-della-signoria:
    blurb: Zeven eeuwen lang het politieke hart van Florence, voor het Palazzo Vecchio, met een kopie van Michelangelo’s David aan de deur.
  piazzale-degli-uffizi:
    blurb: De lange, smalle binnenplaats tussen de twee vleugels van de Uffizi, die Vasari vanaf 1560 bouwde als kantoren voor de Medici-regering. In de nissen staan beelden van beroemde Toscanen.
  ponte-vecchio:
    blurb: De brug uit 1345 met winkels erlangs, waar groothertog Ferdinando I in 1593 de slagers door goudsmeden verving.
  arno:
    name: De Arno
    blurb: De rivier van Florence, tussen de stenen kades van de lungarni, overspannen door de Ponte Vecchio en een reeks andere bruggen.
  ponte-santa-trinita:
    blurb: Ammannati’s sierlijke brug uit 1569, in 1944 opgeblazen en in 1958 herbouwd met stenen die uit de rivier waren opgevist.
  via-tornabuoni:
    blurb: De statigste winkelstraat van Florence, omzoomd met modehuizen en renaissancepaleizen zoals het Palazzo Strozzi.
  piazza-santa-maria-novella:
    blurb: Het brede plein voor de dominicanenkerk met de zwart-witte marmeren gevel die Leon Battista Alberti voltooide.
  piazza-santissima-annunziata:
    blurb: Een rustig plein met arcaden, met aan een kant Brunelleschi’s loggia van het Ospedale degli Innocenti, het oude vondelingenhuis van de stad.
  piazza-santa-croce:
    blurb: Het plein voor de franciscanenkerk waar Michelangelo, Galilei en Machiavelli begraven liggen. In juni wordt het het speelveld voor de calcio storico.
  piazza-pitti:
    blurb: Het hellende plein onder het Palazzo Pitti, het paleis waar de Medici in de 16e eeuw introkken, met de Boboli-tuinen erachter.
  piazza-santo-spirito:
    blurb: Het dorpsplein van de Oltrarno, voor Brunelleschi’s kerk met haar kale, onvoltooide gevel, met ’s ochtends een markt en ’s avonds bars.
