places:
  piazza-sant-oronzo:
    blurb: Het hoofdplein van Lecce, met het Romeinse amfitheater half uitgegraven in het midden en Sint-Orontius op zijn zuil erboven.
  via-vittorio-emanuele:
    blurb: De hoofdstraat van de oude stad, van de Piazza Sant’Oronzo langs de kerk Sant’Irene naar de kathedraal.
  piazza-del-duomo:
    blurb: Het besloten plein van de kathedraal, het bisschoppelijk paleis en het seminarie, dat zich alleen via een smalle opening vanaf de straat opent.
  via-libertini:
    blurb: De straat van de kathedraal naar de Porta Rudiae, langs de Rosariokerk, het laatste werk van Giuseppe Zimbalo.
  porta-rudiae:
    blurb: De westelijke poort, herbouwd in 1703, met Sint-Orontius bovenop, aan de weg naar de antieke stad Rudiae.
  via-palmieri:
    blurb: Een straat met adellijke paleizen die van het hart van de oude stad naar de Porta Napoli leidt.
  porta-napoli:
    blurb: De triomfboog van 1548 voor Karel V, waar de weg naar Napels de stad verliet.
  via-umberto-i:
    blurb: De straat van de Basilica di Santa Croce en de lange gevel van het Palazzo dei Celestini, nu de zetel van het provinciebestuur.
  piazza-vittorio-emanuele:
    blurb: Een klein plein net ten zuiden van de Piazza Sant’Oronzo, voor de achthoekige kerk Santa Chiara en een paar stappen van het Romeinse theater.
  porta-san-biagio:
    blurb: De zuidelijke poort van 1774, met Sint-Blasius bovenop, uitkijkend op de weg naar Otranto.
  castello-carlo-v:
    name: Kasteel van Karel V
    blurb: De vierkante vesting met pijlvormige bastions aan de oostkant van de oude stad, nu open voor tentoonstellingen.
  villa-comunale:
    blurb: De 19e-eeuwse openbare tuin genoemd naar Garibaldi, met palmen en dennen, net buiten de oude stad bij het kasteel.
  via-trinchese:
    blurb: De winkelstraat van de nieuwere stad, van de Piazza Sant’Oronzo naar het oosten tot de Piazza Mazzini.
  piazza-mazzini:
    blurb: Het grote plein van de 20e-eeuwse stad buiten de oude muren, omringd door winkels.
