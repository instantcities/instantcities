  - Griekse kolonisten uit Megara stichten Byzantium
- - '330'
  - Constantijn de Grote maakt het zijn hoofdstad, Constantinopel
- - '532'
  - De Nika-opstand verbrandt een groot deel van de stad
- - '537'
  - Justinianus’ nieuwe Hagia Sophia is voltooid
- - '1204'
  - De Vierde Kruistocht plundert de stad
- - '1453'
  - Mehmed II neemt Constantinopel in en maakt het de Ottomaanse hoofdstad
- - '1459'
  - Begin van de bouw van het Topkapıpaleis
- - '1616'
  - De Blauwe Moskee is voltooid
- - '1665'
