places:
  puerta-del-sol:
    name: Puerta del Sol
    blurb: Madrids drukste plein, met kilometer nul van Spanjes wegen en de klok die het nieuwe jaar inluidt.
  calle-preciados:
    blurb: De voetgangerswinkelstraat van de Puerta del Sol naar Callao, omzoomd met warenhuizen.
  plaza-de-callao:
    blurb: Het plein aan de Gran Vía met bioscopen en neonreclames, onder andere het Schweppes-bord op het Carrión-gebouw.
  gran-via:
    blurb: De grote laan die vanaf 1910 door de oude stad werd gesneden, met banken, theaters, hotels en enkele van Europa’s eerste hoge gebouwen.
  plaza-de-espana:
    blurb: Het grote plein aan het eind van de Gran Vía, met een monument voor Cervantes en zijn Don Quichot en Sancho Panza, in 2021 heropend na een verbouwing die er meer van aan tuinen en wandelaars gaf.
  calle-del-arenal:
    blurb: De straat van de Puerta del Sol naar de opera, genoemd naar de zandige bedding van een beek die er ooit langs liep.
  plaza-de-oriente:
    blurb: De tuinen tussen het Koninklijk Paleis en het operahuis, omzoomd met beelden van Spaanse koningen.
  calle-de-bailen:
    blurb: De straat langs het Koninklijk Paleis en de kathedraal, genoemd naar een Spaanse overwinning op Napoleons leger in 1808, die de Calle de Segovia op een viaduct kruist.
  calle-mayor:
    blurb: De oude hoofdstraat van Madrid, van de Puerta del Sol naar het westen richting het paleis, de route van koninklijke processies.
  plaza-de-la-villa:
    blurb: Een klein plein bij de Calle Mayor met gebouwen uit drie eeuwen, waar de gemeenteraad tot 2007 vergaderde.
  plaza-mayor:
    blurb: Het plein met arcaden uit 1619, ooit het toneel van markten, stierengevechten en de processen van de Inquisitie.
  calle-de-la-cava-baja:
    blurb: De straat van tavernes en tapasbars in La Latina, die de gracht buiten de middeleeuwse muren volgt.
  plaza-de-santa-ana:
    blurb: Het plein met bars en terrassen in de Barrio de las Letras, voor het Teatro Español.
  calle-de-las-huertas:
    blurb: De hoofdstraat van de Barrio de las Letras, waar Cervantes en Lope de Vega woonden, met regels uit hun werk in bronzen letters in het plaveisel.
  carrera-de-san-jeronimo:
    blurb: De straat van de Puerta del Sol naar het Paseo del Prado, langs het Congres van Afgevaardigden met zijn bronzen leeuwen.
