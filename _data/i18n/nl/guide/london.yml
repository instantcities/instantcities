places:
  thames:
    name: De Theems
    blurb: Londens getijdenrivier, die enkele meters rijst en daalt, twee keer per dag. De muren van de Embankment verbergen de Victoriaanse riolen.
  westminster-bridge:
    blurb: De groen geverfde ijzeren brug uit 1862 naast het Parlementsgebouw, groen als de banken van het Lagerhuis.
  parliament-square:
    blurb: Een grasveld tussen het Parlement, Westminster Abbey en het Hooggerechtshof, omringd door standbeelden van staatslieden als Winston Churchill en Nelson Mandela.
  broad-sanctuary:
    blurb: De straat voor de westgevel van Westminster Abbey, genoemd naar het toevluchtsoord waar voortvluchtigen ooit voor de wet konden schuilen.
  whitehall:
    blurb: De brede straat van regeringsministeries van Trafalgar Square naar het Parlement, met in het midden de Cenotaaf, het nationale oorlogsmonument.
  downing-street:
    blurb: De korte straat achter ijzeren hekken waar de premier op nummer 10 woont.
  horse-guards-parade:
    blurb: Het grote grindexercitieterrein achter Horse Guards, waar elk jaar in juni Trooping the Colour plaatsvindt.
  trafalgar-square:
    blurb: Londens grote plein, met Nelson op zijn zuil, vier bronzen leeuwen en de National Gallery aan de noordkant.
  the-mall:
    blurb: De rood geplaveide laan van Admiralty Arch naar Buckingham Palace, de route van koninklijke processies.
  st-jamess-park:
    blurb: Het oudste van de koninklijke parken, met een meer, pelikanen en vanaf de brug uitzicht op Buckingham Palace.
  strand:
    blurb: De oude weg van Westminster naar de City, ooit langs de oever, nu omzoomd met theaters, hotels en het Savoy.
  victoria-embankment:
    blurb: De rivierweg die Joseph Bazalgette in de jaren 1860 op teruggewonnen land bouwde, boven een riool en de District line.
  golden-jubilee-bridges:
    blurb: Twee voetgangersbruggen aan weerszijden van het spoor van de Hungerford Bridge, van Charing Cross naar de South Bank.
  queens-walk:
    name: De Queen’s Walk
    blurb: De rivierpromenade van de South Bank, langs het London Eye en de kunstcentra, met uitzicht over het Parlement aan de overkant.
