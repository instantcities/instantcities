places:
  union-square:
    blurb: Het plein van de warenhuizen en hotels, met het Dewey Monument in het midden.
  powell-street:
    blurb: De straat van de cable cars, van hun draaischijf bij Market Street de Nob Hill op.
  dragon-gate:
    blurb: De poort met groene daken naar Chinatown, bij Grant Avenue en Bush Street.
  grant-avenue:
    blurb: De hoofdstraat van Chinatown, onder slingers van rode lampions.
  portsmouth-square:
    blurb: De oude plaza van Yerba Buena, waar de stad begon, nu de huiskamer van Chinatown.
  california-street:
    blurb: De cable carlijn van het Financial District de Nob Hill op, langs Old St. Mary’s.
  transamerica-pyramid:
    blurb: De witte piramide uit 1972, 260 meter hoog.
  jackson-square:
    blurb: Een paar huizenblokken met bakstenen gebouwen uit de goudkoorts die de brand van 1906 overleefden.
  market-street:
    blurb: De hoofdlaan van de stad, van het Ferry Building naar het zuidwesten door de stad.
  ferry-building:
    blurb: De veerterminal uit 1898 met zijn klokkentoren, nu een eetmarkt.
  embarcadero:
    blurb: De boulevard langs de baai en zijn pieren, met palmen en oude trams.
  columbus-avenue:
    blurb: De diagonale straat van North Beach, van de Transamerica Pyramid naar de baai.
  city-lights:
    blurb: De boekwinkel van de Beat-dichters, bij Columbus Avenue en Broadway.
  washington-square:
    blurb: Het park van North Beach, voor de kerk van de Heiligen Petrus en Paulus.
  telegraph-hill:
    blurb: De steile heuvel boven de baai, met houten huizen langs de Filbert Steps en wilde papegaaien.
  coit-tower:
    blurb: De betonnen toren op de top van Telegraph Hill, met muurschilderingen binnen.
