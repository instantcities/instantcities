overview:
- Het centrum van San Francisco ligt in de noordoosthoek, aan de baai. Market Street loopt van het Ferry Building aan de waterkant naar het zuidwesten door de stad, en ten noorden ervan liggen de torens van het Financial District, Union Square met zijn winkels en hotels, Chinatown langs Grant Avenue en North Beach, de oude Italiaanse wijk rond Washington Square. Boven dit alles rijst Telegraph Hill op met bovenop de Coit Tower, en langs de baai loopt de Embarcadero, langs de pieren.
- 'Instant San Francisco brengt je door het hart ervan: over Grant Avenue door Chinatown naar de Dragon Gate, langs Bush Street door het Financial District, langs Market Street naar het Ferry Building, langs de Embarcadero aan de baai en terug langs Washington Street, voorbij de Transamerica Pyramid en Portsmouth Square. Anders dan de echte stad is het spel vlak.'
setting:
- San Francisco beslaat de noordpunt van het schiereiland San Francisco, zo’n elf kilometer breed. In het westen ligt de Stille Oceaan, in het noorden de zeestraat Golden Gate en in het oosten de baai, met Oakland en Berkeley aan de overkant. De straten lopen in een rechte rasterstructuur over meer dan veertig heuvels, waardoor veel ervan hellingen op klimmen die geen auto elders zou nemen. De San Andreasbreuk loopt net voor de kust in het westen.
- 'Het klimaat is het hele jaar zacht. De winters zijn koel en brengen de meeste regen, en de zomers zijn ook koel: op veel middagen rolt de mist vanuit de oceaan door de Golden Gate naar binnen en bedekt de brug en de westelijke helft van de stad, terwijl de zon aan de baaizijde nog schijnt. Er valt bijna nooit sneeuw.'
today:
- San Francisco heeft ongeveer 830.000 inwoners en is het culturele centrum van een Bay Area van bijna acht miljoen mensen. Veel van de grote techbedrijven ter wereld hebben hier of net ten zuiden ervan hun kantoren, en de stad staat bekend om haar restaurants, haar parken en haar lange geschiedenis als plek waar mensen komen om anders te leven.
- Bezoekers rijden met de cable cars, lopen over de Golden Gate Bridge, nemen de veerboot naar Alcatraz en eten in het Ferry Building en op Fisherman’s Wharf. Wonen is er een van de duurste van het land, en de stad twist nog steeds over hoe ze moet groeien.
history:
- title: Een missiepost en een baai
  text:
  - De Ohlone woonden duizenden jaren rond de baai voor de Spanjaarden kwamen. In 1776 stichtte Spanje op het schiereiland een fort, de Presidio, en de missiepost San Francisco de Asís, genoemd naar Sint-Franciscus van Assisi.
  - In 1835 groeide bij een inham van de baai een klein handelsdorp, Yerba Buena, rond een plaza die nu Portsmouth Square is. In 1846, in de oorlog met Mexico, hees de bemanning van de USS Portsmouth de Amerikaanse vlag op die plaza, en een jaar later kreeg het dorp de naam San Francisco.
- title: De goudkoorts
  text:
  - In 1848 werd goud gevonden in de uitlopers van de Sierra Nevada, en San Francisco was de haven waar iedereen doorheen kwam. In twee jaar groeide het dorp van zo’n duizend mensen uit tot een stad van tienduizenden, van tenten, hutten en gokhallen. Bemanningen lieten hun schepen in de inham achter om te gaan graven, en sommige schepen werden als winkels en onderkomens gebruikt.
  - 'De inham werd opgevuld om meer land te maken, schepen en al, en de oever schoof enkele huizenblokken op. Montgomery Street, waar nu de Transamerica Pyramid staat, lag ooit aan het water. Ook Chinese migranten kwamen en vestigden zich rond de oude plaza: het begin van Chinatown.'
- title: De aardbeving en de brand
  text:
  - Om 5.12 uur ’s ochtends op 18 april 1906 schudde een zware aardbeving de stad door elkaar. Gasleidingen braken en overal braken branden uit, en doordat ook de waterleidingen kapot waren, brandden ze drie dagen lang. Zo’n 28.000 gebouwen gingen verloren, het grootste deel van de stad ten oosten van Van Ness Avenue, en ongeveer drieduizend mensen kwamen om.
  - De stad werd snel herbouwd, op hetzelfde stratenplan. Chinatown kwam terug met pagodedaken, en in 1915 hield San Francisco een wereldtentoonstelling, de Panama-Pacific International Exposition, om te laten zien dat ze was herrezen.
- title: Bruggen, Beats en techniek
  text:
  - De Bay Bridge naar Oakland ging in 1936 open en de Golden Gate Bridge in 1937, en de veerboten verloren de meeste passagiers. In de jaren vijftig verzamelden de Beat-dichters zich in North Beach rond de boekwinkel City Lights, en in 1967 kwamen jongeren uit het hele land naar Haight-Ashbury voor de Summer of Love.
  - Op 17 oktober 1989 beschadigde de Loma Prieta-aardbeving de snelweg met twee verdiepingen langs de Embarcadero, en de stad liet hem slopen, waardoor de waterkant weer opende. Sinds de jaren negentig hebben de techbedrijven van Silicon Valley zich in de stad uitgebreid, en nieuwe torens zoals de Salesforce Tower zijn ten zuiden van Market Street verrezen.
