  - UNESCO zet het historische centrum op de Werelderfgoedlijst
places:
  rhone:
    name: De Rhône
    blurb: De brede, snelle rivier langs de noord- en westkant van de muren, op weg van de Alpen naar de Middellandse Zee.
  pont-saint-benezet:
    blurb: De brug uit het liedje, Sur le pont d’Avignon. Overstromingen namen de meeste bogen mee, en er staan er nog maar vier.
  rocher-des-doms:
    blurb: Een tuin bovenop de rots boven de rivier, met een vijver en uitzicht over de Rhône naar Villeneuve-lès-Avignon en de Mont Ventoux.
  place-du-palais:
    blurb: Het brede, schuin aflopende plein voor het Pausenpaleis, met bovenaan de kathedraal.
  place-de-l-horloge:
    blurb: Het hoofdplein van Avignon, omzoomd met caféterrassen, het stadhuis, het theater en een oude draaimolen.
  rue-de-la-republique:
    blurb: De rechte hoofdwinkelstraat, in de 19e eeuw dwars door de oude stad aangelegd van de stationspoort naar de Place de l’Horloge.
  porte-de-l-oulle:
    blurb: Een poort in de westelijke stadsmuren, met uitzicht op de Rhône en de brug naar het Île de la Barthelasse.
  rue-joseph-vernet:
    blurb: Een kronkelende straat met herenhuizen uit de 17e en 18e eeuw, nu met modewinkels en het Musée Calvet.
  place-saint-pierre:
    blurb: Een klein plein voor de gotische kerk Saint-Pierre, waarvan de gesneden notenhouten deuren uit de 16e eeuw dateren.
  place-pie:
    blurb: Het plein van Les Halles, de overdekte markt, waarvan de voorgevel bedekt is met een verticale tuin van levende planten.
  rue-des-marchands:
    blurb: Een smalle voetgangersstraat met winkels tussen de Place de l’Horloge en de Place Carnot.
  rue-du-roi-rene:
    blurb: Een rustige straat met oude herenhuizen, waar de dichter Petrarca in 1327 in de kerk Sainte-Claire zijn Laura voor het eerst zou hebben gezien.
  rue-des-teinturiers:
    blurb: Een straat met kasseien onder platanen langs een kanaal van de Sorgue, waar tot in de 19e eeuw lakenverwers werkten en nog een paar oude waterraderen draaien.
  place-des-corps-saints:
    blurb: Een schaduwrijk plein met platanen en caféterrassen in het zuiden van de oude stad.
