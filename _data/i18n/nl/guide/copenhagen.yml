places:
  radhuspladsen:
    name: Raadhuisplein
    blurb: Het grote plein voor het rode bakstenen Raadhuis uit 1905, waar Strøget begint. Tivoli ligt aan de overkant van de boulevard.
  tivoli:
    name: Tivoli
    blurb: De lusthof die in 1843 opende naast de oude stadsgracht, nu een meer erbinnen, met attracties, concerten en duizenden lichtjes in de avond.
  stroget:
    blurb: De keten van voetgangersstraten van het Raadhuisplein naar Kongens Nytorv. De stad sloot haar in 1962 af voor auto’s, wat haar een van de eerste lange voetgangersstraten van Europa maakte.
  gammeltorv:
    blurb: Het oudste plein van Kopenhagen, aan Strøget, met de Caritasfontein uit 1608. Het oude gerechtsgebouw staat aan Nytorv ernaast.
  grabrodretorv:
    blurb: Een klein plein met kasseien op de plek van een franciscanenklooster, de Grauwe Broeders, omzoomd met kleurrijke oude huizen en restaurantterrassen.
  kobmagergade:
    blurb: Een voetgangersstraat die vanaf Strøget naar het noorden loopt langs de Ronde Toren, de sterrenwacht die Christiaan IV liet bouwen met een spiraalhelling in plaats van trappen.
  amagertorv:
    blurb: Het breedste stuk van Strøget, met de Ooievaarsfontein, genoemd naar de boeren van Amager die hier hun producten verkochten.
  hojbro-plads:
    blurb: Het plein aan het einde van Strøget tegenover Slotsholmen, met een ruiterstandbeeld van bisschop Absalon, de stichter van de stad.
  gammel-strand:
    blurb: De oude oever aan de overkant van de gracht van Christiansborg, waar visvrouwen ooit de vangst verkochten en vanwaar nu de rondvaartboten vertrekken.
  slotsholmen:
    blurb: Het eiland waar Absalon zijn kasteel bouwde, nu de thuis van paleis Christiansborg en de oude beurs, Børsen.
  kongens-nytorv:
    blurb: Het grootste plein van de stad, aangelegd onder Christiaan V in de jaren 1670, met zijn ruiterstandbeeld in het midden en het Koninklijk Deens Theater ernaast.
  nyhavn:
    blurb: De gracht die in de jaren 1670 van Kongens Nytorv naar de haven werd gegraven, omzoomd met felgekleurde huizen en oude houten schepen. Hans Christian Andersen woonde in drie van zijn huizen.
  bredgade:
    blurb: De brede hoofdstraat van Frederiksstaden, die vanaf Kongens Nytorv naar het noorden loopt langs de Marmeren Kerk naar het Designmuseum.
  amalienborg:
    name: Amalienborg-plein
    blurb: Het achthoekige plein van vier identieke paleizen, sinds 1794 de thuis van de koninklijke familie, met Frederik V te paard in het midden. De wacht wordt hier elke dag om twaalf uur afgelost.
  christianshavns-kanal:
    name: Christianshavnse gracht
    blurb: De gracht door Christianshavn, de wijk aan de overkant van de haven die Christiaan IV vanaf 1619 aanlegde op teruggewonnen land, naar het voorbeeld van Amsterdam.
