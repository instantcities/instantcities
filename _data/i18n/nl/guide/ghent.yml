places:
  graslei:
    blurb: De kade aan de oostoever van de oude haven, omzoomd met de gildehuizen van de middeleeuwse kooplieden en schippers.
  korenlei:
    blurb: De kade tegenover de Graslei, met koopmanshuizen uit de 16e tot 18e eeuw.
  leie:
    name: De Leie
    blurb: De rivier die door de oude stad stroomt om de Schelde te ontmoeten. Haar stuk tussen de bruggen was de middeleeuwse haven van Gent; tegenwoordig vertrekken rondvaartboten van haar kaden.
  sint-michielsbrug:
    blurb: De stenen brug over de Leie vanwaar je de Graslei, de Korenlei en de drie torens van de oude stad op een rij ziet.
  korenmarkt:
    blurb: De oude graanmarkt, een lang plein aan de voet van de Sint-Niklaaskerk, waar de trams langsrijden en de Veldstraat begint.
  emile-braunplein:
    blurb: Het open plein tussen de Sint-Niklaaskerk en het Belfort, met het houten en glazen stadspaviljoen, de Stadshal.
  sint-baafsplein:
    blurb: Het plein voor de Sint-Baafskathedraal, met het Nederlandstalig theater (NTGent) ertegenover.
  botermarkt:
    blurb: De oude botermarkt, met tegenover zich de renaissancegevel van het stadhuis; de gotische zijde kijkt uit op de Hoogpoort.
  werregarenstraat:
    blurb: Een smal steegje waar graffiti is toegestaan, steeds opnieuw overschilderd.
  vrijdagmarkt:
    blurb: Het grote plein van de vrijdagmarkt, eeuwenlang de plaats van bijeenkomsten en opstanden, met een standbeeld van Jacob van Artevelde.
  kraanlei:
    blurb: Een kade langs de Leie met oude huizen met trapgevels, genoemd naar de kraan die hier vroeger de boten loste.
  patershol:
    blurb: Een doolhof van middeleeuwse steegjes achter de Kraanlei, ooit een arme ambachtswijk, nu vol restaurants.
  groentenmarkt:
    blurb: De oude groentenmarkt naast het lange dak van het Groot Vleeshuis, de middeleeuwse vleeshal.
  sint-veerleplein:
    blurb: Het plein voor het Gravensteen, ooit de plaats van de openbare terechtstellingen van de stad.
  veldstraat:
    blurb: De belangrijkste winkelstraat van Gent, die van de Korenmarkt naar het zuiden loopt, vrij van auto’s.
