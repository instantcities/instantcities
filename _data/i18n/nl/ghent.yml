# Ghent's page in Dutch (_layouts/city.html, at /nl/<slug>/): the words of its block in
# _data/cities.yml, the intro of its guide (_data/about/ghent.json) and its landmarks' names and blurbs
# (_data/landmarks/ghent.json, by id; a name it leaves out stays as it is). What this leaves out stays English.
title: 'Instant Gent: gratis virtuele 3D-rondleiding en game van Gent'
description: 'Maak gratis een virtuele 3D-rondleiding door Gent in je browser, en fiets, wandel of galoppeer er daarna zelf door: verken, race of speel opdrachten, alleen of met twee op één toetsenbord.'
tagline: Verken of race met de fiets, te voet of te paard door de stad van Artevelde!
lead: Rijd door heel Gent binnen de R40 in 3D, met elk gebouw op zijn echte hoogte.
features:
- title: Het echte Gent
  text: Dwaal tussen zo’n 40.000 gebouwen, in 3D nagebouwd uit OpenStreetMap, elk op zijn gemeten hoogte. Kijk omhoog naar het Belfort van 95 meter, en naar het Gravensteen, de Stadshal en Sint-Baafs, allemaal op maat getekend.
- title: Vier routes
  text: Race Gent Centrum langs de drie torens, door de smalle straatjes van de Brugse Poort, van Sint-Pieters naar Dampoort dwars door de stad, of van de Overpoort naar het S.M.A.K.
- title: Opdrachten tegen de klok
  text: 'Speel vier korte opdrachten tegen de klok: spoor het gestolen Lam Gods op of ontsnap aan de studentenzombies in de Overpoort.'
shots:
  boat: 'Vrijdagmarkt: op weg naar de laatste boot'
  zombies: Studentenzombies in de Overpoort
  quest-lamb: 'Opdracht: het Lam Gods is gestolen'
  bigmap: 'De stadskaart: teleporteer waar je maar wilt'
intro: Gent is een universiteitsstad in Vlaanderen, het Nederlandstalige noorden van België, waar de Leie in de Schelde stroomt. In de middeleeuwen maakte de lakenhandel het tot een van de grootste steden ten noorden van de Alpen, en de gildehuizen aan de Graslei, het Gravensteen en de torens van de Sint-Niklaaskerk, het Belfort en de Sint-Baafskathedraal tonen nog hoe rijk het was. Sint-Baafs bewaart het Lam Gods van de gebroeders Van Eyck, en sinds 2017 rijden er geen auto’s meer door het middeleeuwse centrum.
famous:
- Het Lam Gods, de Aanbidding van het Lam Gods van Hubert en Jan van Eyck, in de Sint-Baafskathedraal
- Drie middeleeuwse torens op een rij en de gildehuizen van de Graslei, gezien vanaf de Sint-Michielsbrug
- Het Gravensteen, de stenen burcht van de graven van Vlaanderen, midden in de stad
- De Gentse Feesten, elke juli tien dagen muziek en straattheater, en cuberdons, de paarse neuzekes
landmarks:
  sint-baafs-kathedraal:
    name: Sint-Baafskathedraal
    blurb: Gebouwd van de 13e tot de 16e eeuw, met een toren van 89 m. Binnen hangt de Aanbidding van het Lam Gods (1432) van de gebroeders Van Eyck, een van de beroemdste en meest gestolen schilderijen ter wereld. Het paneel van de Rechtvaardige Rechters, gestolen in 1934, is nooit teruggevonden.
  belfort:
    name: Belfort
    blurb: De stadstoren van 91 m, begonnen in 1313. Gent bewaarde hier zijn privilegies, en wachters keken uit naar brand en vijanden. Bovenop houdt een vergulde draak de wacht. Samen met de Lakenhalle ernaast staat het op de Werelderfgoedlijst van UNESCO.
  gravensteen:
    name: Gravensteen
    blurb: De burcht van de graven van Vlaanderen, in 1180 gebouwd door Filips van de Elzas. Later was het een rechtbank, een gevangenis en zelfs een katoenspinnerij, en rond 1900 kreeg het zijn kantelen terug. In 1949 bezetten studenten het, uit protest tegen de stijgende bierprijs.
  graslei:
    name: Graslei en Korenlei
    blurb: De middeleeuwse haven van Gent, aan beide oevers van de Leie. Schippers losten hier graan en de gilden bouwden hun huizen langs de kade. Het Koornstapelhuis, het grijze romaanse graanpakhuis van rond 1200, is een van de oudste huizen van de stad.
  sint-michielsbrug:
    name: Sint-Michielsbrug
    blurb: 'Gebouwd aan het begin van de 20e eeuw, net voor de Wereldtentoonstelling van 1913. Kijk naar het oosten en je ziet de drie torens van Gent op een rij: Sint-Niklaas, het Belfort en Sint-Baafs. Achter je staat de Sint-Michielskerk, waarvan de toren nooit af raakte.'
  sint-niklaaskerk:
    name: Sint-Niklaaskerk
    blurb: 'De kerk van de kooplieden, uit de 13e eeuw, in blauwgrijze Doornikse steen: Scheldegotiek. De toren staat midden op het dak en diende ook als uitkijk, lang voor het Belfort er stond. Nu zijn er ook concerten en tentoonstellingen.'
  stadhuis:
    name: Stadhuis
    blurb: 'Een stadhuis in twee stijlen: weelderige laatgotiek aan de Hoogpoort, sobere renaissance aan de Botermarkt. Geldgebrek en de godsdienstoorlogen legden de bouw telkens stil. De Pacificatie van Gent, een vrede tussen de provincies van de Nederlanden, werd hier in 1576 getekend.'
  vrijdagmarkt:
    blurb: Het plein van markten, feesten en opstanden, waar de graven van Vlaanderen werden ingehuldigd. In het midden wijst Jacob van Artevelde, de brouwer die Gent in 1338 leidde, de weg. Aan de overkant staat Ons Huis, het grote huis van de socialistische arbeidersbeweging.
  groot-vleeshuis:
    name: Groot Vleeshuis
    blurb: De overdekte vleeshal van de beenhouwers, gebouwd van 1406 tot 1419. Onder de indrukwekkende houten kap hangen nog altijd hammen te drogen. Nu kun je er Oost-Vlaamse streekproducten kopen en proeven.
