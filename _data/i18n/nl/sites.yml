# The sites in Dutch (_data/sites.yml, by id): name, place, game, title, description, tagline, lead, card, credits, features and
# facts (title/text and label/text, in the same order), sources (their titles, in order) and places (the list in
# _data/site_places/<id>.json, by id: name, text); what is left out stays English.
taj-mahal:
  name: Taj Mahal
  place: Agra, India
  title: 'Instant Taj Mahal: gratis virtuele 3D-rondleiding en game van de Taj Mahal'
  description: 'Maak gratis een virtuele 3D-rondleiding door de Taj Mahal en zijn tuinen in je browser, en loop, fiets of rijd er daarna zelf doorheen: verken of race, alleen of met twee op één toetsenbord.'
  tagline: Loop of race door de tuinen van de Taj Mahal, tot aan het witmarmeren graf.
  lead: Het graf op zijn platform met de vier minaretten, de moskee en de Jawab aan weerszijden, het lange kanaal en de grote poort waar je binnenkomt.
  card: Het graf met zijn koepel en vier minaretten aan het eind van het lange kanaal, tussen de moskee en de Jawab.
  credits: Kaartgegevens © OpenStreetMap-bijdragers (ODbL).
  features:
  - title: Het graf en zijn tuin
    text: Loop langs het kanaal van de grote poort naar het witmarmeren platform, langs de vier kwarten van de tuin. Het graf, de minaretten, de moskee en de poort zijn met de hand nagebouwd naar hun maten.
  - title: Een race om de tuin
    text: Ren, rijd of galoppeer over het middenpad, langs de voorkant van het platform, de oostkant af en terug naar de poort, over een pad van zandstenen platen.
  - title: Uit OpenStreetMap
    text: De tuin, zijn muren, de kanalen en het voorplein ten zuiden van de poort zijn getekend uit OpenStreetMap, met de paden van de tuin met de hand toegevoegd.
  facts:
  - label: Gebouwd
    text: 1632 tot 1653, in opdracht van de Mogolkeizer Shah Jahan voor zijn vrouw Mumtaz Mahal
  - label: Hoogte
    text: 73 meter van de tuin tot de top van de spits
  - label: Tuin
    text: Een charbagh, vier kwarten rond een lang kanaal, 300 meter breed
  - label: In het spel
    text: Het graf, vier minaretten, de moskee, de Jawab, de grote poort, de tuinmuur en het voorplein
  places:
    great-gate:
      name: De grote poort
      text: Darwaza-i-Rauza, de rode zandstenen poort naar de tuin, voltooid in 1648. De 22 kleine koepels langs de bovenkant zouden staan voor de jaren die de bouw duurde.
    charbagh:
      name: De charbagh
      text: Een Perzische tuin, vier kwarten rond een waterkanaal, 300 meter breed. Hij staat voor de vier rivieren van het paradijs, en vanuit het midden lijkt het graf boven het kanaal te zweven.
    taj-mahal:
      name: De Taj Mahal
      text: Shah Jahan liet hem bouwen voor zijn vrouw Mumtaz Mahal, die in 1631 stierf, en het duurde zo’n 20 jaar. Het marmeren graf staat op een platform, met een uienkoepel op 73 meter hoogte. Bij zonsopgang ziet het er roze uit en bij zonsondergang goud.
    minarets:
      name: De minaretten
      text: De vier minaretten zijn 40 meter hoog en leunen elk een beetje naar buiten. Als er ooit een zou vallen, valt hij van het graf af.
    mosque:
      name: De moskee
      text: De rode zandstenen moskee ten westen van het graf, nog altijd gebruikt op vrijdag. Ze heeft drie witte koepels, en haar gebedsruimte is op Mekka gericht, naar het westen.
    jawab:
      name: De Jawab
      text: "Het “antwoord”: een kopie van de moskee aan de oostkant, gebouwd zodat het zicht op het graf symmetrisch zou zijn. Niemand bidt er, want hij is niet op Mekka gericht."
angkor-wat:
  name: Angkor Wat
  place: Siem Reap, Cambodja
  title: 'Instant Angkor Wat: gratis virtuele 3D-rondleiding en game van Angkor Wat'
  description: 'Maak gratis een virtuele 3D-rondleiding door Angkor Wat in je browser, en loop, fiets of rijd er daarna zelf over de dijk en rond de tempel: verken of race, alleen of met twee op één toetsenbord.'
  tagline: Loop of race over de dijk, langs de gracht en de torens van Angkor Wat.
  lead: "De gracht, de lange dijk en de poort aan het eind ervan, en de tempel zelf: drie niveaus galerijen die oprijzen tot vijf torens."
  card: De gracht en de dijk, de buitenpoort, en de drie niveaus en vijf torens van de tempel.
  credits: Kaartgegevens © OpenStreetMap-bijdragers (ODbL).
  features:
  - title: De tempel en zijn gracht
    text: Steek de gracht over, ga door de westelijke poort en volg de stenen weg naar de tempel. De drie niveaus, galerijen en vijf torens zijn met de hand nagebouwd naar de maten in OpenStreetMap.
  - title: Een race langs de dijk
    text: Van de overkant van de gracht door de poort en omhoog naar de tempel, dan langs de noordkant naar het oosten, één keer, van een startpoort naar een finishpoort.
  - title: Uit OpenStreetMap
    text: De gracht, de paden, de vijvers en de buitenste omheining komen uit OpenStreetMap.
  facts:
  - label: Gebouwd
    text: Begin 12e eeuw, voor de Khmerkoning Suryavarman II, eerst als hindoetempel en later als boeddhistische
  - label: Afmetingen
    text: De gracht is 190 meter breed en de buitenmuur omsluit zo’n 200 hectare
  - label: Torens
    text: Vijf, in een quincunx; de middelste is 65 meter hoog
  - label: In het spel
    text: De gracht en de dijk, de westelijke gopura en de drie niveaus van de tempel met hun galerijen en torens
  places:
    moat:
      name: De gracht
      text: Een gracht van 190 meter breed loopt helemaal om de tempel heen, in totaal 5,5 kilometer. Ze staat voor de oceaan rond de berg Meru, het huis van de goden, en hield de grond van de tempel vochtig en stevig.
    gopura:
      name: De westelijke gopura
      text: De lange poort in de buitenmuur, met drie torens. Olifanten konden door het midden lopen. Erachter loopt een stenen weg van 350 meter naar de tempel.
    libraries:
      name: De bibliotheken
      text: "Twee kleine gebouwen aan weerszijden van de weg, bibliotheken genoemd. Niemand weet wat erin lag: rollen, of heilige voorwerpen."
    terrace:
      name: Het Terras van Eer
      text: Een kruisvormig terras voor de tempel, waar de koning het volk zou hebben ontmoet. Gebeeldhouwde naga’s, slangen met zeven koppen, bewaken de weg.
    galleries:
      name: De galerijen
      text: "De buitenste galerij is 800 meter lang en bedekt met taferelen uit hindoeïstische epen en de veldslagen van de koning: het langste stenen reliëf ter wereld. Twee galerijen rijzen erboven op."
    angkor-wat:
      name: Angkor Wat
      text: Begin 12e eeuw gebouwd voor de Khmerkoning Suryavarman II, eerst als hindoetempel en later als boeddhistische. Drie niveaus rijzen op tot vijf torens, de middelste 65 meter hoog, in de vorm van de berg van de goden.
stonehenge:
  name: Stonehenge
  place: Wiltshire, Engeland
  title: 'Instant Stonehenge: gratis virtuele 3D-rondleiding en game'
  description: Loop rond de staande stenen op de vlakte van Salisbury. Verken, race of volg een rondleiding in je browser.
  tagline: Loop rond de staande stenen op de vlakte van Salisbury.
  lead: De bewaarde cirkel van sarsenstenen, vijf grote trilithons en kleinere blauwstenen, met de Heel Stone naast de toegangsweg.
  card: De bewaarde cirkel van sarsenstenen, vijf grote trilithons en kleinere blauwstenen, met de Heel Stone naast de toegangsweg.
  credits: Kaartgegevens © OpenStreetMap-bijdragers (ODbL). Modellen gemaakt voor Instant Cities.
  features:
  - title: De monumenten
    text: De bewaarde cirkel van sarsenstenen, vijf grote trilithons en kleinere blauwstenen, met de Heel Stone naast de toegangsweg.
  - title: Rond de stenen
    text: Volg de gemarkeerde ronde, of laat de race los om vrij te verkennen. Speel alleen of met twee op één toetsenbord.
  - title: Een rondleiding en een opdracht
    text: Maak een vlucht over de plek met korte uitleg bij de bezienswaardigheden, of zoek je wandelgroep voordat de rondleiding vertrekt.
  facts:
  - label: Periode
    text: In meerdere fasen gebouwd in het neolithicum en de bronstijd
  - label: Stenen
    text: Grote sarsenstenen en kleinere blauwstenen
  - label: Ligging
    text: De vlakte van Salisbury, Wiltshire
  - label: In het spel
    text: Een vereenvoudigd model van de plek. De bezoekersronde is met de hand getekend; de omringende kaartgegevens komen uit OpenStreetMap.
  sources:
  - Geschiedenis en achtergrond
  places:
    place-0:
      name: Steencirkel
      text: De bewaarde sarsenstenen en dekstenen vormen een deel van een cirkel rond de binnenste hoefijzervorm van trilithons.
    place-1:
      name: Heel Stone
      text: Deze onbewerkte sarsensteen staat buiten de hoofdcirkel, naast de toegangsweg langs de Avenue.
    place-2:
      name: De aarden wal
      text: Een ronde wal met gracht omringt de stenen. De aarden wal is ouder dan de hoofdopstelling van stenen.
giza:
  name: Gizeh
  place: Gizeh, Egypte
  title: 'Instant Gizeh: gratis virtuele 3D-rondleiding en game'
  description: Verken de piramides en de Sfinx op het plateau van Gizeh. Verken, race of volg een rondleiding in je browser.
  tagline: Verken de piramides en de Sfinx op het plateau van Gizeh.
  lead: Drie piramides rijzen op boven de woestijn, met kleinere koninginnenpiramides, ruïnes van tempels en de Sfinx aan de oostkant.
  card: Drie piramides rijzen op boven de woestijn, met kleinere koninginnenpiramides, ruïnes van tempels en de Sfinx aan de oostkant.
  credits: Kaartgegevens © OpenStreetMap-bijdragers (ODbL). Modellen gemaakt voor Instant Cities.
  features:
  - title: De monumenten
    text: Drie piramides rijzen op boven de woestijn, met kleinere koninginnenpiramides, ruïnes van tempels en de Sfinx aan de oostkant.
  - title: De ronde over het plateau
    text: Volg de gemarkeerde ronde, of laat de race los om vrij te verkennen. Speel alleen of met twee op één toetsenbord.
  - title: Een rondleiding en een opdracht
    text: Maak een vlucht over de plek met korte uitleg bij de bezienswaardigheden, of zoek je wandelgroep voordat de rondleiding vertrekt.
  facts:
  - label: Periode
    text: De vierde dynastie van het oude Egypte, in het derde millennium v.Chr.
  - label: Piramides
    text: Choefoe, Chefren en Menkaoere
  - label: Ligging
    text: Het woestijnplateau ten westen van de Nijl
  - label: In het spel
    text: Een vereenvoudigd model van de plek. De bezoekersronde is met de hand getekend; de omringende kaartgegevens komen uit OpenStreetMap.
  sources:
  - Geschiedenis en achtergrond
  places:
    place-0:
      name: Grote Piramide van Choefoe
      text: De grootste van de drie hoofdpiramides. Het grootste deel van de gladde buitenbekleding is verloren gegaan.
    place-1:
      name: Piramide van Chefren
      text: De tweede grote piramide heeft bij de top nog bleke bekledingsstenen.
    place-2:
      name: De Grote Sfinx
      text: Een kalkstenen leeuw met een mensenhoofd bewaakt de oostkant van het plateau.
    place-3:
      name: Piramide van Menkaoere
      text: De kleinste van de drie hoofdpiramides staat naast drie veel kleinere piramides.
