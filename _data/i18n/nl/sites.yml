machu-picchu:
  name: Machu Picchu
  place: Regio Cuzco, Peru
  title: 'Instant Machu Picchu: gratis virtuele 3D-rondleiding en game'
  description: Verken de stenen stad van de Inca’s en haar terrassen in de Andes. Verken, race of volg een rondleiding in je browser.
  tagline: Verken de stenen stad van de Inca’s en haar terrassen in de Andes.
  lead: Stenen huizen en tempels zonder dak liggen tussen grazige terrassen, met het steile profiel van de Huayna Picchu erachter.
  card: Stenen huizen en tempels zonder dak liggen tussen grazige terrassen, met het steile profiel van de Huayna Picchu erachter.
  credits: Kaartgegevens © OpenStreetMap-bijdragers (ODbL). Modellen gemaakt voor Instant Cities.
  features:
  - title: De monumenten
    text: Stenen huizen en tempels zonder dak liggen tussen grazige terrassen, met het steile profiel van de Huayna Picchu erachter.
  - title: Door de citadel
    text: Volg de gemarkeerde ronde, of laat de race los om vrij te verkennen. Speel alleen of met twee op één toetsenbord.
  - title: Een rondleiding en een opdracht
    text: Maak een vlucht over de plek met korte uitleg bij de bezienswaardigheden, of zoek je wandelgroep voordat de rondleiding vertrekt.
  facts:
  - label: Periode
    text: Gebouwd in de vijftiende eeuw, in het Incarijk
  - label: Hoogte
    text: Ongeveer 2.430 meter boven zeeniveau
  - label: Ligging
    text: Een bergrug tussen de Andes en het Amazonebekken
  - label: In het spel
    text: Een vereenvoudigd model van de plek. De bezoekersronde is met de hand getekend; de omringende kaartgegevens komen uit OpenStreetMap.
  sources:
  - Geschiedenis en achtergrond
  places:
    place-0:
      name: Heilig Plein
      text: Zorgvuldig gevoegde stenen muren omsluiten de ceremoniële gebouwen aan de bovenkant van de stad.
    place-1:
      name: Landbouwterrassen
      text: Steunmuren verdelen de helling in smalle stroken teelgrond.
    place-2:
      name: Woonwijk
      text: Groepen stenen gebouwen zonder dak staan naast de open ruimtes in het midden.
    place-3:
      name: Huayna Picchu
      text: De steile berg rijst op voorbij het noordelijke eind van de archeologische plek.
