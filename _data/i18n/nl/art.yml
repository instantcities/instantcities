    blurb: Het huis van twee vrijgelaten slaven, in de laatste jaren van de stad helemaal beschilderd.
  casa-del-poeta-tragico:
    name: Het Huis van de Tragische Dichter
    blurb: Een middelgroot huis met de hond aan de deur en schilderingen van Griekse mythen rond het atrium.
  casa-del-menandro:
