# rotterdam's landmarks in Dutch (_data/landmarks/rotterdam.json, by id): name (where it differs), blurb (the card), text (the story),
# history, visit (going to see it) and dates, each as in the English; what is left out stays English.
stadhuis:
  name: Stadhuis
  blurb: Het stadhuis van Rotterdam uit 1920 aan de Coolsingel, een van de weinige gebouwen in het centrum die het bombardement van 1940 overleefden.
  text:
  - Henri Evers bouwde het stadhuis van 1914 tot 1920, in een mengeling van oude Nederlandse stijlen, met een hoge toren en een binnentuin. Het staat aan de Coolsingel, de brede laan die ooit een gracht langs de oude stadsmuur was.
  - Op 14 mei 1940 hield het vuur na het Duitse bombardement net voor het stadhuis halt. Samen met het postkantoor ernaast en de Beurs iets verderop is het een van de weinige stukken van de oude Coolsingel die nog staan, en de stad wordt er nog steeds vanuit bestuurd.
erasmusbrug:
  name: Erasmusbrug
  blurb: De witte tuibrug over de Maas, bijgenaamd de Zwaan, die het teken van het nieuwe Rotterdam werd.
  text:
  - Ben van Berkel ontwierp de Erasmusbrug, en koningin Beatrix opende hem in 1996. De gebogen witte pyloon, 139 meter hoog, houdt het wegdek vast met een waaier van kabels, en aan de zuidkant gaat een basculebrug open voor de schepen.
  - Hij verbond het centrum met de Kop van Zuid, de oude havens aan de zuidoever, die na de opening vol torens kwamen te staan. De Rotterdammers noemen hem de Zwaan.
witte-huis:
  name: Witte Huis
  blurb: Het witte kantoorgebouw uit 1898 bij de Oude Haven, een van de eerste hoogbouwgebouwen van Europa.
  text:
  - 'Toen het in 1898 klaar was, was het Witte Huis een van de hoogste kantoorgebouwen van Europa: 43 meter en tien verdiepingen van wit geglazuurde baksteen, met hoektorens en een dak als een kasteel. De bouwers haalden het idee uit de nieuwe kantoorgebouwen van Amerika.'
  - Het overleefde het bombardement van 1940 en staat op de hoek van de Oude Haven en de Wijnhaven, met uitzicht over de oude schepen op de rode Willemsbrug.
oude-haven:
  blurb: De oudste haven van Rotterdam, vol oude zeilschepen, met terrassen langs de kades.
  text:
  - De Oude Haven werd in de 14e eeuw gegraven, toen Rotterdam nog een stadje op de dam in de Rotte was. Tegenwoordig is het een museumhaven waar oude Nederlandse binnenvaartschepen en sleepboten liggen afgemeerd, met cafés aan de kaden.
  - Eromheen staan het Witte Huis, de kubuswoningen en de nieuwe blokken uit de jaren tachtig, en ’s avonds is het een van de drukste hoeken van de stad.
kubuswoningen:
  name: Kubuswoningen
  blurb: De gele huizen van Piet Blom, gekanteld op hun punt, een bos van kubussen op een voetgangersbrug over de Blaak.
  text:
  - 'Piet Blom bouwde de kubuswoningen van 1982 tot 1984: 38 huizen, elk een kubus die 45 graden op zijn punt is gekanteld en op een zeshoekige pilaar staat, zodat ze samen op een bos van bomen lijken. Ze staan op een brug over de drukke Blaak, met een voetgangersstraat eronderdoor.'
  - Er wonen mensen in, met overal schuine muren, en een ervan, de Kijk-Kubus, is open voor bezoekers. De hoge toren met de spitse top ernaast is ook van Blom, en de Rotterdammers noemen hem het Potlood.
markthal:
  blurb: Een hoefijzervormige boog van woningen over een overdekte markt, met het grootste kunstwerk van Nederland op het plafond.
  text:
  - 'MVRDV ontwierp de Markthal, en koningin Máxima opende hem in 2014: een markthal met eetkramen en restaurants onder een boog van 228 woningen, met hoge glazen gevels aan beide uiteinden.'
  - 'De binnenkant van de boog is bedekt met de Hoorn des Overvloeds van Arno Coenen en Iris Roskam: gigantisch fruit, groenten, vis, bloemen en insecten over zo’n 11.000 vierkante meter. Op dinsdag en zaterdag vult de openluchtmarkt buiten de Binnenrotte.'
laurenskerk:
  blurb: De grote laatgotische kerk van de stad, in 1940 uitgebrand en herbouwd, het laatste middeleeuwse gebouw van het centrum.
  text:
  - De Grote of Sint-Laurenskerk werd van 1449 tot 1525 gebouwd, de parochiekerk van de middeleeuwse stad, met een zware vierkante toren. Bij het bombardement van 1940 brandde ze uit, maar haar muren en toren bleven staan, en in 1968 was ze herbouwd. Het is het enige middeleeuwse gebouw dat nog in het centrum van Rotterdam staat.
  - Binnen staan grote orgels en de graven van Nederlandse admiraals. Op het plein ervoor staat Hendrick de Keysers standbeeld van Erasmus, in Rotterdam geboren, met een boek in de hand; in 1622 gegoten is het het oudste bronzen standbeeld van Nederland.
schielandshuis:
  blurb: Een 17e-eeuws classicistisch paleis tussen de torens, dat het bombardement van 1940 overleefde.
  text:
  - Het Schielandshuis werd van 1662 tot 1665 gebouwd voor het Hoogheemraadschap van Schieland, het waterschap dat het land rond Rotterdam droog hield. Het is een van de weinige 17e-eeuwse gebouwen die in het centrum over zijn.
  - De stenen gevel en de rode luiken staan nu aan de voet van glazen kantoortorens, wat het tot een van de meest gefotografeerde contrasten van de stad maakt.
maritiem-museum:
  blurb: Het maritiem museum aan de Leuvehaven, met oude kranen, een lichtschip en werkschepen die ervoor aangemeerd liggen.
  text:
  - Het Maritiem Museum, opgericht in 1874, is het oudste scheepvaartmuseum van Nederland. Het vertelt het verhaal van Rotterdam en zijn haven, van schepen, zeelieden en de zee.
  - Buiten is de Leuvehaven een museumhaven op zich, met oude vrachtschepen, sleepboten en kranen waar je langs kunt lopen.
de-verwoeste-stad:
  name: De Verwoeste Stad
  blurb: Ossip Zadkines bronzen figuur met een gat dwars door het lichaam, het gedenkteken voor het bombardement van 1940.
  text:
  - 'De beeldhouwer Ossip Zadkine bezocht Rotterdam in 1946 en zag de lege ruimte waar het centrum was geweest. Zijn figuur De Verwoeste Stad werd in 1953 onthuld: een gestalte die de armen opwerpt, met het hart uit het lichaam gerukt.'
  - Het staat op het Plein 1940, het plein bij de Leuvehaven dat naar het jaar van het bombardement is genoemd.
lijnbaan:
  blurb: De eerste winkelstraat van Europa die voor voetgangers werd gebouwd, geopend in 1953 in het herbouwde centrum.
  text:
  - 'Van den Broek en Bakema ontwierpen de Lijnbaan als onderdeel van het plan om het gebombardeerde centrum te herbouwen, en hij ging in 1953 open: lage winkels langs een straat zonder auto’s, met luifels om onder te lopen en woningen erachter.'
  - Het was de eerste straat van dit soort in Europa, en stedenbouwers kwamen van over de hele wereld kijken. Het is nog steeds de belangrijkste winkelstraat van Rotterdam.
euromast:
  name: Euromast
  blurb: De toren in Het Park aan de Maas, gebouwd voor de Floriade van 1960 en in 1970 verhoogd tot 185 meter.
  text:
  - De Euromast werd gebouwd voor de bloemententoonstelling Floriade van 1960, een betonnen toren van 101 meter met een restaurant in het kraaiennest. In 1970 werd er een slanke Space Tower bovenop gezet, waardoor hij 185 meter werd.
  - Vanaf de top zie je de hele stad, de rivier en de haven tot aan zee. Hij staat ten westen van het centrum, voorbij de rand van de kaart van het spel.
haven:
  name: De haven
  blurb: De grootste haven van Europa, die zich over zo’n 40 kilometer uitstrekt van de stad tot de Noordzee.
  text:
  - Rotterdam groeide met zijn haven, waar de Rijn en de Maas de zee bereiken. Van 1962 tot 2004 was het de drukste haven ter wereld, en nog steeds is het de grootste van Europa, met havenbekkens, olieterminals en containerkaden helemaal tot aan de Maasvlakte op land dat op de Noordzee is gewonnen.
  - Boten brengen bezoekers op havenrondvaarten vanaf de voet van de Erasmusbrug, langs de kranen en de schepen van de Waalhaven en de Eemhaven.
