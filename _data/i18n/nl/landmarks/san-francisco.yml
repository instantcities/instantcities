# san-francisco's landmarks in Dutch (_data/landmarks/san-francisco.json, by id): name (where it differs), blurb (the card), text (the story),
# history, visit (going to see it) and dates, each as in the English; what is left out stays English.
transamerica-pyramid:
  blurb: De witte piramide van het Financial District, 260 meter hoog, sinds 1972 het herkenningsteken van de skyline.
  text:
  - De Transamerica Pyramid rijst met 48 verdiepingen op van de hoek van Montgomery Street en Columbus Avenue en loopt de hele weg smaller toe tot een spits op 260 meter. Architect William Pereira gaf hem zijn vorm zodat er meer licht de straten eronder bereikt dan een doos van dezelfde grootte zou doorlaten. Vlak onder de top steken twee vleugels uit, een voor de liften en een voor de trappen.
  - Hij werd in 1972 voltooid en was voor veel mensen eerst te modern. Hij was het hoogste gebouw van San Francisco tot de Salesforce Tower hem in 2018 voorbijstak. Aan de oostkant ligt Redwood Park, een bosje sequoia’s dat uit de Santa Cruz Mountains hierheen is verplaatst.
  - De piramide staat waar vanaf 1853 het Montgomery Block stond, in zijn tijd het grootste kantoorgebouw van het Westen, later een thuis voor schrijvers en kunstenaars, dat in 1959 werd gesloopt.
ferry-building:
  blurb: De veerterminal onderaan Market Street, met zijn klokkentoren naar de Giralda van Sevilla, nu een overdekte foodmarkt.
  text:
  - Het Ferry Building opende in 1898 aan het einde van Market Street, waar de veerboten over de baai aanlegden. De klokkentoren, 75 meter hoog, is gemodelleerd naar de Giralda, de klokkentoren van de kathedraal van Sevilla. Voor de Bay Bridge en de Golden Gate Bridge in 1936 en 1937 opengingen, kwamen er ongeveer vijftigduizend mensen per dag doorheen.
  - Het doorstond de aardbevingen van 1906 en 1989. In 1959 werd vlak ervoor een snelweg met twee verdiepingen gebouwd, de Embarcadero Freeway, die het van de stad afsneed; nadat de aardbeving van 1989 die snelweg beschadigde, werd hij gesloopt en opende de waterkant weer.
  - Sinds 2003 is de lange hal binnen een markt van bakkers, kaasmakers, koffiebranders en oesterbars, en drie dagen per week staat er een boerenmarkt omheen. Aan de achterkant vertrekken nog steeds veerboten naar Sausalito, Larkspur, Oakland en Alameda.
coit-tower:
  blurb: De slanke betonnen toren boven op Telegraph Hill, gebouwd in 1933 met het geld van Lillie Hitchcock Coit.
  text:
  - De Coit Tower is 64 meter hoog en staat op de top van Telegraph Hill, de heuvel waar vroeger een semafoor aan de stad liet weten welke schepen door de Golden Gate binnenkwamen. Hij werd betaald door Lillie Hitchcock Coit, die in 1929 een derde van haar fortuin naliet om de stad mooier te maken, en werd in 1933 voltooid.
  - Lillie Coit hield van de brandweerlieden van de stad en reed als meisje met hen mee, dus veel mensen zeggen dat de toren op het mondstuk van een brandslang lijkt. De architecten, Arthur Brown Jr. en Henry Howard, hebben altijd gezegd dat dat nooit de bedoeling was.
  - In de hal schilderden meer dan twintig kunstenaars in 1934 muurschilderingen over het leven in Californië, betaald door het eerste federale kunstprogramma van de New Deal. Een lift brengt bezoekers naar de top, met uitzicht over de baai, de bruggen en Alcatraz.
dragon-gate:
  blurb: De poort naar Chinatown op Grant Avenue bij Bush Street, met groene pannendaken, draken en twee stenen leeuwen.
  text:
  - De Dragon Gate staat waar Grant Avenue Bush Street ontmoet, aan de zuidkant van Chinatown. Hij werd in 1970 gebouwd naar een ontwerp van Clayton Lee, met steen en tegels geschonken door de Republiek China op Taiwan. De drie bogen hebben daken van groen geglazuurde tegels, met draken en karpers op de nokken, en twee stenen leeuwen bewaken de doorgang.
  - 'Boven de middelste boog hangen vier tekens geschreven door Sun Yat-sen, de stichter van de Chinese republiek, die tijd in San Francisco doorbracht om geld in te zamelen voor de revolutie: “Alles onder de hemel is voor het welzijn van het volk”.'
  - 'Voorbij de poort verandert Grant Avenue meteen: rode lampions hangen boven de straat, en de winkels verkopen thee, zijde, jade en souvenirs.'
chinatown:
  blurb: De oudste Chinatown van Noord-Amerika, langs Grant Avenue en Stockton Street, met lampionnen boven de straat.
  text:
  - Chinezen kwamen tijdens de goudkoorts van 1849 naar San Francisco en vestigden zich rond Portsmouth Square en Dupont Street, het huidige Grant Avenue. Chinatown groeide uit tot de grootste Chinese gemeenschap buiten Azië, hoewel de Chinese Exclusion Act van 1882 de meeste nieuwe migranten zestig jaar buiten hield.
  - De aardbeving en de brand van 1906 brandden het volledig af, en de stad wilde het verplaatsen. De Chinese kooplieden herbouwden het in plaats daarvan snel, met pagodedaken en beschilderde balkons, deels om bezoekers te trekken.
  - Grant Avenue is de straat van de winkels en restaurants, terwijl Stockton Street, een huizenblok hoger op de heuvel, de plek is waar de buurt zijn vis, groenten en gebraden eend koopt. In de steegjes ertussen liggen tempels, familieverenigingen en een gelukskoekjesbakkerij in Ross Alley.
union-square:
  blurb: Het plein van de grote winkels en hotels, genoemd naar de bijeenkomsten voor de Unie voor de Burgeroorlog.
  text:
  - Union Square werd in 1850 als park gereserveerd door John Geary, de eerste burgemeester van de stad. De naam komt van de grote bijeenkomsten die hier in 1860 en 1861 voor de Unie werden gehouden, toen de Burgeroorlog op het punt stond te beginnen.
  - In het midden staat het Dewey Monument, een zuil met bovenop een bronzen Victoria, in 1903 opgericht voor de overwinning van admiraal Dewey in de baai van Manilla in 1898. Onder het plein ligt een parkeergarage uit 1942, een van de eerste ondergrondse garages ter wereld.
  - Rond het plein liggen de grote warenhuizen en hotels, met het St. Francis aan de westkant. Met Kerstmis staan er een hoge boom en een ijsbaan op het plein, en de cable cars op Powell Street laten hun bellen klingelen langs de westkant.
cable-cars:
  name: Cable cars
  blurb: De laatste cable cars ter wereld die nog door stadsstraten rijden, de heuvels op getrokken door een kabel onder de weg.
  text:
  - Een cable car heeft geen motor. Een stalen kabel loopt in een gleuf onder de straat, altijd in beweging met zo’n 15 kilometer per uur, rondgetrokken door grote wielen in de krachtcentrale aan Washington Street. De gripman trekt aan een hendel die de kabel vastgrijpt om te rijden, en laat hem los om te stoppen, terwijl hij de bel luidt als de wagen klimt.
  - 'Andrew Hallidie liet de eerste rijden op Clay Street op 2 augustus 1873, nadat hij paarden had zien uitglijden en vallen terwijl ze een tram een natte heuvel op trokken. In 1890 klommen meer dan twintig lijnen de heuvels van de stad op. Tegenwoordig zijn er nog drie: Powell–Hyde, Powell–Mason en California Street.'
  - Aan het eind van Powell Street, bij Market Street, stoppen de wagens op een draaischijf en duwt de bemanning ze met de hand rond voor de terugreis. In 1947 wilde de burgemeester ze door bussen vervangen, maar Friedel Klussmann en haar comité wonnen de stemming om ze te houden. Ze zijn sinds 1964 een National Historic Landmark.
washington-square:
  blurb: Het groene hart van North Beach, de Italiaanse wijk, voor de witte kerk van Sint-Petrus-en-Paulus.
  text:
  - Washington Square is een van de oudste parken van de stad, aangelegd in 1847. Het is niet helemaal een vierkant, omdat Columbus Avenue een hoek afsnijdt, en het ligt niet aan Washington Street. Eromheen ligt North Beach, waar Italiaanse vissers en hun gezinnen zich vanaf het eind van de 19e eeuw vestigden.
  - Aan de noordkant staat de kerk van de Heiligen Petrus en Paulus, voltooid in 1924, met twee witte torenspitsen. Joe DiMaggio, de honkbalspeler die in North Beach opgroeide, liet zijn trouwfoto’s met Marilyn Monroe in 1954 op de trappen maken.
  - ’s Ochtends doen mensen tai chi op het gras, en de cafés en bakkerijen rond het plein serveren espresso en focaccia. Een standbeeld van Benjamin Franklin en een standbeeld van drie vrijwillige brandweermannen, betaald door Lillie Coit, staan in het park.
city-lights:
  blurb: De boekwinkel van de Beatdichters op Columbus Avenue, die in 1956 Howl van Allen Ginsberg uitgaf.
  text:
  - City Lights opende in 1953 aan Columbus Avenue bij Broadway, opgericht door de dichter Lawrence Ferlinghetti en Peter D. Martin. Het was een van de eerste winkels van het land die alleen pockets verkocht, en bleef laat open voor de dichters en schrijvers van North Beach.
  - In 1956 publiceerde Ferlinghetti Allen Ginsbergs gedicht Howl in zijn reeks Pocket Poets. De politie nam het boek in beslag en arresteerde hem voor de verkoop van obscene geschriften, maar in 1957 oordeelde een rechter dat het gedicht niet obsceen was. Het proces maakte Howl, City Lights en de Beat-schrijvers beroemd.
  - Het steegje naast de winkel is genoemd naar Jack Kerouac, en aan de overkant ligt Vesuvio, de bar waar de Beats dronken. Ferlinghetti bleef tot op hoge leeftijd in de winkel werken; hij overleed in 2021, op 101-jarige leeftijd.
golden-gate-bridge:
  name: Golden Gate Bridge
  blurb: De oranje hangbrug over de monding van de baai, zo’n vijf kilometer ten westen van de kaart van het spel.
  text:
  - De Golden Gate is de zeestraat tussen de Stille Oceaan en de baai van San Francisco, zo genoemd door ontdekkingsreiziger John C. Frémont in 1846. De brug erover ging open op 27 mei 1937, na vier jaar werk in mist, wind en sterke stromingen. Zijn hoofdoverspanning van 1.280 meter was tot 1964 de langste ter wereld.
  - 'De twee torens staan 227 meter boven het water. De kleur heet International Orange: architect Irving Morrow koos haar omdat ze opvalt in de mist en goed past bij de heuvels eromheen. Een team schilders bijt het hele jaar door bij.'
  - De brug ligt in de noordwesthoek van de stad, te ver naar het westen voor het stuk San Francisco in het spel. Op een heldere dag zie je zijn torens vanaf de top van de Coit Tower.
lombard-street:
  name: Lombard Street
  blurb: Het stuk Lombard Street op Russian Hill met acht haarspeldbochten tussen bloembedden, ten westen van de kaart van het spel.
  text:
  - Tussen Hyde Street en Leavenworth Street daalt Lombard Street langs de zijkant van Russian Hill in acht strakke bochten, tussen hagen en bloembedden. De heuvel is daar te steil voor een rechte straat, dus in 1922 werden de bochten aangelegd om het veilig te maken voor auto’s.
  - Auto’s mogen er alleen naar beneden, stapvoets, en mensen staan bovenaan in de rij om erdoor te rijden. Ze wordt vaak de kronkeligste straat ter wereld genoemd, hoewel Vermont Street, in het zuiden van de stad, meer bochten heeft.
  - Ze ligt zo’n kilometer ten westen van Washington Square, net buiten de kaart van het spel. In het spel is de stad vlak, dus haar bochten zouden geen heuvel hebben om op te klimmen.
alcatraz:
  name: Alcatraz
  blurb: Het rotsachtige eiland in de baai, van 1934 tot 1963 een federale gevangenis, gebouwd zodat niemand kon wegzwemmen.
  text:
  - Alcatraz ligt in de baai, zo’n twee kilometer ten noorden van de waterkant. De Spanjaarden noemden het in 1775 het eiland van de pelikanen, en in 1854 werd er de eerste vuurtoren van de westkust van de Verenigde Staten ontstoken. Het leger bouwde er een fort en een militaire gevangenis.
  - Van 1934 tot 1963 was het een federale gevangenis voor de mannen die andere gevangenissen niet konden vasthouden, onder wie Al Capone. Het koude water en de sterke stromingen eromheen moesten ontsnappen onmogelijk maken. In juni 1962 glipten Frank Morris en de broers John en Clarence Anglin uit hun cel, met hoofden van papier-maché in hun bed, en peddelden weg op een vlot van regenjassen. Ze zijn nooit gevonden.
  - Van 1969 tot 1971 bezetten indianen het eiland om het als indiaans land op te eisen. Tegenwoordig maakt het deel uit van een nationaal park, en veerboten brengen bezoekers er vanaf Pier 33 aan de Embarcadero heen.
sourdough:
  name: Zuurdesembrood
  blurb: Het zure, taaie brood van San Francisco, sinds de goudkoorts gebakken van een levend deeg.
  text:
  - Zuurdesembrood rijst zonder gekochte gist. De bakker bewaart een stuk van het deeg van elke dag, de moeder, en voedt het met meel en water; de wilde gisten en bacteriën die erin leven laten het brood rijzen en geven het zijn zure smaak. In San Francisco is het brood zuurder dan elders, en een van de bacteriën is naar de stad genoemd, Lactobacillus sanfranciscensis.
  - De mijnwerkers van de goudkoorts bakten het in hun kampen, en oude goudzoekers werden sourdoughs genoemd. De bakkerij Boudin bakt het sinds 1849 en zegt nog steeds een moeder te gebruiken die sindsdien in leven is gehouden.
  - Bezoekers eten het op Fisherman’s Wharf als broodkom, uitgehold en gevuld met clam chowder.
