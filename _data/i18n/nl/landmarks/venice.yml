# venice's landmarks in Dutch (_data/landmarks/venice.json, by id): name (where it differs), blurb (the card), text (the story),
# history, visit (going to see it) and dates, each as in the English; what is left out stays English.
piazza-san-marco:
  name: San Marcoplein
  blurb: Het enige plein in Venetië dat piazza heet, omringd door arcaden en open naar de lagune.
  text:
  - Napoleon zou het de mooiste salon van Europa hebben genoemd. Aan drie kanten sluiten de lange Procuratie met arcaden, ooit de kantoren van de procuratoren van San Marco, het af; aan de vierde rijzen de basiliek en de klokkentoren op.
  - Bij hoogwater is het plein de eerste plek die onderloopt, omdat het water door de afvoeren omhoogkomt. De cafés, zoals het Florian uit 1720, hebben orkesten die buiten spelen.
basilica-di-san-marco:
  name: San Marcobasiliek
  blurb: Gebouwd voor de relieken van Sint-Marcus, vanbinnen bedekt met gouden mozaïeken.
  text:
  - Venetiaanse kooplieden smokkelden in 828 het lichaam van Sint-Marcus uit Alexandrië, verborgen onder varkensvlees zodat de moslimwachten de mand niet zouden doorzoeken. De basiliek werd gebouwd om het te bewaren, en vanaf 1063 in haar huidige vorm herbouwd.
  - Haar vijf koepels en haar muren van marmer en gouden mozaïek tonen Venetië’s banden met Byzantium. Op de gevel staan kopieën van de vier bronzen paarden die in 1204 uit Constantinopel werden gehaald; de originelen staan binnen.
palazzo-ducale:
  name: Dogepaleis
  blurb: Het roze-witte gotische paleis van waaruit de doges de Republiek Venetië bestuurden.
  text:
  - Eeuwenlang was het Dogenpaleis de zetel van de doge, het gekozen hoofd van de Republiek, en van haar raden en rechtbanken. De gevel van roze en wit marmer rust op twee verdiepingen arcaden, zodat het zware deel lijkt te zweven.
  - Binnen bevat de Zaal van de Grote Raad Tintoretto’s Paradijs, een van de grootste olieverfschilderijen ter wereld. De gevangenissen lagen aan de overkant van het kanaal, over de Brug der Zuchten.
campanile:
  name: Campanile van San Marco
  blurb: De klokkentoren van San Marco, die in 1902 instortte en werd herbouwd “waar hij stond, zoals hij was”.
  text:
  - De bakstenen klokkentoren rijst bijna 99 meter boven het plein. Op 14 juli 1902 stortte hij in tot een hoop puin; wonderlijk genoeg stierf alleen de kat van de conciërge.
  - Venetië herbouwde hem precies zoals hij was, “com’era, dov’era”, en in 1912 ging hij weer open. Een lift brengt je naar de top, waar Galilei ooit zijn telescoop aan de doge liet zien.
ponte-dei-sospiri:
  name: Zuchtenbrug
  blurb: De overdekte stenen brug tussen het Dogepaleis en de gevangenissen, gebouwd in 1600.
  text:
  - De overdekte brug van wit kalksteen verbindt de rechtszalen van het Dogenpaleis met de Nieuwe Gevangenissen aan de overkant van de Rio di Palazzo. Hij werd rond 1600 gebouwd.
  - 'De naam komt van Lord Byron en de romantici: de zuchten zouden die zijn van gevangenen die door de kleine getraliede raampjes een laatste blik op Venetië wierpen.'
ponte-di-rialto:
  name: Rialtobrug
  blurb: De stenen brug uit 1591 over het Canal Grande, met winkeltjes langs haar boog.
  text:
  - Eeuwenlang was het Rialto de enige brug over het Canal Grande, eerst van boten, daarna van hout. De houten brug stortte twee keer in; in 1591 voltooide Antonio da Ponte de stenen brug die er nu staat, met één boog die hoog genoeg is voor galeien.
  - Twee rijen winkels flankeren de trappen. Rond de voet ligt de Rialtomarkt, waar Venetië al duizend jaar zijn vis en groente koopt.
canal-grande:
  name: Canal Grande
  blurb: De grote S-vormige waterweg midden door Venetië, omzoomd met paleizen.
  text:
  - Het Canal Grande kronkelt bijna vier kilometer in een omgekeerde S door de stad, omzoomd door zo’n 170 paleizen die in vijf eeuwen door de grote families van de stad zijn gebouwd, met hun deuren op het water.
  - 'Het is de hoofdstraat van Venetië: vaporetti, watertaxi’s, bevoorradingsschepen en gondels delen het, en maar vier bruggen kruisen het.'
mercerie:
  blurb: De reeks smalle winkelstraatjes van San Marco naar de Rialto, de route van de race in het spel.
  text:
  - De Mercerie zijn een reeks smalle straten die de twee centra van het oude Venetië verbinden, het politieke bij San Marco en het handelscentrum bij het Rialto. Ze gaan onder de klokkentoren door en kronkelen langs winkels die er sinds de middeleeuwen zitten.
  - Het zijn de drukste calli van de stad, en in het spel loopt de race erlangs, over de kleine bruggen, van de piazza naar het Rialto.
la-fenice:
  blurb: Het operahuis van Venetië, dat meer dan eens uit zijn as herrees, zoals zijn naam belooft.
  text:
  - La Fenice, de feniks, opende in 1792 en zag de première van opera’s van Rossini, Bellini en Verdi, onder wie La Traviata.
  - Het brandde in 1836 af en opnieuw, door brandstichting, in 1996. Herbouwd zoals het was, ging het in 2003 weer open.
gondola:
  name: Gondel
  blurb: De lange zwarte boot van Venetië, staand geroeid met één roeispaan.
  text:
  - Een gondel is ongeveer elf meter lang, zwart en een beetje scheef gebouwd, zodat de gondelier die achterin staat hem met één roeispaan recht kan houden. De ijzeren boeg, de ferro, zou de zes wijken van de stad voorstellen.
  - Er waren er ooit duizenden; tegenwoordig varen er zo’n vierhonderd met bezoekers over de kanalen, en een paar traghetti, gondelveren, zetten nog steeds mensen voor een paar euro over het Canal Grande.
vaporetto:
  name: Vaporetto
  blurb: De waterbus van Venetië, die van halte naar halte het Canal Grande op en neer tuft.
  text:
  - 'Zonder auto’s in de stad is de vaporetto het openbaar vervoer: een brede, lage waterbus van de ACTV, die stopt bij drijvende steigers langs het Canal Grande en naar de eilanden van de lagune.'
  - Lijn 1 vaart de hele lengte van het Canal Grande, langzaam genoeg om elk paleis te zien.
carnevale:
  name: Carnaval
  blurb: Twee weken maskers en kostuums voor de vastentijd, die de pleinen van Venetië vullen.
  text:
  - Het carnaval van Venetië gaat terug tot de middeleeuwen, toen maskers mensen van elke rang in de straten lieten mengen. Napoleon verbood het; in 1979 werd het nieuw leven ingeblazen.
  - Tegenwoordig brengt het in de twee weken voor de vastentijd kostuums en maskers terug naar San Marco, van de witte bauta tot het masker met lange neus van de pestdokter.
acqua-alta:
  name: Acqua alta
  blurb: Het hoogwater dat het San Marcoplein onder water zet, nu tegengehouden door de MOSE-keringen.
  text:
  - Meerdere keren per jaar, vooral in de herfst en winter, stijgt het getij van de Adriatische Zee hoog genoeg om de laagste delen van Venetië onder water te zetten, het San Marcoplein eerst. Er worden verhoogde loopplanken neergelegd en sirenes waarschuwen de stad.
  - In 1966 en 2019 steeg het water tot bijna twee meter. Sinds 2020 kan de MOSE, een rij keringen op de zeebodem bij de monden van de lagune, omhoog worden gehaald om het getij tegen te houden.
