# London's page in Dutch (_layouts/city.html, at /nl/<slug>/): the words of its block in
# _data/cities.yml, the intro of its guide (_data/about/london.json) and its landmarks' names and blurbs
# (_data/landmarks/london.json, by id; a name it leaves out stays as it is). What this leaves out stays English.
title: 'Instant London: gratis virtuele 3D-rondleiding en game van Londen'
description: 'Maak gratis een virtuele 3D-rondleiding door het centrum van Londen in je browser, en fiets, wandel of galoppeer er daarna zelf door: verken of race, alleen of met twee op één toetsenbord.'
tagline: Verken of race met de fiets, te voet of te paard door Westminster!
lead: Rijd door Westminster in 3D, langs Trafalgar Square, Whitehall, Parliament Square en Westminster Abbey, met elk gebouw uit OpenStreetMap.
features:
- title: Het echte Londen
  text: 'Dwaal tussen zo’n 2.600 gebouwen, in 3D nagebouwd uit OpenStreetMap: een eerste stuk van het centrum, de rest van de stad volgt nog.'
- title: Westminster
  text: Rijd van Trafalgar Square door Whitehall langs Downing Street, rond Parliament Square onder de Big Ben en Westminster Abbey, en zoek de London Eye aan de overkant van de Theems. Links houden!
- title: 'Een race: Westminster'
  text: Race van Charing Cross door Whitehall langs Downing Street naar Parliament Square en de Big Ben, en terug langs de Theems over de Victoria Embankment.
intro: Londen is de hoofdstad van het Verenigd Koninkrijk en een van de grootste steden van Europa. De Romeinen stichtten het bijna tweeduizend jaar geleden aan de Theems, en het groeide uit tot de hoofdstad van een wereldrijk en een centrum van financiën, theater en musea. In Westminster, het deel waar je door rijdt, liggen het parlement, de Big Ben en de koninklijke parken op een korte wandeling van Trafalgar Square.
famous:
- De Big Ben, het parlement en Westminster Abbey
- Rode dubbeldekkers, zwarte taxi’s en de Underground, de oudste metro ter wereld
- Koninklijke ceremonies zoals de Changing of the Guard en Trooping the Colour
- Gratis nationale musea en galerijen, van het British Museum tot de National Gallery
landmarks:
  big-ben:
    blurb: De grote klok in de klokkentoren van het parlement, een toren die nu Elizabeth Tower heet.
  houses-of-parliament:
    name: Parlementsgebouw
    blurb: Het Palace of Westminster aan de Theems, na de brand van 1834 in gotische stijl herbouwd.
  westminster-abbey:
    blurb: De kerk waar sinds 1066 de Engelse en Britse vorsten gekroond worden.
  trafalgar-square:
    blurb: Nelson op zijn zuil, vier bronzen leeuwen en de National Gallery aan de noordkant.
  national-gallery:
    blurb: De Britse verzameling Europese schilderkunst, gratis te bezoeken, aan de noordkant van Trafalgar Square.
  downing-street:
    blurb: Nummer 10, sinds 1735 het huis van de Britse premiers, achter zwarte hekken aan Whitehall.
  horse-guards:
    blurb: Ruiters van de Household Cavalry staan elke dag op wacht aan Whitehall.
  london-eye:
    blurb: Het reuzenrad aan de overkant van de Theems, gebouwd voor het jaar 2000.
  westminster-bridge:
    blurb: De groene brug over de Theems naast de Big Ben, geschilderd in de kleur van de banken van het Lagerhuis.
credits: Kaartgegevens © OpenStreetMap-bijdragers (ODbL).
