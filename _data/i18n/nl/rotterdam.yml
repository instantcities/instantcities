# _data/cities.yml, the intro of its guide (_data/about/rotterdam.json) and its credits. What this leaves out stays English.
# Its guide is in guide/rotterdam.yml and its landmarks, with their pages, in landmarks/rotterdam.yml.
title: 'Instant Rotterdam: gratis virtuele 3D-rondleiding en game van Rotterdam'
description: 'Maak gratis een virtuele 3D-rondleiding door het centrum van Rotterdam in je browser, en fiets, wandel of galoppeer er daarna zelf door: verken of race, alleen of met twee op één toetsenbord.'
tagline: Verken of race met de fiets, te voet of te paard door Rotterdam, tussen de torens aan de Maas!
lead: Rijd door het centrum van Rotterdam in 3D, na 1940 herbouwd, over de Coolsingel, langs de Markthal, de kubuswoningen, de Oude Haven en de Laurenskerk, met elk gebouw uit OpenStreetMap.
features:
- title: Het echte Rotterdam
  text: Dwaal tussen zo’n 3.300 gebouwen, in 3D nagebouwd uit OpenStreetMap, van de Coolsingel tot de Oude Haven en naar beneden tot aan de Erasmusbrug. De rest van de stad volgt nog.
- title: Een stad van nieuwe gebouwen
  text: Rijd onder de boog van woningen van de Markthal door, langs de kubuswoningen van Piet Blom en het Potlood, bekijk het Witte Huis uit 1898 en de Laurenskerk, en zoek De Verwoeste Stad van Zadkine bij de Leuvehaven.
- title: 'Een race: Blaak en Markthal'
  text: Race over de Coolsingel, langs de Blaak en de Markthal naar de kubuswoningen, de Binnenrotte op en terug over de Hoogstraat langs de Laurenskerk.
intro: 'Rotterdam ligt aan de Nieuwe Maas, waar de Rijn en de Maas naar de Noordzee stromen, in de provincie Zuid-Holland. Op 14 mei 1940 brandden Duitse bommenwerpers op één middag het oude centrum uit, en de stad herbouwde het als een proeftuin voor nieuwe architectuur: de Lijnbaan, de kubuswoningen, de Markthal en de Erasmusbrug. Eromheen ligt de grootste haven van Europa.'
famous:
- Het bombardement van 14 mei 1940, en de moderne stad die daaruit verrees
- De Erasmusbrug, de witte Zwaan over de Maas
- De kubuswoningen van Piet Blom en de boog van woningen van de Markthal
- De grootste haven van Europa, tot aan de Noordzee
- Erasmus, geboren in Rotterdam, en Feyenoord
