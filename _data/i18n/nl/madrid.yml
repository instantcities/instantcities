# madrid's page in Dutch (_layouts/city.html, at /nl/<slug>/): the words of its block in
# _data/cities.yml, the intro of its guide (_data/about/madrid.json) and its credits. What this leaves out stays English.
# Its guide is in guide/madrid.yml and its landmarks, with their pages, in landmarks/madrid.yml.
title: 'Instant Madrid: gratis virtuele 3D-rondleiding en game van Madrid'
description: 'Maak gratis een virtuele 3D-rondleiding door het historische centrum van Madrid in je browser, en fiets, wandel of galoppeer er daarna zelf door: verken of race, alleen of met twee op één toetsenbord.'
tagline: Verken of race met de fiets, te voet of te paard door het oude Madrid!
lead: Rijd door het oude Madrid in 3D, langs de Puerta del Sol, de Plaza Mayor, het Koninklijk Paleis en de Plaza de Oriente, met elk gebouw uit OpenStreetMap.
features:
- title: Het echte Madrid
  text: 'Dwaal tussen zo’n 3.800 gebouwen, in 3D nagebouwd uit OpenStreetMap: een eerste stuk van het historische centrum, de rest van de stad volgt nog.'
- title: Madrid de los Austrias
  text: Begin bij de Puerta del Sol, volg de Calle Mayor langs de Plaza Mayor naar het Koninklijk Paleis en de Almudena, en steek de Plaza de Oriente over naar het Teatro Real.
- title: 'Een race: Sol en Oriente'
  text: Race van de Puerta del Sol over de Calle Mayor naar het Koninklijk Paleis, over de Plaza de Oriente, langs Santo Domingo naar Callao en terug via de Calle del Carmen.
intro: Madrid is de hoofdstad van Spanje en de grootste stad van het land, hoog op de hoogvlakte in het midden. Filips II maakte er in 1561 de zetel van zijn hof van, en de koningen na hem lieten er een koninklijk paleis, de Plaza Mayor met haar arcaden en het Prado na, een van de grote kunstmusea van de wereld. Vandaag kent iedereen Madrid ook van zijn late avonden, zijn tapasbars en zijn voetbal.
famous:
- Het Prado, het Reina Sofía met Picasso’s Guernica, en het Thyssenmuseum
- Het Koninklijk Paleis, de Plaza Mayor en de Puerta del Sol
- Real Madrid en Atlético Madrid
- Late diners, tapas, churros met chocolade en de rommelmarkt van El Rastro op zondag
credits: Kaartgegevens © OpenStreetMap-bijdragers (ODbL).
