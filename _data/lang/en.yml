# The site's words in English: the home page, the cities page, the bar on top, the footers, and the
# few words the city, landmark and art pages share. fr.yml and nl.yml have the same keys in French
# and Dutch; _data/home.yml lists the languages and what stays the same in each.
name: English # in the language menu
locale: en_GB # og:locale

# Where each translated page is in this language. Each is a page at that path that says `lang: en`
# and `ref: <key>` (en/about/index.html, ...); the head links a page to its other languages by its ref.
urls:
  home: /en/
  cities: /en/cities/
  about: /en/about/
  privacy: /en/privacy/
  terms: /en/terms/
  art: /en/art/
  sites: /en/sites/

