# The home page (_layouts/home.html)
title: "Instant Cities: free virtual 3D tours and games of famous cities"
description: "Take free virtual 3D tours of famous cities in your browser, from Paris, Rome and Venice to New York, rebuilt from OpenStreetMap. Then cycle, walk or gallop through their old towns yourself: explore, race or sit back for a guided tour, alone or two players on one keyboard."
tagline: "Take a virtual 3D tour of famous cities, then explore them yourself by bike, on foot or even on horseback."
lead: "Ride through old towns from Bruges to Rome and Istanbul, and on to New York, with every street and building from OpenStreetMap at its real height. Play free in your browser, with nothing to install."
cities_title: "Pick a city"
live_watch: "Watch the tour"
home_watch: "Watch a tour" # the same link on the home page, where the tour is of whichever city shows
features_title: "In every city"
features: # more: the heading of the about page its "Learn more" link goes to
  - { icon: city, title: "The real old town", text: "Explore each city’s historic centre, rebuilt in 3D from OpenStreetMap with every building at its height, past its squares, churches and canals.", more: openstreetmap }
  - { icon: bike, title: "Bike, foot or horse", text: "Ride or race a bike, run on foot or gallop on a horse. Or pick a cow, a tiger, a pig or a unicorn: they are all equally fast and strong.", more: the-game }
  - { icon: compass, title: "Races, quests and tours", text: "Race along real streets, beat short missions against the clock, sit back for a guided 3D tour past the sights, or just ride about and look around.", more: the-game }
features_more: "Learn more…"
# the home page's "About the project" section, which leads to the about page
project_title: "About the project"
project_text:
  - "Instant Cities is an open source project with one aim: to bring a city to life on your screen with as low a barrier as possible. You open a link and you are riding through its streets, with nothing to install, no account and no fast computer needed."
  - "Every city is built from OpenStreetMap and drawn with three.js in the browser, and AI writes most of the code. The code is on GitHub for anyone to read, use and improve."
project_more: "More about the project"
cta_title: "Ready to go?" # the banner at the bottom of the home page
play_note: "Free · no account · works on PC, tablet and phone"
beta: "Still in development: expect some rough edges."
vibe: 'An experiment vibe-coded with love by <a href="https://woutersmet.com/">Wouter</a> & Julia using Claude Opus, OpenAI Sol, <a href="https://threejs.org/">three.js</a>, <a href="https://www.openstreetmap.org/">OpenStreetMap</a> and <a href="https://www.mapillary.com/">Mapillary</a>.'
credits: "Map data © OpenStreetMap contributors (ODbL). Made by"

