title: "Instant Cities : les centres historiques d’Europe en 3D, à vélo, à pied ou à cheval"
description: "Des jeux 3D gratuits dans le navigateur, dans les centres historiques des villes d’Europe, reconstruits à partir d’OpenStreetMap. Parcourez à vélo, à pied ou au galop les vieilles villes de Paris, Rome, Londres, Venise, Prague et d’autres : explorez, faites la course ou laissez-vous guider par une visite, seul ou à deux sur un même clavier."
tagline: "Explorez en 3D les centres historiques d’Europe, à vélo, à pied ou même à cheval."
lead: "Des vieilles villes de Bruges à Rome, chaque rue et chaque bâtiment d’OpenStreetMap à sa vraie hauteur. Gratuit dans votre navigateur, rien à installer."
cities_title: "Choisissez une ville"
live_watch: "Voir la visite"
home_watch: "Voir une visite"
features_title: "Dans chaque ville"
features:
  - { icon: city, title: "La vraie vieille ville", text: "Le centre historique de chaque ville reconstruit à partir d’OpenStreetMap, chaque bâtiment à sa hauteur, avec ses places, ses églises et ses canaux.", more: openstreetmap }
  - { icon: bike, title: "À vélo, à pied ou à cheval", text: "Roulez ou faites la course à vélo, courez à pied ou galopez à cheval. Ou prenez une vache, un tigre, un cochon ou une licorne. Tous sont aussi rapides et forts les uns que les autres.", more: the-game }
  - { icon: compass, title: "Courses, missions et visites", text: "Des courses dans de vraies rues, de courtes missions contre la montre, une visite qui vous fait survoler les monuments, ou simplement flâner et regarder.", more: the-game }
features_more: "En savoir plus…"
project_title: "À propos du projet"
project_text:
  - "Instant Cities est un projet open source avec un seul but : faire vivre une ville sur votre écran le plus simplement possible. Vous ouvrez un lien et vous voilà dans ses rues, sans rien installer, sans compte et sans ordinateur puissant."
  - "Chaque ville est construite à partir d’OpenStreetMap et dessinée avec three.js dans le navigateur, et l’IA écrit la plus grande partie du code. Le code est sur GitHub : chacun peut le lire, l’utiliser et l’améliorer."
project_more: "En savoir plus sur le projet"
cta_title: "Prêt à partir ?"
play_note: "Gratuit · sans compte · sur PC, tablette et téléphone"
beta: "Encore en développement : attendez-vous à quelques imperfections."
vibe: 'Une expérience vibe-codée avec amour par <a href="https://woutersmet.com/">Wouter</a> & Julia avec Claude Opus, OpenAI Sol, <a href="https://threejs.org/">three.js</a>, <a href="https://www.openstreetmap.org/">OpenStreetMap</a> et <a href="https://www.mapillary.com/">Mapillary</a>.'
credits: "Données cartographiques © les contributeurs d’OpenStreetMap (ODbL). Réalisé par"

