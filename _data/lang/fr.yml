title: "Instant Cities : visites virtuelles en 3D et jeux gratuits dans des villes célèbres"
description: "Faites gratuitement la visite virtuelle en 3D de villes célèbres dans votre navigateur, de Paris, Rome et Venise jusqu’à New York, reconstruites à partir d’OpenStreetMap. Puis parcourez vous-même leurs vieilles villes à vélo, à pied ou au galop : explorez, faites la course ou laissez-vous guider, seul ou à deux sur un même clavier."
tagline: "Visitez en 3D des villes célèbres, puis explorez-les vous-même à vélo, à pied ou même à cheval."
lead: "Parcourez les vieilles villes de Bruges à Rome et Istanbul, et jusqu’à New York, avec chaque rue et chaque bâtiment d’OpenStreetMap à sa vraie hauteur. Jouez gratuitement dans votre navigateur, sans rien installer."
cities_title: "Choisissez une ville"
live_watch: "Voir la visite"
home_watch: "Voir une visite"
features_title: "Dans chaque ville"
features:
  - { icon: city, title: "La vraie vieille ville", text: "Explorez le centre historique de chaque ville, reconstruit en 3D à partir d’OpenStreetMap avec chaque bâtiment à sa hauteur, en passant par ses places, ses églises et ses canaux.", more: openstreetmap }
  - { icon: bike, title: "À vélo, à pied ou à cheval", text: "Roulez ou faites la course à vélo, courez à pied ou galopez à cheval. Ou prenez une vache, un tigre, un cochon ou une licorne : tous sont aussi rapides et forts.", more: the-game }
  - { icon: compass, title: "Courses, missions et visites", text: "Faites la course dans de vraies rues, relevez de courtes missions contre la montre, laissez-vous guider par une visite en 3D devant les monuments, ou baladez-vous simplement.", more: the-game }
features_more: "En savoir plus…"
project_title: "À propos du projet"
project_text:
  - "Instant Cities est un projet open source avec un seul but : faire vivre une ville sur votre écran le plus simplement possible. Vous ouvrez un lien et vous voilà dans ses rues, sans rien installer, sans compte et sans ordinateur puissant."
  - "Chaque ville est construite à partir d’OpenStreetMap et dessinée avec three.js dans le navigateur, et l’IA écrit la plus grande partie du code. Le code est sur GitHub : chacun peut le lire, l’utiliser et l’améliorer."
project_more: "En savoir plus sur le projet"
cta_title: "Prêt à partir ?"
play_note: "Gratuit · sans compte · sur PC, tablette et téléphone"
beta: "Encore en développement : attendez-vous à quelques imperfections."
vibe: 'Une expérience vibe-codée avec amour par <a href="https://woutersmet.com/">Wouter</a> & Julia avec Claude Opus, OpenAI Sol, <a href="https://threejs.org/">three.js</a>, <a href="https://www.openstreetmap.org/">OpenStreetMap</a> et <a href="https://www.mapillary.com/">Mapillary</a>.'
credits: "Données cartographiques © les contributeurs d’OpenStreetMap (ODbL). Réalisé par"

