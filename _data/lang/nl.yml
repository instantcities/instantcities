title: "Instant Cities: gratis virtuele 3D-rondleidingen en games in beroemde steden"
description: "Maak gratis een virtuele 3D-rondleiding door beroemde steden in je browser, van Parijs, Rome en Venetië tot New York, nagebouwd uit OpenStreetMap. Fiets, wandel of galoppeer daarna zelf door hun oude binnensteden: verken, race of laat je rondleiden, alleen of met twee op één toetsenbord."
tagline: "Bezoek beroemde steden in 3D en verken ze daarna zelf, met de fiets, te voet of zelfs te paard."
lead: "Rijd door oude binnensteden van Brugge tot Rome en Istanbul, en verder tot New York, met elke straat en elk gebouw uit OpenStreetMap op zijn echte hoogte. Speel gratis in je browser, zonder iets te installeren."
cities_title: "Kies een stad"
live_watch: "Bekijk de rondleiding"
home_watch: "Bekijk een rondleiding"
features_title: "In elke stad"
features:
  - { icon: city, title: "De echte oude stad", text: "Verken het historische centrum van elke stad, in 3D nagebouwd uit OpenStreetMap met elk gebouw op zijn hoogte, langs zijn pleinen, kerken en grachten.", more: openstreetmap }
  - { icon: bike, title: "Fiets, te voet of te paard", text: "Fiets of race op de fiets, loop te voet of galoppeer op een paard. Of kies een koe, een tijger, een varken of een eenhoorn: ze zijn allemaal even snel en sterk.", more: the-game }
  - { icon: compass, title: "Races, opdrachten en rondleidingen", text: "Race door echte straten, speel korte opdrachten tegen de klok, laat je in 3D langs de bezienswaardigheden rondleiden, of rijd gewoon wat rond en kijk.", more: the-game }
features_more: "Meer weten…"
project_title: "Over het project"
project_text:
  - "Instant Cities is een opensourceproject met één doel: een stad zo laagdrempelig mogelijk tot leven brengen op je scherm. Je opent een link en je rijdt door haar straten, zonder iets te installeren, zonder account en zonder snelle computer."
  - "Elke stad is gebouwd uit OpenStreetMap en wordt met three.js in de browser getekend, en AI schrijft het grootste deel van de code. De code staat op GitHub, voor iedereen om te lezen, te gebruiken en te verbeteren."
project_more: "Meer over het project"
cta_title: "Klaar om te vertrekken?"
play_note: "Gratis · geen account · werkt op pc, tablet en telefoon"
beta: "Nog in ontwikkeling: hier en daar kan iets haperen."
vibe: 'Een experiment, met liefde gevibecodeerd door <a href="https://woutersmet.com/">Wouter</a> & Julia met Claude Opus, OpenAI Sol, <a href="https://threejs.org/">three.js</a>, <a href="https://www.openstreetmap.org/">OpenStreetMap</a> en <a href="https://www.mapillary.com/">Mapillary</a>.'
