title: "Instant Cities: the historic centres of Europe in 3D, by bike, on foot or on horseback"
description: "Free 3D browser games set in the historic centres of European cities, rebuilt from OpenStreetMap. Cycle, walk or gallop through the old towns of Paris, Rome, London, Venice, Prague and more: explore, race or sit back for a tour, alone or two players on one keyboard."
tagline: "The historic centres of Europe in 3D, to explore or race by bike, on foot or on horseback."
lead: "Old towns from Bruges to Rome, every street and building from OpenStreetMap at its real height. Free in your browser, nothing to install."
