# One block per site: a famous place that is not a city, with a game of its own. Its card on the
# sites page (/sites/) and its page (_layouts/site.html, at /sites/<id>/). The game is at
# /<id>/play/ (made by tools/pages.mjs). The pictures are assets/img/sites/<id>.jpg (the hero and
# the card) and <id>-1.jpg, <id>-2.jpg, ... (the screenshots). A new site needs a block here, a page
# sites/<id>/index.html saying `layout: site` and `site: <id>`, and a line in sitemap.xml's loop
# (it reads this file). English only, like the art pages.
# A site marked `soon: true` has no game yet: it shows as a card without a page or a picture under
# "Coming soon" on the sites page, and needs only id, name, place and card.
- id: taj-mahal
  name: Taj Mahal
  place: Agra, India
  game: Instant Taj Mahal
  title: "Instant Taj Mahal: a free virtual 3D tour and game of the Taj Mahal"
  description: "Take a free virtual 3D tour of the Taj Mahal and its gardens in your browser, then walk, cycle or ride through them yourself: explore or race, alone or two players on one keyboard."
  tagline: "Walk or race through the gardens of the Taj Mahal, up to the white marble tomb."
  lead: "The tomb on its platform with the four minarets, the mosque and the Jawab on either side, the long canal, and the great gate you come in by."
  card: "The tomb with its dome and four minarets at the end of the long canal, between the mosque and the Jawab."
  features:
    - { icon: compass, title: "The tomb and its garden", text: "Walk up the canal from the great gate to the white marble platform, past the four quarters of the garden. The tomb, the minarets, the mosque and the gate are modelled by hand from their measurements." }
    - { icon: flag, title: "A race round the garden", text: "Run, ride or gallop up the central walk, along the front of the platform, down the east side and back to the gate, over a path of sandstone slabs." }
    - { icon: map, title: "From OpenStreetMap", text: "The garden, its walls, the canals and the forecourt south of the gate are drawn from OpenStreetMap, with the garden's paths added by hand." }
  facts:
    - { label: "Built", text: "1632 to 1653, by order of the Mughal emperor Shah Jahan for his wife Mumtaz Mahal" }
    - { label: "Height", text: "73 metres from the garden to the tip of the finial" }
    - { label: "Garden", text: "A charbagh: four quarters round a long canal, 300 metres wide" }
    - { label: "In the game", text: "The tomb, four minarets, the mosque, the Jawab, the great gate, the garden wall and the forecourt" }
  credits: "Map data © OpenStreetMap contributors (ODbL)."
- id: angkor-wat
  name: Angkor Wat
  place: Siem Reap, Cambodia
  game: Instant Angkor Wat
  title: "Instant Angkor Wat: a free virtual 3D tour and game of Angkor Wat"
  description: "Take a free virtual 3D tour of Angkor Wat in your browser, then walk, cycle or ride across the causeway and round the temple yourself: explore or race, alone or two players on one keyboard."
  tagline: "Walk or race over the causeway, past the moat and the towers of Angkor Wat."
  lead: "The moat, the long causeway and the gate at its end, and the temple itself: three levels of galleries rising to five towers."
  card: "The moat and the causeway, the outer gate, and the three levels and five towers of the temple."
  features:
    - { icon: castle, title: "The temple and its moat", text: "Cross the moat, go through the western gate and follow the stone road to the temple. Its three levels, galleries and five towers are modelled by hand on the measurements in OpenStreetMap." }
    - { icon: flag, title: "A race along the causeway", text: "From the far side of the moat through the gate and up to the temple, then along its north side to the east, once, from a start gate to a finish gate." }
    - { icon: map, title: "From OpenStreetMap", text: "The moat, the paths, the ponds and the outer enclosure come from OpenStreetMap." }
  facts:
    - { label: "Built", text: "Early 12th century, for the Khmer king Suryavarman II, first as a Hindu temple and later a Buddhist one" }
    - { label: "Size", text: "The moat is 190 metres wide and the outer wall encloses about 200 hectares" }
    - { label: "Towers", text: "Five, in a quincunx; the middle one is 65 metres high" }
    - { label: "In the game", text: "The moat and the causeway, the western gopura and the temple's three levels with their galleries and towers" }
  credits: "Map data © OpenStreetMap contributors (ODbL)."
- id: pompeii
  name: Pompeii
  place: Campania, Italy
  game: Instant Pompeii
  title: "Instant Pompeii: a free virtual 3D tour and game of Pompeii"
  description: "Take a free virtual 3D tour of Pompeii in your browser, then walk, cycle or ride through its Roman streets yourself: explore or race, alone or two players on one keyboard."
  tagline: "Walk or race through the Roman streets of Pompeii, with Vesuvius behind."
  lead: "The streets of the town as the excavation maps them, the Forum with the Temple of Jupiter, the baths and the houses, and the amphitheatre at the east end."
  card: "The Roman town buried by Vesuvius in AD 79: its paved streets, the Forum and the amphitheatre."
  features:
    - { icon: city, title: "The town, street by street", text: "About 1,100 houses and shops along the streets of the excavation, with the Via dell'Abbondanza, the Via Stabiana and the Via del Foro, paved with basalt blocks." }
    - { icon: castle, title: "The Forum and the amphitheatre", text: "The Forum's two colonnades with the Temple of Jupiter at its end, and the amphitheatre, the oldest stone one there is, are modelled by hand. Vesuvius stands on the horizon where it really is." }
    - { icon: flag, title: "A race round the middle of town", text: "A loop of about a kilometre from the Forum along the Via dell'Abbondanza and back by the Via Stabiana and the Via della Fortuna." }
  facts:
    - { label: "Buried", text: "24 August AD 79, under ash and pumice from Vesuvius; dug out from the 1700s on" }
    - { label: "Size", text: "About 66 hectares inside the walls, with some 11,000 people living there" }
    - { label: "Amphitheatre", text: "Built about 70 BC for around 20,000 people, the oldest stone amphitheatre that survives" }
    - { label: "In the game", text: "The streets and houses, the Forum with its colonnades and the Temple of Jupiter, the amphitheatre and Vesuvius" }
  credits: "Map data © OpenStreetMap contributors (ODbL)."
- id: stonehenge
  name: Stonehenge
  place: Wiltshire, England
  game: Instant Stonehenge
  title: "Instant Stonehenge: a free virtual 3D tour and game of Stonehenge"
  description: "Take a free virtual 3D tour of Stonehenge in your browser, then walk, cycle or ride round the stones yourself: explore or race, alone or two players on one keyboard."
  tagline: "Walk or race round the stones of Stonehenge, on Salisbury Plain."
  lead: "The sarsen circle with its lintels, the horseshoe of trilithons, the bluestones, the Heel Stone on the line of the midsummer sunrise, and the Avenue running away to the north-east."
  card: "The ring of standing stones on Salisbury Plain, with the Heel Stone on the line of the midsummer sunrise."
  features:
    - { icon: castle, title: "The stones as they stand", text: "The 17 sarsens that are still up with their lintels, the trilithons in their horseshoe, the bluestones, the Altar Stone, the Heel Stone, the Station Stones, the Aubrey holes, and the bank and ditch, modelled by hand from the plan." }
    - { icon: flag, title: "A race round the stones", text: "Once round the monument on a path outside the bank and ditch, 750 metres, past the Heel Stone and the start of the Avenue." }
    - { icon: map, title: "From OpenStreetMap", text: "The fields, the tracks and the trees round it come from OpenStreetMap; the paths are drawn in by hand." }
  facts:
    - { label: "Built", text: "From about 3000 BC, in stages over some 1,500 years" }
    - { label: "Sarsens", text: "30 uprights and 30 lintels in a circle 33 metres across; 17 uprights and 6 lintels still stand" }
    - { label: "Bluestones", text: "About 2 metres high, from the Preseli Hills in Wales, some 250 kilometres away" }
    - { label: "In the game", text: "The stone circle, the trilithons, the bluestones, the Heel Stone and the Slaughter Stone, the Aubrey holes, the bank and the ditch" }
  credits: "Map data © OpenStreetMap contributors (ODbL)."
