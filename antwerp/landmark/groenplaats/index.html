<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Instant Cities</title>
  <meta name="robots" content="noindex">
  <link rel="alternate" hreflang="en" href="https://instantcities.net/en/antwerp/landmark/groenplaats/">
  <link rel="alternate" hreflang="fr" href="https://instantcities.net/fr/anvers/monument/groenplaats/">
  <link rel="alternate" hreflang="nl" href="https://instantcities.net/nl/antwerpen/bezienswaardigheid/groenplaats/">
  <script>
    {
      const urls = { "en": "/en/antwerp/landmark/groenplaats/", "fr": "/fr/anvers/monument/groenplaats/", "nl": "/nl/antwerpen/bezienswaardigheid/groenplaats/" };
      let lang;
      try { lang = localStorage.getItem('site-lang'); } catch {}
      if (!urls[lang]) lang = (navigator.languages || [navigator.language]).map(l => String(l).slice(0, 2).toLowerCase()).find(l => urls[l]) || 'en';
      location.replace(urls[lang] + location.search + location.hash);
    }
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/en/antwerp/landmark/groenplaats/"></noscript>
</head>
<body>
  <p>
    <a href="/en/antwerp/landmark/groenplaats/" hreflang="en" lang="en">English</a>
    <a href="/fr/anvers/monument/groenplaats/" hreflang="fr" lang="fr">Français</a>
    <a href="/nl/antwerpen/bezienswaardigheid/groenplaats/" hreflang="nl" lang="nl">Nederlands</a>
  </p>
</body>
</html>
